<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<title>SOGO SHOSHA 〜総合商社経営〜</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e14; --bg2:#121722; --card:#161c28; --card2:#1d2432;
  --line:#28303f; --line2:#374056;
  --fg:#e8edf6; --dim:#9aa5b8; --dim2:#6b7688;
  --gold:#d9b25f; --gold2:#f0d296;
  --up:#4bd18a; --down:#ff6b6b; --info:#5aa9ff; --warn:#ffb454;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
input{font-family:inherit}

/* ---------- title ---------- */
#title{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,#1b2334 0%,#0b0e14 60%);
  padding:24px;overflow:auto;
}
#title.hide{display:none}
.title-inner{width:100%;max-width:380px;text-align:center}
.title-inner .tag{font-size:9.5px;letter-spacing:.34em;color:var(--gold);margin:0 0 14px}
.title-inner h1{
  font-size:46px;line-height:.98;margin:0;letter-spacing:.06em;font-weight:800;
  background:linear-gradient(180deg,#fff 10%,var(--gold2) 55%,#a5813a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.title-inner .sub{margin:10px 0 0;font-size:14px;letter-spacing:.24em;color:var(--dim)}
.title-inner .lead{margin:22px 0 26px;font-size:12.5px;color:var(--dim);line-height:1.9}
.field{display:block;text-align:left;margin-bottom:16px}
.field span{display:block;font-size:10.5px;color:var(--dim2);letter-spacing:.14em;margin-bottom:6px}
.field input{
  width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line2);
  border-radius:11px;color:var(--fg);font-size:16px;outline:none;
}
.field input:focus{border-color:var(--gold)}
.btn-primary{
  width:100%;padding:15px;border:0;border-radius:11px;font-size:15px;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(180deg,var(--gold2),#b8913f);color:#241a05;
}
.btn-ghost{
  width:100%;padding:12px;margin-top:10px;border:1px solid var(--line2);border-radius:11px;
  background:transparent;color:var(--dim);font-size:13px;
}
.credit{margin-top:26px;font-size:10.5px;color:var(--dim2);line-height:1.9}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
#hud{background:linear-gradient(180deg,#151b28,#10141d);border-bottom:1px solid var(--line);padding:10px 12px 0;flex:0 0 auto}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-id{display:flex;align-items:center;gap:7px;min-width:0}
#hud-company{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-badge{
  flex:0 0 auto;font-size:9.5px;padding:3px 7px;border-radius:5px;letter-spacing:.06em;
  background:rgba(217,178,95,.14);color:var(--gold2);border:1px solid rgba(217,178,95,.35);
}
.hud-date{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 8px}
.hud-stats .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-width:0}
.hud-stats label{display:block;font-size:9px;color:var(--dim2);letter-spacing:.05em}
.hud-stats b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-bar{position:relative;height:14px;background:#0a0d13;border-top:1px solid var(--line);margin:0 -12px}
#hud-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#8a6d2c,var(--gold));transition:width .5s}
#hud-bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#e9dcbd;letter-spacing:.06em}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}

#turnbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--bg2);border-top:1px solid var(--line);
}
.slots{flex:0 0 auto}
#slot-label{display:block;font-size:9px;color:var(--dim2);letter-spacing:.06em}
#slot-dots{display:flex;gap:3px;margin-top:3px}
#slot-dots i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:block}
#slot-dots i.on{background:var(--gold);box-shadow:0 0 6px rgba(217,178,95,.6)}
.btn-next{
  flex:1 1 auto;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(180deg,#2f6ee0,#1f4fae);color:#fff;box-shadow:0 2px 0 #16336f;
}
.btn-next:active{transform:translateY(1px);box-shadow:0 1px 0 #16336f}
.btn-next.warn{background:linear-gradient(180deg,#e0803a,#a85a20);box-shadow:0 2px 0 #6f3a13}

#tabs{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:#0a0d13;border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
#tabs button{background:none;border:0;padding:7px 0 8px;color:var(--dim2);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button i{font-style:normal;font-size:17px;line-height:1}
#tabs button span{font-size:9px;letter-spacing:.02em}
#tabs button.on{color:var(--gold2)}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold)}
#tabs button .badge{
  position:absolute;top:3px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;
  background:var(--down);color:#fff;border-radius:8px;font-size:9px;line-height:15px;font-weight:700;
}

/* ---------- common blocks ---------- */
.sect{margin:0 0 8px;font-size:10px;letter-spacing:.16em;color:var(--dim2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.tap:active{background:var(--card2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--dim)}
.small{font-size:11px}
.tiny{font-size:10px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold2)} .info{color:var(--info)} .warn{color:var(--warn)}
.empty{text-align:center;color:var(--dim2);font-size:12px;padding:34px 10px;line-height:2}

.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
.kv .k{color:var(--dim)}
.kv .v{font-variant-numeric:tabular-nums;text-align:right}

.pill{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.04em}
.pill.t-trade{color:#7fd7ff;border-color:#2c5a76;background:rgba(90,169,255,.08)}
.pill.t-project{color:#ffc98a;border-color:#7a5628;background:rgba(255,180,84,.08)}
.pill.t-concession{color:#c9a0ff;border-color:#5a3f86;background:rgba(170,120,255,.08)}
.pill.t-investment{color:#8ce8b4;border-color:#2f6b4c;background:rgba(75,209,138,.08)}

.deal{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.deal:active{background:var(--card2)}
.deal-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal-t{font-size:13px;font-weight:600;line-height:1.35}
.deal-m{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.deal-f{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:11px}

.bar{height:5px;background:#0a0d13;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6ee0,#5aa9ff)}
.bar.g>i{background:linear-gradient(90deg,#8a6d2c,var(--gold))}

.mkt{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.mkt .m{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.mkt .m .n{font-size:10px;color:var(--dim)}
.mkt .m .p{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.mkt .m .p b{font-size:14px}
.mkt .m .p em{font-style:normal;font-size:10.5px}

.divrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.divrow:last-child{border-bottom:0}
.divrow .ic{font-size:19px;width:24px;text-align:center;flex:0 0 auto}
.divrow .nm{flex:1 1 auto;min-width:0}
.divrow .nm b{display:block;font-size:12.5px;font-weight:600}
.divrow .nm .bar{margin-top:5px}
.divrow .lv{flex:0 0 auto;text-align:right}
.divrow .lv b{font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}
.act{flex:0 0 auto;border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:6px 9px;font-size:11px;white-space:nowrap}
.act:active{background:#2a3242}
.act[disabled]{opacity:.35}
.act.gold{border-color:#7d6229;background:rgba(217,178,95,.12);color:var(--gold2)}

.logline{font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.logline:last-child{border-bottom:0}
.logline .t{color:var(--dim2);flex:0 0 58px;font-variant-numeric:tabular-nums}
.logline .b{flex:1 1 auto}

.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:22px;text-align:center;font-size:15px;font-weight:700;color:var(--dim2);flex:0 0 auto}
.rank.me{background:rgba(217,178,95,.07);margin:0 -12px;padding:9px 12px;border-radius:6px}
.rank.me .no{color:var(--gold)}
.rank .nm{flex:1 1 auto;font-size:13px}
.rank .vl{font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
#modal-root .backdrop{position:absolute;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(3px)}
.modal{
  position:relative;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:16px;line-height:1.35}
.modal h3{margin:16px 0 7px;font-size:10px;letter-spacing:.16em;color:var(--dim2)}
.modal p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.75}
.mbtns{display:flex;gap:8px;margin-top:16px}
.mbtns button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:13.5px;font-weight:600}
.mbtns button.pri{border:0;background:linear-gradient(180deg,var(--gold2),#b8913f);color:#241a05}
.mbtns button.blue{border:0;background:linear-gradient(180deg,#2f6ee0,#1f4fae);color:#fff}
.mbtns button[disabled]{opacity:.4}

.aggr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.aggr button{padding:9px 2px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:10.5px;line-height:1.5}
.aggr button.on{border-color:var(--gold);background:rgba(217,178,95,.14);color:var(--gold2)}
.aggr button b{display:block;font-size:13px}

.gauge{height:8px;background:#0a0d13;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.gauge>i{display:block;height:100%;transition:width .2s}

.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:44px;height:40px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-size:18px}
.stepper .val{flex:1;text-align:center;font-size:19px;font-variant-numeric:tabular-nums;font-weight:700}
.range{width:100%;margin:6px 0 2px;accent-color:var(--gold)}

.evt-ic{font-size:34px;text-align:center;margin-bottom:6px}
.fy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fy-grid .b{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px}
.fy-grid .b label{display:block;font-size:9.5px;color:var(--dim2);margin-bottom:2px}
.fy-grid .b b{font-size:15px;font-variant-numeric:tabular-nums}

@media(min-width:520px){
  #view{padding:14px 16px 22px}
  .hud-stats b{font-size:13.5px}
}

</style>
</head>
<body>

<div id="app" hidden>
  <header id="hud">
    <div class="hud-top">
      <div class="hud-id">
        <span id="hud-stage" class="stage-badge">街の貿易商</span>
        <span id="hud-company">—</span>
      </div>
      <div class="hud-date"><span id="hud-date">2026年4月</span></div>
    </div>
    <div class="hud-stats">
      <div class="stat"><label>現金</label><b id="hud-cash">—</b></div>
      <div class="stat"><label>純資産</label><b id="hud-equity">—</b></div>
      <div class="stat"><label>前月純利益</label><b id="hud-profit">—</b></div>
      <div class="stat"><label>格付</label><b id="hud-rating">—</b></div>
    </div>
    <div class="hud-bar"><div id="hud-bar-fill"></div><span id="hud-bar-label"></span></div>
  </header>

  <main id="view"></main>

  <div id="turnbar">
    <div class="slots"><span id="slot-label">商談枠</span><div id="slot-dots"></div></div>
    <button id="btn-next" class="btn-next">▶ 翌月へ</button>
  </div>

  <nav id="tabs">
    <button data-tab="dash" class="on"><i>📊</i><span>経営</span></button>
    <button data-tab="market"><i>🤝</i><span>商談</span></button>
    <button data-tab="active"><i>📦</i><span>進行中</span></button>
    <button data-tab="assets"><i>💼</i><span>投資</span></button>
    <button data-tab="admin"><i>🏢</i><span>本社</span></button>
    <button data-tab="rank"><i>🏆</i><span>順位</span></button>
  </nav>
</div>

<div id="modal-root" hidden>
  <div class="backdrop"></div>
  <div class="modal" id="modal-box"></div>
</div>

<div id="title">
  <div class="title-inner">
    <p class="tag">TURN-BASED TRADING HOUSE SIM</p>
    <h1>SOGO<br>SHOSHA</h1>
    <p class="sub">〜総合商社経営〜</p>
    <p class="lead">ラーメンから航空機まで。<br>一介の貿易商から、世界最大の総合商社へ。</p>
    <label class="field"><span>商社名</span>
      <input id="input-company" maxlength="12" placeholder="蒼龍商事" value="蒼龍商事">
    </label>
    <button id="btn-start" class="btn-primary">創業する</button>
    <button id="btn-continue" class="btn-ghost" hidden>続きから</button>
    <p class="credit">市況・為替・地政学リスクを読み、<br>トレード / 権益 / 事業投資で稼ぐターン制経営SLG</p>
  </div>
</div>

<script>
/* =========================================================
 *  SOGO SHOSHA - static game data
 *  金額の単位はすべて「億円」
 * ======================================================= */
window.GAME = (function () {
  const D = {};

  /* ---- 商品市況 -------------------------------------- */
  D.COMMODITIES = {
    crude:   { name: '原油',     vol: 0.085, drift: 0.0004 },
    lng:     { name: 'LNG',      vol: 0.095, drift: 0.0006 },
    iron:    { name: '鉄鉱石',   vol: 0.070, drift: 0.0002 },
    copper:  { name: '銅',       vol: 0.062, drift: 0.0008 },
    grain:   { name: '穀物',     vol: 0.072, drift: 0.0003 },
    freight: { name: '海上運賃', vol: 0.105, drift: 0.0001 },
  };
  D.COMM_KEYS = Object.keys(D.COMMODITIES);

  /* ---- 営業本部 -------------------------------------- */
  D.DIVISIONS = [
    { id: 'energy',    name: 'エネルギー本部',       short: 'エネルギー', icon: '⛽', comms: ['crude', 'lng'] },
    { id: 'metals',    name: '金属資源本部',         short: '金属資源',   icon: '⛏️', comms: ['iron', 'copper'] },
    { id: 'chem',      name: '化学品本部',           short: '化学品',     icon: '🧪', comms: ['crude', 'freight'] },
    { id: 'machinery', name: '機械・インフラ本部',   short: '機械',       icon: '🏗️', comms: ['copper', 'freight'] },
    { id: 'food',      name: '食料本部',             short: '食料',       icon: '🌾', comms: ['grain', 'freight'] },
    { id: 'consumer',  name: '生活産業・次世代本部', short: '生活産業',   icon: '🏬', comms: ['grain', 'copper'] },
  ];
  D.DIV_BY_ID = {};
  D.DIVISIONS.forEach(function (d) { D.DIV_BY_ID[d.id] = d; });

  /* ---- 成長ステージ ---------------------------------- */
  /* goal = 純資産(億円) */
  D.STAGES = [
    { name: '街の貿易商',   title: '創業',           goal: 200,     scale: 1 },
    { name: '専門商社',     title: '専業で名を上げる', goal: 900,    scale: 4 },
    { name: '中堅商社',     title: '総合化への布石',  goal: 4500,    scale: 18 },
    { name: '大手商社',     title: '財閥系に並ぶ',    goal: 25000,   scale: 90 },
    { name: '総合商社',     title: '五大商社の一角',  goal: 130000,  scale: 420 },
    { name: '世界最大の商社', title: 'グローバル覇権', goal: Infinity, scale: 1800 },
  ];

  /* ---- 拠点 ------------------------------------------ */
  D.REGIONS = [
    { id: 'jp',   name: '国内',       flag: '🇯🇵' },
    { id: 'asia', name: '東南アジア', flag: '🌏' },
    { id: 'cn',   name: '中国',       flag: '🇨🇳' },
    { id: 'me',   name: '中東',       flag: '🕌' },
    { id: 'oc',   name: '豪州',       flag: '🇦🇺' },
    { id: 'na',   name: '北米',       flag: '🇺🇸' },
    { id: 'sa',   name: '南米',       flag: '🌎' },
    { id: 'eu',   name: '欧州',       flag: '🇪🇺' },
    { id: 'af',   name: 'アフリカ',   flag: '🌍' },
    { id: 'in',   name: 'インド',     flag: '🇮🇳' },
  ];
  D.REGION_BY_ID = {};
  D.REGIONS.forEach(function (r) { D.REGION_BY_ID[r.id] = r; });

  /* ---- 案件テンプレ ---------------------------------- */
  /* type: trade(トレード) / project(EPC) / concession(権益) / investment(事業投資) */
  D.TYPE_LABEL = {
    trade: 'トレード', project: 'プロジェクト',
    concession: '資源権益', investment: '事業投資',
  };
  D.TYPE_DESC = {
    trade: '運転資金を拠出し、口銭（マージン）を抜く短期取引。市況で採算が振れる。',
    project: 'EPC/インフラ案件。毎月工事原価が出て、竣工時に一括で代金を回収する。',
    concession: '鉱区・権益の取得。巨額の初期投資と引き換えに長期の配当を得るが、市況低迷時は減損リスクを負う。',
    investment: '事業会社への出資。安定した持分法配当が毎月入り、投資先は自律的に成長する。',
  };

  D.ITEMS = {
    trade: {
      energy:    ['原油カーゴ', 'LNGスポット', 'ナフサ', '一般炭', '低硫黄重油', 'SAF原料'],

<script>
/* =========================================================
 *  SOGO SHOSHA - game engine
 *  金額単位: 億円 / 会計は純資産＝現金＋簿価資産－有利子負債 で一貫
 * ======================================================= */
window.ENGINE = (function () {
  const D = window.GAME;
  const SAVE_KEY = 'sogoshosha.save.v1';

  /* ---------------- utils ---------------- */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function wpick(list, key) {
    let t = 0;
    for (const x of list) t += x[key];
    let r = Math.random() * t;
    for (const x of list) { r -= x[key]; if (r <= 0) return x; }
    return list[list.length - 1];
  }
  let _uid = 1;
  function uid() { return 'd' + (_uid++) + '_' + Math.floor(Math.random() * 1e6); }

  function money(v) {
    const a = Math.abs(v);
    const sg = v < 0 ? '-' : '';
    if (a >= 10000) return sg + (a / 10000).toFixed(a >= 100000 ? 1 : 2) + '兆';
    if (a >= 1000) return sg + Math.round(a).toLocaleString('ja-JP') + '億';
    if (a >= 10) return sg + a.toFixed(0) + '億';
    return sg + a.toFixed(1) + '億';
  }
  function signed(v) { return (v >= 0 ? '+' : '') + money(v); }
  function pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + '%'; }

  /* ---------------- state ---------------- */
  let S = null;

  function rating() {
    for (const r of D.RATINGS) if (S.credit >= r.min) return r;
    return D.RATINGS[D.RATINGS.length - 1];
  }
  function stage() { return D.STAGES[S.stage]; }
  function scale() { return stage().scale; }
  function dateLabel(y, m) { return y + '年' + m + '月'; }
  function now() { return dateLabel(S.y, S.m); }

  function log(text, kind) {
    S.log.unshift({ t: S.y + '/' + ('0' + S.m).slice(-2), b: text, k: kind || '' });
    if (S.log.length > 160) S.log.length = 160;
  }

  /* 市況ファクター: 対象商品の指数平均 /100 */
  function mfac(comms) {
    if (!comms || !comms.length) return 1;
    let s = 0;
    for (const c of comms) s += S.mk[c];
    return (s / comms.length) / 100;
  }
  function fxFac() { return 0.72 + 0.28 * (S.fx / 145); }

  function divOf(id) { return S.div[id]; }
  function hasOffice(r) { return S.offices.indexOf(r) >= 0; }

  function capacity() { return Math.min(30, 4 + Math.floor(Math.sqrt(S.staff) * 1.2)); }
  function slotsMax() {
    return clamp(3 + Math.floor(Math.sqrt(S.staff) / 3.5) + Math.floor(S.offices.length / 3), 3, 9);
  }
  function borrowLimit() { return Math.max(0, equity() * rating().lev - S.debt); }
  function interestRate() { return Math.max(0.004, S.rateBase + rating().spread); }

  function bookAssets() {
    let v = 0;
    for (const a of S.assets) v += a.value;
    for (const a of S.active) {
      if (a.type === 'trade') v += a.capital;
      else if (a.type === 'project') v += a.wip - a.adv;
    }
    return v;
  }
  function equity() { return S.cash + bookAssets() - S.debt; }
  function eqAfterRaw() { return Math.max(1, equity()); }

  /* ---------------- new game ---------------- */
  function newGame(name) {
    _uid = 1;
    S = {
      company: (name || '蒼龍商事').slice(0, 12),
      y: 2026, m: 4, turn: 0,
      stage: 0,
      cash: 75, debt: 0,
      staff: 14, wageRate: 0.012,
      credit: 42,
      offices: ['jp'],
      div: {}, mk: {}, mkPrev: {},
      fx: 148, fxPrev: 148, rateBase: 0.022,
      market: [], active: [], assets: [],
      slots: 3,
      log: [], monthly: [],
      fy: { profit: 0, startEquity: 75, deals: 0 },
      fyHistory: [],
      rivals: D.RIVALS.map(function (r) { return { name: r.name, eq: r.base, g: r.g }; }),
      mod: { impair: 1, creditRisk: 1, delay: 1 },
      stats: { won: 0, lost: 0, done: 0, impair: 0, defaults: 0, cumProfit: 0 },
      lastProfit: 0, lastCapex: 0, lastLedger: null,
      pend: { capex: 0, gain: 0 },
      over: false, cleared: false, insolvent: 0,
      pendingEvent: null,
    };
    D.DIVISIONS.forEach(function (d, i) { S.div[d.id] = { lv: i < 2 ? 2 : 1, exp: 0 }; });
    D.COMM_KEYS.forEach(function (k) { S.mk[k] = 100 + randn() * 6; S.mkPrev[k] = S.mk[k]; });
    S.slots = slotsMax();
    for (let i = 0; i < 6; i++) S.market.push(genDeal());
    log('創業。東京に本社を構えた。', 'gold');
    return S;
  }

  /* ---------------- deal generation ---------------- */
  function typeWeights() {
    const s = S.stage;
    if (s === 0) return [{ t: 'trade', w: 76 }, { t: 'project', w: 12 }, { t: 'investment', w: 9 }, { t: 'concession', w: 3 }];
    if (s === 1) return [{ t: 'trade', w: 62 }, { t: 'project', w: 16 }, { t: 'investment', w: 14 }, { t: 'concession', w: 8 }];
    if (s === 2) return [{ t: 'trade', w: 50 }, { t: 'project', w: 18 }, { t: 'investment', w: 18 }, { t: 'concession', w: 14 }];
    return [{ t: 'trade', w: 40 }, { t: 'project', w: 18 }, { t: 'investment', w: 22 }, { t: 'concession', w: 20 }];
  }

  function genDeal(big) {
    const sc = scale();
    const type = wpick(typeWeights(), 'w').t;
    const dv = pick(D.DIVISIONS);
    // 拠点のある地域が出やすい
    let reg;
    if (Math.random() < 0.45 && S.offices.length) reg = pick(S.offices);
    else reg = pick(D.REGIONS).id;
    const item = pick(D.ITEMS[type][dv.id]);
    const sm = big ? rnd(2.4, 4.0) : rnd(0.75, 1.35);
    const rg = D.REGION_BY_ID[reg];

    const d = {
      id: uid(), type: type, div: dv.id, region: reg, big: !!big,
      name: rg.name + '／' + item,
      comms: dv.comms.slice(),
      ttl: ri(2, 5),
      rivals: ri(1, 5),
      diff: rnd(0.45, 1.45) + (type === 'concession' ? 0.25 : 0) + (big ? 0.35 : 0),
    };

    if (type === 'trade') {
      d.volume = sc * rnd(30, 110) * sm;
      d.marginRate = rnd(0.025, 0.075);
      d.months = ri(1, 4);
      d.capital = d.volume * rnd(0.16, 0.30);
      d.risk = rnd(0.006, 0.042);
      d.upfront = d.capital;
      d.exposure = d.capital;
    } else if (type === 'project') {
      d.contract = sc * rnd(48, 200) * sm;
      d.marginRate = rnd(0.05, 0.17);
      d.months = ri(6, 20);
      d.adv = d.contract * rnd(0.12, 0.25);
      d.cost = d.contract * (1 - d.marginRate);
      d.upfront = 0;
      d.exposure = d.cost * 0.45;
      d.risk = rnd(0.02, 0.07);
    } else if (type === 'concession') {
      d.invest = sc * rnd(60, 270) * sm;
      d.yieldRate = rnd(0.0095, 0.021);
      d.life = ri(48, 140);
      d.upfront = d.invest;
      d.exposure = d.invest;
      d.risk = rnd(0.03, 0.09);
    } else {
      d.invest = sc * rnd(38, 200) * sm;
      d.yieldRate = rnd(0.0062, 0.0128);
      d.growth = rnd(0.0022, 0.0068);
      d.upfront = d.invest;
      d.exposure = d.invest;
      d.risk = rnd(0.005, 0.02);
    }
    return d;
  }

  function refreshMarket() {
    for (let i = S.market.length - 1; i >= 0; i--) {
      S.market[i].ttl--;
      if (S.market[i].ttl <= 0) S.market.splice(i, 1);
    }
    const target = 7 + Math.min(5, S.offices.length - 1) + Math.min(4, S.stage);
    while (S.market.length < target) S.market.push(genDeal());
  }

  /* ---------------- bidding ---------------- */
  function winScore(d, stanceIdx) {
    const st = D.STANCES[stanceIdx];
    let s = 46;
    s += divOf(d.div).lv * 4.2;
    s += rating().win;
    s += S.credit * 0.13;
    s += hasOffice(d.region) ? 10 : 0;
    s -= d.rivals * 4.6;
    s -= d.diff * 12;
    s += st.win;
    // 与信・規模の余裕
    const room = (equity() + borrowLimit());
    const need = d.exposure;
    if (room > 0) s += clamp(6 * (1 - need / room), -14, 6);
    return clamp(s, 4, 93) / 100;
  }

  function bidCheck(d) {
    if (S.slots <= 0) return '今月の商談枠を使い切っている';
    if (S.active.length >= capacity() && (d.type === 'trade' || d.type === 'project'))
      return '人員が足りず、これ以上の案件は回せない（現行 ' + S.active.length + '/' + capacity() + '）';
    if (d.upfront > S.cash) return '手元資金が不足（必要 ' + money(d.upfront) + ' / 現金 ' + money(S.cash) + '）';
    const eq = equity();
    if (eq > 0 && d.exposure > eq * 0.62 + borrowLimit() * 0.4)
      return '単一案件としてリスクが大きすぎる（与信枠超過）';
    if (d.type === 'project' && d.cost / d.months > S.cash * 0.5 + borrowLimit() * 0.2)
      return '毎月の工事原価を賄えない資金繰りだ';
    return null;
  }

  function bid(dealId, stanceIdx) {
    const i = S.market.findIndex(function (x) { return x.id === dealId; });
    if (i < 0) return { ok: false, msg: '案件が見つからない' };
    const d = S.market[i];
    const err = bidCheck(d);
    if (err) return { ok: false, msg: err };

    S.slots--;
    const p = winScore(d, stanceIdx);
    const won = Math.random() < p;
    S.market.splice(i, 1);
    const st = D.STANCES[stanceIdx];

    if (!won) {
      S.stats.lost++;
      divOf(d.div).exp += 0.35;
      log('「' + d.name + '」失注。競合が条件で上回った。', 'down');
      return { ok: true, won: false, prob: p, deal: d };
    }

    S.stats.won++;
    S.credit = clamp(S.credit + 0.55, 0, 100);
    const dd = divOf(d.div);
    dd.exp += d.big ? 2.5 : 1;
    checkLevel(d.div);

    if (d.type === 'trade') {
      S.cash -= d.capital;
      S.active.push({
        id: d.id, type: 'trade', name: d.name, div: d.div, region: d.region, comms: d.comms,
        volume: d.volume, marginRate: d.marginRate * st.mult, capital: d.capital,
        months: d.months, prog: 0, risk: d.risk, big: d.big,
        mkAtBid: mfac(d.comms), fxAtBid: S.fx,
      });
    } else if (d.type === 'project') {
      S.cash += d.adv;
      S.active.push({
        id: d.id, type: 'project', name: d.name, div: d.div, region: d.region, comms: d.comms,
        contract: d.contract * (0.82 + 0.18 * st.mult),
        cost: d.cost, months: d.months, prog: 0, wip: 0, adv: d.adv,
        risk: d.risk, delays: 0, big: d.big,
      });
    } else {
      S.cash -= d.invest;
      S.assets.push({
        id: d.id, type: d.type, name: d.name, div: d.div, region: d.region, comms: d.comms,
        basis: d.invest, value: d.invest, yieldRate: d.yieldRate * (0.85 + 0.15 * st.mult),
        growth: d.growth || 0, life: d.life || 0, age: 0, cum: 0, impaired: 0, big: d.big,
      });
    }
    log('「' + d.name + '」を獲得（' + st.n + '条件）。', 'up');
    return { ok: true, won: true, prob: p, deal: d };
  }

  function checkLevel(divId) {
    const dd = S.div[divId];
    while (dd.lv < 25 && dd.exp >= dd.lv * 3) {
      dd.exp -= dd.lv * 3;
      dd.lv++;
      log(D.DIV_BY_ID[divId].name + ' が Lv.' + dd.lv + ' に成長した。', 'gold');
    }
  }

  /* ---------------- management actions ---------------- */
  function hireBlock() { return [10, 25, 100, 400, 1500, 6000][S.stage]; }
  function hireCost() { return hireBlock() * 0.022; }
  function hire() {
    const c = hireCost();
    if (S.cash < c) return { ok: false, msg: '採用費が足りない' };
    S.cash -= c; capex(c);
    S.staff += hireBlock();
    S.slots = Math.min(slotsMax(), S.slots + (slotsMax() > S.slots ? 1 : 0));
    log(hireBlock() + '名を採用した（採用費 ' + money(c) + '）。', '');
    return { ok: true };
  }

  function upgradeCost(divId) {
    const lv = S.div[divId].lv;
    return scale() * (2.5 + lv * lv * 0.55);
  }
  function upgrade(divId) {
    const c = upgradeCost(divId);
    if (S.div[divId].lv >= 25) return { ok: false, msg: '既に最高水準' };
    if (S.cash < c) return { ok: false, msg: '資金が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c);
    S.div[divId].lv++;
    log(D.DIV_BY_ID[divId].name + ' に ' + money(c) + ' を投資、Lv.' + S.div[divId].lv + ' へ。', 'gold');
    return { ok: true };
  }

  function officeCost() { return scale() * 16 + 5; }
  function openOffice(regId) {
    if (hasOffice(regId)) return { ok: false, msg: '既に拠点がある' };
    const c = officeCost();
    if (S.cash < c) return { ok: false, msg: '資金が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c);
    S.offices.push(regId);
    S.credit = clamp(S.credit + 1.5, 0, 100);
    log(D.REGION_BY_ID[regId].name + 'に拠点を開設した。', 'gold');
    return { ok: true };
  }

  function borrow(amt) {
    amt = Math.max(0, Math.min(amt, borrowLimit()));
    if (amt <= 0) return { ok: false, msg: '借入枠がない' };
    S.cash += amt; S.debt += amt;
    log('銀行団から ' + money(amt) + ' を調達（金利 ' + pct(interestRate()) + '）。', '');
    return { ok: true };
  }
  function repay(amt) {
    amt = Math.max(0, Math.min(amt, Math.min(S.debt, S.cash)));
    if (amt <= 0) return { ok: false, msg: '返済できる資金・債務がない' };
    S.cash -= amt; S.debt -= amt;
    S.credit = clamp(S.credit + amt / Math.max(1, equity()) * 6, 0, 100);
    log(money(amt) + ' を繰上返済した。', '');
    return { ok: true };
  }

  function sellAsset(id) {
    const i = S.assets.findIndex(function (a) { return a.id === id; });
    if (i < 0) return { ok: false, msg: '見つからない' };
    const a = S.assets[i];
    const proceeds = a.value * rnd(0.88, 1.06);
    S.cash += proceeds;
    S.assets.splice(i, 1);
    const g = proceeds - a.value;
    if (!S.pend) S.pend = { capex: 0, gain: 0 };
    S.pend.gain += g;
    log('「' + a.name + '」を ' + money(proceeds) + ' で売却（' + signed(proceeds - a.basis) + ' vs 簿価取得原価）。', g >= 0 ? 'up' : 'down');
    return { ok: true, proceeds: proceeds };
  }

  /* ---------------- monthly step ---------------- */
  function stepMarket() {
    D.COMM_KEYS.forEach(function (k) {
      const c = D.COMMODITIES[k];
      S.mkPrev[k] = S.mk[k];
      const mr = Math.log(100 / S.mk[k]) * 0.035;
      const sh = randn() * c.vol * 0.55 + c.drift;
      S.mk[k] = clamp(S.mk[k] * Math.exp(mr + sh), 32, 340);
    });
    S.fxPrev = S.fx;
    S.fx = clamp(S.fx * Math.exp(Math.log(145 / S.fx) * 0.04 + randn() * 0.018), 90, 260);
    S.rateBase = clamp(S.rateBase + randn() * 0.0012 + (0.022 - S.rateBase) * 0.05, 0.002, 0.075);
  }

  function rollEvent() {
    if (Math.random() > 0.30) return null;
    const e = wpick(D.EVENTS, 'w');
    if (e.shock) for (const k in e.shock) S.mk[k] = clamp(S.mk[k] * (1 + e.shock[k]), 32, 340);
    if (e.fx) S.fx = clamp(S.fx * (1 + e.fx), 90, 260);
    if (e.rate) S.rateBase = clamp(S.rateBase + e.rate, 0.002, 0.09);
    if (e.credit) S.credit = clamp(S.credit + e.credit, 0, 100);
    if (e.impairRisk) S.mod.impair = e.impairRisk;
    if (e.creditRisk) S.mod.creditRisk = e.creditRisk;
    if (e.delayRisk) S.mod.delay = e.delayRisk;
    if (e.wageUp) S.wageRate *= (1 + e.wageUp);
    if (e.bigDeal) { S.market.push(genDeal(true)); }
    log('【' + e.title + '】', 'info');
    return e;
  }

  function newLedger() {
    const g = S.pend ? S.pend.gain : 0;
    if (S.pend) S.pend.gain = 0;
    return { trade: 0, project: 0, dividend: 0, reval: 0, impair: 0, gain: g,
             wage: 0, sga: 0, interest: 0, defaults: 0 };
  }
  function sumLedger(L) { let t = 0; for (const k in L) t += L[k]; return t; }
  function capex(v) { if (!S.pend) S.pend = { capex: 0, gain: 0 }; S.pend.capex += v; }

  function processActive(L) {
    for (let i = S.active.length - 1; i >= 0; i--) {
      const a = S.active[i];
      if (a.type === 'trade') {
        a.prog++;
        if (a.prog >= a.months) {
          // 与信リスク
          if (Math.random() < a.risk * S.mod.creditRisk) {
            const loss = a.capital * rnd(0.35, 0.85);
            S.cash += a.capital - loss;
            L.defaults -= loss;
            S.stats.defaults++;
            S.credit = clamp(S.credit - 4, 0, 100);
            log('「' + a.name + '」で相手方がデフォルト。' + money(loss) + ' の貸倒損失。', 'down');
          } else {
            const mkNow = mfac(a.comms);
            const swing = mkNow / a.mkAtBid;
            const fxs = 1 + (S.fx / a.fxAtBid - 1) * (a.region === 'jp' ? 0.2 : 0.7);
            let profit = a.volume * a.marginRate * (0.35 + 0.65 * swing) * fxs;
            profit *= rnd(0.85, 1.15);
            S.cash += a.capital + profit;
            L.trade += profit;
            S.fy.deals++;
            S.stats.done++;
            divOf(a.div).exp += 0.6; checkLevel(a.div);
            log('「' + a.name + '」決済完了。取扱高 ' + money(a.volume) + '、利益 ' + signed(profit) + '。',
              profit >= 0 ? 'up' : 'down');
          }
          S.active.splice(i, 1);
        }
      } else if (a.type === 'project') {
        // 遅延判定
        if (Math.random() < a.risk * S.mod.delay * 0.5) {
          a.months++; a.delays++;
          a.cost *= 1.03;
          log('「' + a.name + '」で工程遅延。原価が膨らんだ。', 'down');
        }
        const c = a.cost / a.months;
        S.cash -= c; a.wip += c;
        a.prog++;
        if (a.prog >= a.months) {
          const remain = a.contract - a.adv;
          S.cash += remain;
          const profit = a.contract - a.wip;
          L.project += profit;
          S.active.splice(i, 1);
          S.fy.deals++; S.stats.done++;
          divOf(a.div).exp += 1.5; checkLevel(a.div);
          S.credit = clamp(S.credit + 1.5, 0, 100);
          log('「' + a.name + '」竣工・引渡し。請負 ' + money(a.contract) + '、利益 ' + signed(profit) + '。',
            profit >= 0 ? 'up' : 'down');
        }
      }
    }
  }

  function processAssets(L) {
    for (let i = S.assets.length - 1; i >= 0; i--) {
      const a = S.assets[i];
      a.age++;
      const mf = mfac(a.comms);
      const sens = a.type === 'concession' ? 1.0 : 0.35;
      const mAdj = 1 + (mf - 1) * sens;

      // 配当・持分利益
      const div = a.value * a.yieldRate * clamp(mAdj, 0.15, 2.2) * fxFac() * (a.region === 'jp' ? 1 : 1.05);
      S.cash += div; L.dividend += div; a.cum += div;

      // 評価
      let target;
      if (a.type === 'concession') {
        const dep = a.life ? Math.max(0, 1 - a.age / a.life) : 1;
        target = a.basis * dep * clamp(mAdj, 0.2, 2.4) * (1 - a.impaired);
      } else {
        target = a.basis * Math.pow(1 + a.growth, a.age) * clamp(mAdj, 0.4, 2.0) * (1 - a.impaired);
      }
      const nv = a.value + (target - a.value) * 0.22;
      L.reval += nv - a.value;
      a.value = Math.max(0, nv);

      // 減損
      if (a.value < a.basis * 0.68 && Math.random() < 0.09 * S.mod.impair) {
        const w = a.value * rnd(0.18, 0.42);
        a.value -= w; a.impaired = clamp(a.impaired + 0.12, 0, 0.8);
        L.impair -= w;
        S.stats.impair++;
        S.credit = clamp(S.credit - 3, 0, 100);
        log('「' + a.name + '」で減損損失 ' + money(w) + ' を計上。', 'down');
      }

      if (a.type === 'concession' && a.life && a.age >= a.life) {
        S.cash += a.value; L.gain += 0; // 残存簿価を回収（売却相当、損益ゼロ）
        log('「' + a.name + '」が可採期間を終了。累計配当 ' + money(a.cum) + '。', 'info');
        S.assets.splice(i, 1);
      }
    }
  }

  function financeCosts(L) {
    const wage = S.staff * S.wageRate;
    const sga = S.offices.length * 0.5 * Math.sqrt(scale()) + Math.max(0, equity()) * 0.0006 + 0.25;
    const int = S.debt * interestRate() / 12;
    S.cash -= (wage + sga + int);
    L.wage -= wage; L.sga -= sga; L.interest -= int;
  }

  function rescue(L) {
    // 現金不足 → 借入 → 資産売却 → 危機
    if (S.cash >= 0) return;
    const need = -S.cash + 5;
    const b = Math.min(need, borrowLimit());
    if (b > 0) { S.cash += b; S.debt += b; log('資金繰り悪化により ' + money(b) + ' を緊急借入。', 'down'); }
    while (S.cash < 0 && S.assets.length) {
      S.assets.sort(function (x, y) { return x.value - y.value; });
      const a = S.assets[0];
      const proceeds = a.value * rnd(0.62, 0.82);
      S.cash += proceeds; L.gain += proceeds - a.value;
      S.assets.shift();
      S.credit = clamp(S.credit - 2, 0, 100);
      log('資金確保のため「' + a.name + '」を投売り（' + money(proceeds) + '）。', 'down');
    }
    if (S.cash < 0) {
      S.credit = clamp(S.credit - 4, 0, 100);
      log('債務不履行の瀬戸際。取引銀行が態度を硬化させている。', 'down');
    }
  }

  function stepRivals() {
    const boom = (S.mk.crude + S.mk.iron + S.mk.copper) / 300;
    S.rivals.forEach(function (r) {
      r.eq *= (1 + r.g * (0.6 + 0.8 * boom) + randn() * 0.016);
      r.eq = Math.max(500, r.eq);
    });
  }

  function ranking() {
    const list = S.rivals.map(function (r) { return { name: r.name, eq: r.eq, me: false }; });
    list.push({ name: S.company, eq: equity(), me: true });
    list.sort(function (a, b) { return b.eq - a.eq; });
    return list;
  }
  function myRank() {
    const l = ranking();
    return l.findIndex(function (x) { return x.me; }) + 1;
  }

  /* ---------------- advance one month ---------------- */
  function advance() {
    if (S.over || S.cleared) return { over: true };
    const eqBefore = equity();
    const out = { event: null, fy: null, promote: null, over: false, cleared: false };

    S.m++; if (S.m > 12) { S.m = 1; S.y++; }
    S.turn++;

    // modifier decay
    S.mod.impair += (1 - S.mod.impair) * 0.5;
    S.mod.creditRisk += (1 - S.mod.creditRisk) * 0.5;
    S.mod.delay += (1 - S.mod.delay) * 0.5;

    stepMarket();
    out.event = rollEvent();

    const L = newLedger();
    S.lastLedger = L;
    processActive(L);
    processAssets(L);
    financeCosts(L);
    rescue(L);

    // 信用の自然回復・減衰と財務規律（D/Eレバレッジは格付を蝕む）
    S.credit += (46 - S.credit) * 0.012;
    const de = S.debt / Math.max(1, eqAfterRaw());
    if (de > 1.0) S.credit -= Math.min(12, (de - 1.0) * 4.0);
    else S.credit += 0.35 * (1 - de);
    S.credit = clamp(S.credit, 0, 100);

    stepRivals();
    refreshMarket();
    S.slots = slotsMax();

    const eqAfter = equity();
    const profit = sumLedger(L);
    S.lastProfit = profit;
    S.lastCapex = S.pend.capex;
    S.pend.capex = 0;
    S.stats.cumProfit += profit;
    S.fy.profit += profit;
    S.monthly.push({ t: S.y + '/' + S.m, p: profit, e: eqAfter });
    if (S.monthly.length > 240) S.monthly.shift();

    // 債務超過チェック
    if (eqAfter < 0) {
      S.insolvent++;
      log('債務超過（' + S.insolvent + 'ヶ月連続）。抜本的な立て直しが必要だ。', 'down');
      if (S.insolvent >= 4) { S.over = true; out.over = true; }
    } else S.insolvent = 0;

    // 決算（3月）
    if (S.m === 3) {
      const rec = {
        fy: S.y, profit: S.fy.profit, deals: S.fy.deals,
        eqStart: S.fy.startEquity, eqEnd: eqAfter, rank: myRank(), rating: rating().label,
      };
      S.fyHistory.push(rec);
      out.fy = rec;
    }

    // 昇格
    if (!S.over && eqAfter >= stage().goal) {
      if (S.stage >= D.STAGES.length - 1) {
        S.cleared = true; out.cleared = true;
      } else {
        S.stage++;
        S.credit = clamp(S.credit + 5, 0, 100);
        out.promote = D.STAGES[S.stage];
        log('【昇格】' + D.STAGES[S.stage].name + ' へ。', 'gold');
        for (let i = 0; i < 2; i++) S.market.push(genDeal());
      }
    }
    if (S.stage === D.STAGES.length - 1 && myRank() === 1) {
      S.cleared = true; out.cleared = true;
    }
    save();
    return out;
  }

  /* 決算時の株主還元 */
  function payout(kind) {
    const eq = equity();
    let amt = 0, cr = 0;
    if (kind === 'none') { cr = -3; }
    else if (kind === 'normal') { amt = Math.max(0, eq * 0.015); cr = 5; }
    else { amt = Math.max(0, eq * 0.035); cr = 9; }
    amt = Math.min(amt, Math.max(0, S.cash * 0.7));
    S.cash -= amt; capex(amt);
    S.credit = clamp(S.credit + cr, 0, 100);
    if (amt > 0) log('株主還元として ' + money(amt) + ' を配当。信用が向上した。', 'gold');
    else log('無配を決定。株主の目は厳しい。', 'down');
    S.fy = { profit: 0, startEquity: equity(), deals: 0 };
    save();
    return amt;
  }

  /* ---------------- save / load ---------------- */
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* noop */ }
  }
  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      S = JSON.parse(raw);
      if (!S || !S.div) return null;
      return S;
    } catch (e) { return null; }
  }
  function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* noop */ } }

  /* ---------------- public ---------------- */
  return {
    get S() { return S; },
    newGame: newGame, advance: advance, bid: bid, bidCheck: bidCheck, winScore: winScore,
    hire: hire, hireBlock: hireBlock, hireCost: hireCost,
    upgrade: upgrade, upgradeCost: upgradeCost,
    openOffice: openOffice, officeCost: officeCost,
    borrow: borrow, repay: repay, borrowLimit: borrowLimit, interestRate: interestRate,
    sellAsset: sellAsset, payout: payout,
    equity: equity, bookAssets: bookAssets, rating: rating, stage: stage, scale: scale,
    capacity: capacity, slotsMax: slotsMax, mfac: mfac, hasOffice: hasOffice,
    ranking: ranking, myRank: myRank, now: now,
    save: save, load: load, hasSave: hasSave, wipe: wipe,
    money: money, signed: signed, pct: pct, clamp: clamp,
  };
})();

</script>
<script>
/* =========================================================
 *  SOGO SHOSHA - view layer
 * ======================================================= */
window.UI = (function () {
  const D = window.GAME;
  const E = window.ENGINE;
  const money = E.money, signed = E.signed, pct = E.pct;

  const $ = function (s, r) { return (r || document).querySelector(s); };
  const esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  };
  let tab = 'dash';

  /* ---------------- HUD ---------------- */
  function renderHud() {
    const S = E.S, eq = E.equity(), st = E.stage();
    $('#hud-company').textContent = S.company;
    $('#hud-stage').textContent = st.name;
    $('#hud-date').textContent = E.now();
    $('#hud-cash').textContent = money(S.cash);
    $('#hud-cash').className = S.cash < 0 ? 'down' : '';
    $('#hud-equity').textContent = money(eq);
    $('#hud-equity').className = eq < 0 ? 'down' : '';
    const p = S.lastProfit;
    $('#hud-profit').textContent = S.turn ? signed(p) : '—';
    $('#hud-profit').className = S.turn ? (p >= 0 ? 'up' : 'down') : '';
    $('#hud-rating').textContent = E.rating().label;

    const goal = st.goal;
    const prev = S.stage ? D.STAGES[S.stage - 1].goal : 0;
    const r = goal === Infinity ? 1 : E.clamp((eq - prev) / (goal - prev), 0, 1);
    $('#hud-bar-fill').style.width = (r * 100).toFixed(1) + '%';
    $('#hud-bar-label').textContent = goal === Infinity
      ? '世界一の座を狙う' : '次の昇格まで  ' + money(Math.max(0, goal - eq));

    // slots
    const dots = [];
    for (let i = 0; i < E.slotsMax(); i++) dots.push('<i class="' + (i < S.slots ? 'on' : '') + '"></i>');
    $('#slot-dots').innerHTML = dots.join('');
    $('#slot-label').textContent = '商談枠 ' + S.slots + '/' + E.slotsMax();
    $('#btn-next').className = 'btn-next' + (S.cash < 0 ? ' warn' : '');

    const badge = S.market.length;
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === tab);
      const old = b.querySelector('.badge'); if (old) old.remove();
      if (b.dataset.tab === 'market' && badge && S.slots > 0) {
        const s = document.createElement('span'); s.className = 'badge'; s.textContent = badge;
        b.appendChild(s);
      }
    });
  }

  /* ---------------- shared bits ---------------- */
  function arrow(cur, prev) {
    const d = (cur - prev) / prev;
    const c = d >= 0.0005 ? 'up' : d <= -0.0005 ? 'down' : 'muted';
    const s = d >= 0.0005 ? '▲' : d <= -0.0005 ? '▼' : '−';
    return '<em class="' + c + '">' + s + Math.abs(d * 100).toFixed(1) + '%</em>';
  }

  function marketCard() {
    const S = E.S;
    let h = '<div class="card"><div class="sect">商品市況（指数 100 = 平年）</div><div class="mkt">';
    D.COMM_KEYS.forEach(function (k) {
      const v = S.mk[k], p = S.mkPrev[k];
      h += '<div class="m"><div class="n">' + D.COMMODITIES[k].name + '</div>' +
        '<div class="p"><b>' + v.toFixed(1) + '</b>' + arrow(v, p) + '</div></div>';
    });
    h += '</div><div class="kv" style="margin-top:10px">' +
      '<span class="k">USD/JPY</span><span class="v">' + S.fx.toFixed(1) + ' ' + arrow(S.fx, S.fxPrev) + '</span>' +
      '<span class="k">政策金利ベース</span><span class="v">' + pct(S.rateBase, 2) + '</span>' +
      '<span class="k">当社調達金利</span><span class="v">' + pct(E.interestRate(), 2) + '</span>' +
      '</div></div>';
    return h;
  }

  function ledgerCard() {
    const S = E.S, L = S.lastLedger;
    if (!L) return '';
    const rows = [
      ['トレード損益', L.trade], ['プロジェクト損益', L.project],
      ['持分法配当・収益', L.dividend], ['保有資産評価損益', L.reval],

  function dealSummary(d) {
    if (d.type === 'trade')
      return '取扱高 ' + money(d.volume) + ' ／ 口銭 ' + pct(d.marginRate) + ' ／ ' + d.months + 'ヶ月';
    if (d.type === 'project')
      return '請負 ' + money(d.contract) + ' ／ 粗利率 ' + pct(d.marginRate) + ' ／ ' + d.months + 'ヶ月';
    if (d.type === 'concession')
      return '投資 ' + money(d.invest) + ' ／ 月利回り ' + pct(d.yieldRate, 2) + ' ／ ' + d.life + 'ヶ月';
    return '投資 ' + money(d.invest) + ' ／ 月利回り ' + pct(d.yieldRate, 2) + ' ／ 成長 ' + pct(d.growth, 2) + '/月';
  }

        const swing = E.mfac(a.comms) / a.mkAtBid;

        '<div class="tiny muted" style="margin-top:6px">' + dv.icon + ' ' + dv.short + ' ／ ' + detail + '</div>' +
        '<div class="bar"><i style="width:' + (r * 100).toFixed(0) + '%"></i></div>' +
        '<div class="deal-f"><span class="muted">' + a.prog + ' / ' + a.months + 'ヶ月</span><span class="small">' + fore + '</span></div>' +

      h += '<div class="rank' + (r.me ? ' me' : '') + '"><div class="no">' + (i + 1) + '</div>' +
        '<div class="nm">' + esc(r.name) + (r.me ? ' <span class="pill">自社</span>' : '') + '</div>' +
        '<div class="vl">' + money(r.eq) + '</div></div>';
    });
    h += '</div>';

  /* ---------------- render ---------------- */
  function render() {
    const map = { dash: viewDash, market: viewMarket, active: viewActive, assets: viewAssets, admin: viewAdmin, rank: viewRank };
    $('#view').innerHTML = (map[tab] || viewDash)();
    renderHud();
  }
  function setTab(t) { tab = t; $('#view').scrollTop = 0; render(); }

  /* ---------------- modal ---------------- */
  let onClose = null;
  function modal(html, keep) {
    $('#modal-box').innerHTML = html;
    $('#modal-root').hidden = false;
    if (!keep) onClose = null;
  }
  function closeModal() {
    $('#modal-root').hidden = true;
    $('#modal-box').innerHTML = '';
    const f = onClose; onClose = null;
    if (f) f();
  }

  function alertBox(title, body, kind) {
    modal('<h2 class="' + (kind || '') + '">' + title + '</h2><p>' + body + '</p>' +
      '<div class="mbtns"><button class="pri" data-close>了解</button></div>');
  }

  /* --- 商談モーダル --- */
  let curDeal = null, curStance = 2;
  function openDeal(id) {
    const d = E.S.market.find(function (x) { return x.id === id; });
    if (!d) return;
    curDeal = d; curStance = 2;
    drawDeal();
  }
  function drawDeal() {
    const d = curDeal, dv = D.DIV_BY_ID[d.div], rg = D.REGION_BY_ID[d.region];
    const err = E.bidCheck(d);
    const p = E.winScore(d, curStance);
    const st = D.STANCES[curStance];

    let terms = '';
    if (d.type === 'trade') {
      const mAdj = 1; // 入札時点基準
      const est = d.volume * d.marginRate * st.mult;
      terms = '<div class="kv">' +
        '<span class="k">取扱高</span><span class="v">' + money(d.volume) + '</span>' +
        '<span class="k">拠出する運転資金</span><span class="v down">-' + money(d.capital) + '</span>' +
        '<span class="k">口銭（提示条件後）</span><span class="v">' + pct(d.marginRate * st.mult) + '</span>' +
        '<span class="k">想定利益</span><span class="v up">' + signed(est) + '</span>' +
        '<span class="k">決済まで</span><span class="v">' + d.months + 'ヶ月</span>' +
        '<span class="k">与信リスク</span><span class="v ' + (d.risk > .025 ? 'down' : '') + '">' + pct(d.risk) + '</span>' +
        '</div>';
    } else if (d.type === 'project') {
      const c = d.contract * (0.82 + 0.18 * st.mult);
      terms = '<div class="kv">' +
        '<span class="k">請負金額（条件反映）</span><span class="v">' + money(c) + '</span>' +
        '<span class="k">前受金（即時入金）</span><span class="v up">+' + money(d.adv) + '</span>' +
        '<span class="k">総工事原価</span><span class="v down">-' + money(d.cost) + '</span>' +
        '<span class="k">完成時利益（想定）</span><span class="v up">' + signed(c - d.cost) + '</span>' +
        '<span class="k">工期</span><span class="v">' + d.months + 'ヶ月</span>' +
        '<span class="k">遅延リスク</span><span class="v">' + pct(d.risk) + '</span>' +
        '</div>';
    } else {
      const y = d.yieldRate * (0.85 + 0.15 * st.mult);
      terms = '<div class="kv">' +
        '<span class="k">投資額</span><span class="v down">-' + money(d.invest) + '</span>' +
        '<span class="k">月次配当利回り</span><span class="v up">' + pct(y, 2) + '（年 ' + pct(y * 12, 1) + '）</span>' +
        '<span class="k">初月の配当（目安）</span><span class="v up">' + money(d.invest * y) + '</span>' +
        (d.type === 'concession'
          ? '<span class="k">可採期間</span><span class="v">' + d.life + 'ヶ月</span>' +
            '<span class="k">市況感応度</span><span class="v warn">高（減損リスク有）</span>'
          : '<span class="k">投資先の成長</span><span class="v up">+' + pct(d.growth, 2) + '/月</span>' +
            '<span class="k">市況感応度</span><span class="v">低</span>') +
        '</div>';
    }

    let aggr = '<div class="aggr">';
    D.STANCES.forEach(function (s, i) {
      aggr += '<button data-stance="' + i + '" class="' + (i === curStance ? 'on' : '') + '"><b>' + s.n + '</b>×' + s.mult.toFixed(2) + '</button>';
    });
    aggr += '</div><p class="tiny" style="margin-bottom:12px">' + st.desc + '</p>';

    const col = p > 0.55 ? 'var(--up)' : p > 0.3 ? 'var(--warn)' : 'var(--down)';

    modal(
      '<h2>' + (d.big ? '💎 ' : '') + esc(d.name) + '</h2>' +
      '<p class="tiny" style="margin-bottom:12px">' +
        '<span class="pill t-' + d.type + '">' + D.TYPE_LABEL[d.type] + '</span> ' +
        '<span class="pill">' + dv.icon + ' ' + dv.name + '</span> ' +
        '<span class="pill">' + rg.flag + ' ' + rg.name + '</span> ' +
        '<span class="pill">競合 ' + d.rivals + '社</span></p>' +
      '<p class="tiny">' + D.TYPE_DESC[d.type] + '</p>' +
      '<h3>提示条件</h3>' + aggr +
      '<h3>落札確度</h3>' +
      '<div class="gauge"><i style="width:' + (p * 100).toFixed(0) + '%;background:' + col + '"></i></div>' +
      '<div class="row small"><span class="muted">' + dv.short + ' Lv.' + E.S.div[d.div].lv +
        ' ／ 格付 ' + E.rating().label + (E.hasOffice(d.region) ? ' ／ 現地拠点あり' : '') + '</span>' +
        '<b style="color:' + col + '">' + Math.round(p * 100) + '%</b></div>' +
      '<h3>条件</h3>' + terms +
      (err ? '<p class="down small" style="margin-top:12px">⚠ ' + err + '</p>' : '') +
      '<div class="mbtns"><button data-close>見送る</button>' +
      '<button class="pri" data-bid="' + d.id + '"' + (err ? ' disabled' : '') + '>この条件で応札</button></div>'
    );
  }

  function bidResult(res) {
    if (!res.ok) { alertBox('応札できない', res.msg, 'down'); return; }
    const d = res.deal;
    if (res.won) {
      alertBox('落札', '「' + esc(d.name) + '」の獲得に成功した。<br>落札確度 ' + Math.round(res.prob * 100) + '% を引き当てた。' +
        (d.type === 'trade' ? '<br>運転資金 ' + money(d.capital) + ' を拠出した。' :
         d.type === 'project' ? '<br>前受金 ' + money(d.adv) + ' が入金された。' :
         '<br>' + money(d.invest) + ' を投じ、ポートフォリオに加わった。'), 'up');
    } else {
      alertBox('失注', '「' + esc(d.name) + '」は競合に取られた。<br>落札確度は ' + Math.round(res.prob * 100) + '% だった。<br>' +
        '本部のレベルと信用力を高めれば、次は取れる。', 'down');
    }
    render();
  }

  /* --- 金額入力モーダル --- */
  function amountModal(title, desc, max, cb) {
    if (max <= 0) { alertBox(title, '実行できる金額がない。', 'down'); return; }
    let v = Math.round(max * 0.5 * 10) / 10;
    function draw() {
      modal('<h2>' + title + '</h2><p>' + desc + '</p>' +
        '<div class="row"><span class="muted small">金額</span><b class="num gold" style="font-size:22px">' + money(v) + '</b></div>' +
        '<input class="range" type="range" min="0" max="1000" value="' + Math.round(v / max * 1000) + '" id="rng">' +
        '<div class="row tiny muted"><span>0</span><span>上限 ' + money(max) + '</span></div>' +
        '<div class="mbtns"><button data-close>やめる</button><button class="pri" id="ok">実行</button></div>', true);
      $('#rng').addEventListener('input', function (e) {
        v = max * (e.target.value / 1000);
        $('.modal .num').textContent = money(v);
      });
      $('#ok').addEventListener('click', function () { closeModal(); cb(v); render(); });
    }
    draw();
  }

  /* --- イベント / 決算 / 昇格 --- */
  function eventModal(e, after) {
    onClose = after;
    modal('<div class="evt-ic">' + e.ic + '</div><h2 style="text-align:center">' + e.title + '</h2>' +
      '<p style="margin-top:10px">' + e.text + '</p>' +
      '<div class="mbtns"><button class="pri" data-close>受け止める</button></div>', true);
  }

  function fyModal(f, after) {
    const S = E.S;
    const grow = f.eqStart > 0 ? (f.eqEnd / f.eqStart - 1) : 0;
    onClose = null;
    modal('<h2>' + f.fy + '年3月期 決算</h2>' +
      '<p class="tiny">通期の成績が確定した。株主還元の方針を決めよ。</p>' +
      '<div class="fy-grid">' +
      '<div class="b"><label>通期純利益</label><b class="' + (f.profit >= 0 ? 'up' : 'down') + '">' + signed(f.profit) + '</b></div>' +
      '<div class="b"><label>純資産</label><b class="gold">' + money(f.eqEnd) + '</b></div>' +
      '<div class="b"><label>純資産成長率</label><b class="' + (grow >= 0 ? 'up' : 'down') + '">' + pct(grow) + '</b></div>' +
      '<div class="b"><label>格付 / 世界順位</label><b>' + f.rating + ' ／ ' + f.rank + '位</b></div>' +
      '<div class="b"><label>完了案件</label><b>' + f.deals + '件</b></div>' +
      '<div class="b"><label>社員数</label><b>' + S.staff.toLocaleString('ja-JP') + '</b></div>' +
      '</div>' +
      '<h3>株主還元</h3>' +
      '<div class="mbtns" style="flex-direction:column;gap:8px">' +
      '<button data-payout="high">増配（純資産の3.5%を配当・信用+9）</button>' +
      '<button class="pri" data-payout="normal">標準配当（1.5%・信用+5）</button>' +
      '<button data-payout="none">無配（内部留保優先・信用-3）</button>' +
      '</div>', true);
  }

  function promoteModal(st, after) {
    onClose = after;
    modal('<div class="evt-ic">🎖️</div>' +
      '<h2 style="text-align:center" class="gold">' + st.name + ' へ昇格</h2>' +
      '<p style="text-align:center;margin-top:10px">' + st.title + '<br><br>' +
      '取り扱える案件の規模が跳ね上がった。<br>より大きな資金と、より大きなリスクの世界へ。</p>' +
      '<div class="mbtns"><button class="pri" data-close>次の段階へ</button></div>', true);
  }

  function endModal(win) {
    const S = E.S;
    onClose = null;
    modal('<div class="evt-ic">' + (win ? '👑' : '💀') + '</div>' +
      '<h2 style="text-align:center">' + (win ? '世界最大の総合商社' : '経営破綻') + '</h2>' +
      '<p style="text-align:center;margin-top:8px">' +
      (win ? esc(S.company) + ' は世界の頂点に立った。<br>ラーメンから航空機まで、地球上のあらゆる商いが<br>この会社を通っている。'
           : esc(S.company) + ' は債務超過に陥り、<br>再建を断念した。') + '</p>' +
      '<div class="fy-grid">' +
      '<div class="b"><label>最終純資産</label><b class="gold">' + money(E.equity()) + '</b></div>' +
      '<div class="b"><label>経過</label><b>' + Math.floor(S.turn / 12) + '年' + (S.turn % 12) + 'ヶ月</b></div>' +
      '<div class="b"><label>累計純利益</label><b>' + signed(S.stats.cumProfit) + '</b></div>' +
      '<div class="b"><label>世界順位</label><b>' + E.myRank() + '位</b></div>' +
      '</div>' +
      '<div class="mbtns"><button class="pri" data-act="reset">新たな会社を興す</button></div>', true);
  }

  return {
    render: render, setTab: setTab, get tab() { return tab; },
    modal: modal, closeModal: closeModal, alertBox: alertBox,
    openDeal: openDeal, drawDeal: drawDeal, bidResult: bidResult,
    amountModal: amountModal, eventModal: eventModal, fyModal: fyModal,
    promoteModal: promoteModal, endModal: endModal,
    setStance: function (i) { curStance = i; drawDeal(); },
    esc: esc,
  };
})();

</script>
<script>
/* =========================================================
 *  SOGO SHOSHA - bootstrap & input wiring
 * ======================================================= */
(function () {
  const D = window.GAME, E = window.ENGINE, U = window.UI;
  const $ = function (s) { return document.querySelector(s); };

  /* ---- モーダルを順番に流す ---- */
  function runQueue(items) {
    let i = 0;
    (function next() {
      if (i >= items.length) { U.render(); return; }
      const f = items[i++];
      f(next);
    })();
  }

  function startTurn() {
    const S = E.S;
    if (S.over || S.cleared) { U.endModal(S.cleared); return; }
    const out = E.advance();
    const q = [];
    if (out.event) q.push(function (n) { U.eventModal(out.event, n); });
    if (out.fy) q.push(function (n) { fyPending = n; U.fyModal(out.fy); });
    if (out.promote) q.push(function (n) { U.promoteModal(out.promote, n); });
    if (out.over) q.push(function () { U.endModal(false); });
    if (out.cleared) q.push(function () { U.endModal(true); });
    U.render();
    runQueue(q);
  }
  let fyPending = null;

  /* ---- 起動 ---- */
  function boot(state) {
    $('#title').classList.add('hide');
    $('#app').hidden = false;
    U.setTab('dash');
  }

  function newGame() {
    const name = ($('#input-company').value || '').trim() || '蒼龍商事';
    E.newGame(name);
    E.save();
    boot();
    U.alertBox('創業',
      'ようこそ、' + U.esc(E.S.company) + ' へ。<br><br>' +
      '① <b>商談</b>タブで案件に応札し、<br>② <b>翌月へ</b>で月を進めて損益を確定、<br>' +
      '③ 稼いだ資金を<b>本社</b>で本部・人員・拠点へ再投資する。<br><br>' +
      'トレードの利益を<b>権益・事業投資</b>に変え、<br>市況に左右されないストック収益を積み上げるのが<br>総合商社の勝ち筋だ。', 'gold');
  }

  /* ---- イベント委譲 ---- */
  document.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-close],[data-bid],[data-stance],[data-deal],[data-sell],[data-up],[data-office],[data-act],[data-payout],#tabs button,#btn-next,#btn-start,#btn-continue');
    if (!t) return;

    /* --- タイトル --- */
    if (t.id === 'btn-start') { newGame(); return; }
    if (t.id === 'btn-continue') {
      if (E.load()) { boot(); U.render(); }
      else U.alertBox('データなし', 'セーブデータが見つからなかった。', 'down');
      return;
    }

    /* --- モーダル --- */
    if (t.hasAttribute('data-close')) { U.closeModal(); U.render(); return; }
    if (t.hasAttribute('data-stance')) { U.setStance(+t.dataset.stance); return; }
    if (t.hasAttribute('data-bid')) {
      const res = E.bid(t.dataset.bid, currentStance());
      E.save();
      U.bidResult(res);
      return;
    }
    if (t.hasAttribute('data-payout')) {
      E.payout(t.dataset.payout);
      U.closeModal();
      const n = fyPending; fyPending = null;
      U.render();
      if (n) n();
      return;
    }

    /* --- タブ --- */
    if (t.closest('#tabs')) { U.setTab(t.dataset.tab); return; }
    if (t.id === 'btn-next') { startTurn(); return; }

    /* --- 一覧操作 --- */
    if (t.hasAttribute('data-deal')) { U.openDeal(t.dataset.deal); return; }
    if (t.hasAttribute('data-sell')) {
      const a = E.S.assets.find(function (x) { return x.id === t.dataset.sell; });
      if (!a) return;
      U.modal('<h2>資産の売却</h2><p>「' + U.esc(a.name) + '」を売却する。<br>' +
        '簿価 ' + E.money(a.value) + ' 前後で現金化できるが、将来の配当収入を失う。</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-act="sell-ok" data-id="' + a.id + '">売却する</button></div>');
      return;
    }
    if (t.hasAttribute('data-up')) {
      const r = E.upgrade(t.dataset.up);
      if (!r.ok) U.alertBox('投資できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }
    if (t.hasAttribute('data-office')) {
      const r = E.openOffice(t.dataset.office);
      if (!r.ok) U.alertBox('開設できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }

    /* --- 本社アクション --- */
    const act = t.dataset.act;
    if (act === 'sell-ok') { E.sellAsset(t.dataset.id); E.save(); U.closeModal(); U.render(); return; }
    if (act === 'hire') {
      const r = E.hire();
      if (!r.ok) U.alertBox('採用できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }
    if (act === 'borrow') {
      U.amountModal('銀行借入', '格付 ' + E.rating().label + ' に基づく借入枠は ' + E.money(E.borrowLimit()) +
        '。年利 ' + E.pct(E.interestRate(), 2) + ' の利息が毎月発生する。',
        E.borrowLimit(), function (v) { E.borrow(v); E.save(); });
      return;
    }
    if (act === 'repay') {
      U.amountModal('繰上返済', '有利子負債 ' + E.money(E.S.debt) + ' を返済し、財務体質と信用力を改善する。',
        Math.min(E.S.debt, E.S.cash), function (v) { E.repay(v); E.save(); });
      return;
    }
    if (act === 'reset') {
      U.modal('<h2>やり直す</h2><p>現在の会社を清算し、最初から始める。<br>この操作は取り消せない。</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-act="reset-ok">清算する</button></div>');
      return;
    }
    if (act === 'reset-ok') {
      E.wipe();
      U.closeModal();
      $('#app').hidden = true;
      $('#title').classList.remove('hide');
      $('#btn-continue').hidden = true;
      return;
    }
  });

  function currentStance() {
    const on = document.querySelector('.aggr button.on');
    return on ? +on.dataset.stance : 2;
  }

  /* 背景タップで閉じる（決算・終局は除く） */
  document.addEventListener('click', function (ev) {
    if (ev.target.classList.contains('backdrop')) {
      const box = $('#modal-box');
      if (box.querySelector('[data-payout]') || box.querySelector('[data-act="reset"]')) return;
      U.closeModal(); U.render();
    }
  });

  /* ---- 初期表示 ---- */
  if (E.hasSave()) $('#btn-continue').hidden = false;
})();

</script>
</body>
</html>
