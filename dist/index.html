  function fyAlloc(id, d) {
    const w = fyW, u = w.unit;
    const cur = allocGet(id);
    if (d > 0) {
      if (w.pool - allocSum() < u) return;
      w.alloc[id] = cur + u;
    } else {
      w.alloc[id] = Math.max(0, cur - u);
      if (w.alloc[id] <= 0) delete w.alloc[id];
    }
    fyDraw();
  }

  function fyGrad(i) { if (!fyW.gradDone) { fyW.gradIdx = i; fyDraw(); } }
  function fyGradPol(i) { if (!fyW.gradDone) { E.setGradPolicy(i); fyDraw(); } }
  function setBand(i) { E.setPayBand(i); if (fyW) fyDraw(); render(); }
  function fyPromo(id) {
    if (fyW.promos.length >= E.promoteSlots()) return;
    if (fyW.promos.indexOf(id) >= 0) return;
    if (E.promotePerson(id).ok) { fyW.promos.push(id); fyDraw(); }
  }
  function fyTier(item, i) { fyW.tiers[item] = i; fyDraw(); }
  function fyCard(id) {
    const c = fyW.cards, i = c.indexOf(id);
    if (i >= 0) c.splice(i, 1);
    else if (c.length < 2) c.push(id);
    fyDraw();
  }

  function fyCommitStep() {
    const w = fyW, id = w.steps[w.step];
    if (id === 'hr' && !w.gradDone) {
      E.hireGrads(E.gradPlan(w.gradIdx));
      w.gradDone = true;
    }
    if (id === 'budget' && !w.allocated) { E.allocateBudget(w.alloc); w.allocated = true; }
    if (id === 'payout' && !w.paid) { E.payout({ ratio: w.ratio, buyback: w.buyback }); w.paid = true; }
    if (id === 'planNew' && !w.planned) { E.formulatePlan(w.tiers, w.cards); w.planned = true; }
  }

  function fyNav(dir) {
    const w = fyW;
    if (!w) return;
    if (dir === 'back') { w.step = Math.max(0, w.step - 1); fyDraw(); return; }
    fyCommitStep();
    if (dir === 'next' && w.step < w.steps.length - 1) { w.step++; fyDraw(); return; }
    const done = w.done; fyW = null;
    closeModal(); render();
    if (done) done();
  }

  function promoteModal(st, after, raise) {
    onClose = after;
    modal('<div class="evt-ic">🎖️</div>' +
      '<h2 style="text-align:center" class="gold">' + st.name + ' へ昇格</h2>' +
      '<p style="text-align:center;margin-top:10px">' + st.title + '<br><br>' +
      '取り扱える案件の規模が跳ね上がった。<br>より大きな資金と、より大きなリスクの世界へ。</p>' +
      (raise ? '<div class="card" style="margin:14px 0 0"><div class="row"><span class="small muted">公募増資による調達</span>' +
        '<b class="gold num">' + money(raise) + '</b></div>' +
        '<p class="tiny muted" style="margin:7px 0 0">PBRが1倍を超えていたため、市場から資金を調達できた。1株当たり純資産は薄まるが、成長の原資になる。</p></div>' : '') +
      '<div class="mbtns"><button class="pri" data-close>次の段階へ</button></div>', true);
  }

  function tobModal(t, after) {
    onClose = after;
    const S = E.S;
    modal('<div class="evt-ic">⚔️</div><h2 style="text-align:center" class="down">敵対的買収提案</h2>' +
      '<p style="margin-top:10px">' + esc(t.raider) + ' が、当社株に ' + pct(t.premium, 0) +
      ' のプレミアムを乗せた公開買付を表明した。買付総額 ' + money(t.price) + '。</p>' +
      '<p class="tiny">PBR ' + S.pbr.toFixed(2) + ' 倍・株主信任 ' + Math.round(S.trust) +
      '。市場は当社を「解体したほうが価値がある会社」と見ている。<strong>防衛に失敗すれば当社は消滅する。</strong></p>' +
      '<h3>防衛策</h3>' +
      '<div class="mbtns" style="flex-direction:column;gap:8px">' +
      '<button data-def="buyback">自社株買いで対抗（' + money(E.defendCost()) + '・現金 ' + money(S.cash) + '）</button>' +
      '<button data-def="white">ホワイトナイトを招く（株式24%を渡す／成功率86%）</button>' +
      '<button data-def="explain">株主に説明する（信任 ' + Math.round(S.trust) + ' 次第・無償）</button>' +
      '</div>', true);
  }

  /* 出向のポジション指名 */
  function postModal(assetId, post) {
    const a = E.assetById(assetId);
    if (!a) return;
    const ps = D.POST_BY_ID[post];
    const cur = E.postHolder(a, post);
    const ab = ps.ab;
    const cands = E.hqPeople().slice().sort(function (x, y) { return y[ab] - x[ab]; }).slice(0, 8);
    let h = '<h2>' + ps.icon + ' ' + esc(a.name) + ' ／ ' + ps.name + '</h2>' +
      '<p>' + ps.desc + '。<strong>出向した幹部は本社の戦力から抜ける</strong>が、本人の成長は5割速くなる。</p>';
    if (cur) {
      h += '<h3>現任</h3>' + personCard(cur, '') +
        '<div class="mbtns"><button data-recall="' + cur.id + '">本社に呼び戻す</button></div>';
    }
    h += '<h3>送り込む幹部（' + (ab === 'lead' ? '統率' : ab === 'eye' ? '目利き' : '営業力') + '順）</h3>';
    if (!cands.length) h += '<div class="empty">本社に送り込める幹部がいない。</div>';
    cands.forEach(function (p) {
      h += personCard(p, 'data-second="' + assetId + '" data-ps="' + post + '" data-p="' + p.id + '"');
    });
    h += '<div class="mbtns"><button data-close>閉じる</button></div>';
    modal(h);
  }

  /* 定型商談課の設定 */
  function autoModal() {
    const S = E.S, a = S.auto;
    let h = '<h2>定型商談課</h2>' +
      '<p>一定規模以下の案件を、手動の商談枠とは<strong>別枠で</strong>自動的に応札する部署。' +
      '会社が大きくなっても小口の商いは続く。</p>' +
      '<div class="mbtns" style="margin:0 0 14px">' +
      '<button class="' + (a.on ? 'pri' : '') + '" data-auto="on">稼働</button>' +
      '<button class="' + (!a.on ? 'pri' : '') + '" data-auto="off">停止</button></div>' +
      '<h3>自動で捌く規模</h3><div class="aggr" style="grid-template-columns:repeat(4,1fr)">';
    D.AUTO_LIMITS.forEach(function (l, i) {
      h += '<button data-autolim="' + i + '" class="' + (a.limit === i ? 'on' : '') + '">' +
        '<b>' + D.DEAL_TIERS[l.tier].name + '</b>まで</button>';
    });
    h += '</div><p class="tiny muted">対象にした規模帯の案件は商談タブから隠れ、毎月まとめて処理される。</p>' +
      '<h3>提示条件</h3><div class="aggr" style="grid-template-columns:repeat(3,1fr)">';
    D.AUTO_STANCES.forEach(function (si, i) {
      h += '<button data-autost="' + i + '" class="' + (a.stance === i ? 'on' : '') + '">' +
        '<b>' + D.STANCES[si].n + '</b>×' + D.STANCES[si].mult.toFixed(2) + '</button>';
    });
    h += '</div><div class="kv" style="margin-top:12px">' +
      '<span class="k">月間の応札枠</span><span class="v">' + E.autoCap() + '件</span>' +
      '<span class="k">同時に抱えられる件数</span><span class="v">' + E.autoBook() + '件</span>' +
      '</div><p class="tiny muted">枠は社員数・DX投資・本社の幹部数で増える。</p>' +
      '<div class="mbtns"><button class="pri" data-close>閉じる</button></div>';
    modal(h);
  }

  /* セーブデータ */
  function slotsModal(fromTitle) {
    const list = E.slotList();
    let h = '<h2>セーブデータ</h2>' +
      '<p class="tiny">自動セーブは毎月更新される。手動スロット1〜3には、残しておきたい局面を保存できる。</p>';
    list.forEach(function (sl) {
      const auto = sl.id === 'auto';
      h += '<div class="slot"><div class="ic">' + (auto ? '🔄' : '💾') + '</div><div class="m">' +
        '<b>' + (auto ? '自動セーブ' : 'スロット ' + sl.id) + '</b>' +
        '<span>' + (sl.empty ? '空き'
          : esc(sl.company) + ' ／ ' + sl.stage + ' ／ ' + sl.date + ' ／ 純資産 ' + money(sl.equity) +
            (sl.over ? '（破綻）' : sl.cleared ? '（クリア）' : '')) + '</span></div>' +
        '<div class="a">' +
        (E.S && !auto ? '<button data-svsave="' + sl.id + '">保存</button>' : '') +
        (!sl.empty ? '<button class="pri" data-svload="' + sl.id + '">' + (fromTitle ? '開始' : '再開') + '</button>' : '') +
        (!sl.empty && !auto ? '<button class="dan" data-svdel="' + sl.id + '">×</button>' : '') +
        '</div></div>';
    });
    h += '<h3>書き出し / 読み込み</h3>' +
      '<p class="tiny">端末を移すときは、下の文字列をコピーして保存しておく。貼り付けて「読み込む」で復元できる。</p>' +
      '<textarea class="sv-txt" id="sv-txt" placeholder="ここにセーブデータを貼り付けて「読み込む」">' +
      (E.S ? esc(E.exportText()) : '') + '</textarea>' +
      '<div class="mbtns"><button data-svcopy>コピー</button><button data-svimport>読み込む</button></div>' +
      '<div class="mbtns"><button class="pri" data-close>閉じる</button></div>';
    modal(h);
  }

  function endModal(win) {
    const S = E.S;
    onClose = null;
    modal('<div class="evt-ic">' + (win ? '👑' : S.overReason === 'tob' ? '⚔️'
        : S.overReason === 'ousted' ? '🚪' : '💀') + '</div>' +
      '<h2 style="text-align:center">' + (win ? '世界最大の総合商社'
        : S.overReason === 'tob' ? '被買収' : S.overReason === 'ousted' ? '社長解任' : '経営破綻') + '</h2>' +
      '<p style="text-align:center;margin-top:8px">' +
      (win ? esc(S.company) + ' は世界の頂点に立った。<br>ラーメンから航空機まで、地球上のあらゆる商いが<br>この会社を通っている。'
           : S.overReason === 'tob'
             ? esc(S.company) + ' は敵対的買収に屈した。<br>看板は下ろされ、事業は切り売りされていく。'
             : S.overReason === 'ousted'
               ? esc(S.company) + ' は残る。<br>ただし、あなたはもうその経営者ではない。'
             : esc(S.company) + ' は債務超過に陥り、<br>再建を断念した。') + '</p>' +
      '<div class="fy-grid">' +
      '<div class="b"><label>最終純資産</label><b class="gold">' + money(E.equity()) + '</b></div>' +
      '<div class="b"><label>経過</label><b>' + Math.floor(S.turn / 12) + '年' + (S.turn % 12) + 'ヶ月</b></div>' +
      '<div class="b"><label>累計純利益</label><b>' + signed(S.stats.cumProfit) + '</b></div>' +
      '<div class="b"><label>世界順位</label><b>' + E.myRank() + '位</b></div>' +
      '</div>' +
      '<div class="mbtns"><button class="pri" data-act="reset">新たな会社を興す</button></div>', true);
  }

  return {
    render: render, setTab: setTab, get tab() { return tab; },
    modal: modal, closeModal: closeModal, alertBox: alertBox,
    openDeal: openDeal, drawDeal: drawDeal, bidResult: bidResult,
    amountModal: amountModal, eventModal: eventModal,
    fyOpen: fyOpen, fyAlloc: fyAlloc, fyNav: fyNav, fyTier: fyTier, fyCard: fyCard,
    fyGrad: fyGrad, fyPromo: fyPromo, fyGradPol: fyGradPol, setBand: setBand,
    personCard: personCard, personModal: personModal, setAdminSub: setAdminSub,
    maOpen: maOpen, maDraw: maDraw, tobModal: tobModal, setBizSub: setBizSub,
    postModal: postModal, autoModal: autoModal, slotsModal: slotsModal,
    setOffer: function (i) { curOffer = i; maDraw(); },
    promoteModal: promoteModal, endModal: endModal,
    setStance: function (i) { curStance = i; drawDeal(); },
    esc: esc,
  };
})();

</script>
<script>
/* =========================================================
 *  SOGO SHOSHA - bootstrap & input wiring
 * ======================================================= */
(function () {
  const D = window.GAME, E = window.ENGINE, U = window.UI;
  const $ = function (s) { return document.querySelector(s); };

  /* ---- モーダルを順番に流す ---- */
  function runQueue(items, done) {
    let i = 0;
    (function next() {
      if (i >= items.length) { U.render(); if (done) done(); return; }
      const f = items[i++];
      f(next);
    })();
  }

  function startTurn() {
    const S = E.S;
    if (S.over || S.cleared) { U.endModal(S.cleared); return; }
    const out = E.advance();
    const q = [];
    if (out.event) q.push(function (n) { U.eventModal(out.event, n); });
    if (out.tob) q.push(function (n) { U.tobModal(out.tob, n); });
    if (out.fy) q.push(function (n) { U.fyOpen(out.fy, n); });
    if (out.promote) q.push(function (n) { U.promoteModal(out.promote, n, out.raise); });
    U.render();
    runQueue(q, function () {
      // 決算ウィザード中の信任投票などでも終局しうるため、最後に必ず確認する
      if (E.S.over) U.endModal(false);
      else if (E.S.cleared) U.endModal(true);
    });
  }

  /* ---- 起動 ---- */
  function boot(state) {
    $('#title').classList.add('hide');
    $('#app').hidden = false;
    U.setTab('dash');
  }

  function newGame() {
    const name = ($('#input-company').value || '').trim() || '蒼龍商事';
    E.newGame(name);
    E.save();
    boot();
    U.alertBox('創業',
      'ようこそ、' + U.esc(E.S.company) + ' へ。<br><br>' +
      '① <b>商談</b>タブで案件に応札し、<br>② <b>翌月へ</b>で月を進めて損益を確定、<br>' +
      '③ 稼いだ資金を<b>本社</b>で本部・人員・拠点へ再投資する。<br><br>' +
      'トレードの利益を<b>権益・事業投資</b>に変え、<br>市況に左右されないストック収益を積み上げるのが<br>総合商社の勝ち筋だ。', 'gold');
  }

  /* ---- イベント委譲 ---- */
  document.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-close],[data-bid],[data-stance],[data-deal],[data-sell],[data-up],[data-office],[data-act],[data-fy],[data-alloc],[data-tier],[data-card],[data-grad],[data-gpol],[data-band],[data-promo],[data-sub],[data-person],[data-pdiv],[data-preg],[data-phead],[data-hire],[data-ma],[data-offer],[data-dd],[data-buy],[data-pmi],[data-setpmi],[data-exit],[data-exitok],[data-def],[data-org],[data-orgok],[data-bsub],[data-co],[data-post],[data-second],[data-recall],[data-auto],[data-autolim],[data-autost],[data-svsave],[data-svload],[data-svdel],[data-svcopy],[data-svimport],#btn-slots,#tabs button,#btn-next,#btn-start,#btn-continue');
    if (!t) return;

    /* --- タイトル --- */
    if (t.id === 'btn-start') { newGame(); return; }
    if (t.id === 'btn-continue') {
      if (E.load()) { boot(); U.render(); }
      else U.alertBox('データなし', 'セーブデータが見つからなかった。', 'down');
      return;
    }
    if (t.id === 'btn-slots') { U.slotsModal(true); return; }

    /* --- セーブ / ロード --- */
    if (t.hasAttribute('data-svsave')) {
      const r = E.saveSlot(t.dataset.svsave);
      U.closeModal();
      if (!r.ok) U.alertBox('保存できない', r.msg, 'down');
      else U.alertBox('保存', 'スロット ' + t.dataset.svsave + ' に保存した。', 'up');
      return;
    }
    if (t.hasAttribute('data-svload')) {
      if (!E.loadSlot(t.dataset.svload)) { U.alertBox('読み込めない', 'このスロットのデータが壊れているようだ。', 'down'); return; }
      U.closeModal();
      $('#title').classList.add('hide');
      $('#app').hidden = false;
      U.setTab('dash');
      return;
    }
    if (t.hasAttribute('data-svdel')) {
      E.deleteSlot(t.dataset.svdel);
      U.slotsModal(!E.S);
      return;
    }
    if (t.hasAttribute('data-svcopy')) {
      const ta = document.querySelector('#sv-txt');
      if (ta) {
        ta.select(); ta.setSelectionRange(0, 999999);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).catch(function () {}); ok = true; }
        t.textContent = ok ? 'コピーした' : '手動で選択してコピー';
      }
      return;
    }
    if (t.hasAttribute('data-svimport')) {
      const ta = document.querySelector('#sv-txt');
      if (!ta || !ta.value.trim()) { U.alertBox('読み込めない', 'セーブデータを貼り付けてから押してほしい。', 'down'); return; }
      const r = E.importText(ta.value);
      if (!r.ok) { U.alertBox('読み込めない', r.msg, 'down'); return; }
      U.closeModal();
      $('#title').classList.add('hide');
      $('#app').hidden = false;
      U.setTab('dash');
      U.alertBox('読み込み完了', U.esc(E.S.company) + ' の記録を復元した。', 'up');
      return;
    }

    /* --- モーダル --- */
    if (t.hasAttribute('data-close')) { U.closeModal(); U.render(); return; }
    if (t.hasAttribute('data-stance')) { U.setStance(+t.dataset.stance); return; }
    if (t.hasAttribute('data-bid')) {
      const res = E.bid(t.dataset.bid, currentStance());
      E.save();
      U.bidResult(res);
      return;
    }
    if (t.hasAttribute('data-fy')) { U.fyNav(t.dataset.fy); return; }
    if (t.hasAttribute('data-alloc')) { U.fyAlloc(t.dataset.alloc, +t.dataset.d); return; }
    if (t.hasAttribute('data-tier')) { U.fyTier(t.dataset.tier, +t.dataset.i); return; }
    if (t.hasAttribute('data-card')) { U.fyCard(t.dataset.card); return; }
    if (t.hasAttribute('data-grad')) { U.fyGrad(+t.dataset.grad); return; }
    if (t.hasAttribute('data-gpol')) { U.fyGradPol(+t.dataset.gpol); return; }
    if (t.hasAttribute('data-band')) { U.setBand(+t.dataset.band); return; }
    if (t.hasAttribute('data-promo')) { U.fyPromo(t.dataset.promo); return; }
    if (t.hasAttribute('data-sub')) { U.setAdminSub(t.dataset.sub); return; }
    if (t.hasAttribute('data-bsub')) { U.setBizSub(t.dataset.bsub); return; }
    if (t.hasAttribute('data-co')) { U.maOpen(t.dataset.co); return; }
    if (t.hasAttribute('data-post')) { U.postModal(t.dataset.post, t.dataset.ps); return; }
    if (t.hasAttribute('data-second')) {
      const r = E.secondTo(t.dataset.second, t.dataset.ps, t.dataset.p);
      U.closeModal();
      if (!r.ok) U.alertBox('出向させられない', r.msg, 'down');
      U.render();
      return;
    }
    if (t.hasAttribute('data-recall')) {
      E.recallPerson(t.dataset.recall);
      U.closeModal(); U.render();
      return;
    }
    if (t.hasAttribute('data-auto')) { E.setAuto({ on: t.dataset.auto === 'on' }); U.autoModal(); U.render(); return; }
    if (t.hasAttribute('data-autolim')) { E.setAuto({ limit: +t.dataset.autolim }); U.autoModal(); U.render(); return; }
    if (t.hasAttribute('data-autost')) { E.setAuto({ stance: +t.dataset.autost }); U.autoModal(); U.render(); return; }
    if (t.hasAttribute('data-person')) { U.personModal(t.dataset.person); return; }
    if (t.hasAttribute('data-org')) {
      const o = window.GAME.ORG_BY_ID[t.dataset.org];
      U.modal('<h2>' + o.icon + ' ' + o.name + 'へ移行</h2>' +
        '<p class="up">＋ ' + o.good + '</p><p class="down">− ' + o.bad + '</p>' +
        '<p>移行費用 ' + E.money(E.orgSwitchCost()) + '。現場は当面混乱し、士気が下がる。<br>' +
        '一度移行すると3年は戻せない。</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-orgok="' + o.id + '">移行する</button></div>');
      return;
    }
    if (t.hasAttribute('data-orgok')) {
      const r = E.switchOrg(t.dataset.orgok);
      U.closeModal();
      if (!r.ok) U.alertBox('移行できない', r.msg, 'down');
      U.render();
      return;
    }
    if (t.hasAttribute('data-ma')) { U.maOpen(t.dataset.ma); return; }
    if (t.hasAttribute('data-offer')) { U.setOffer(+t.dataset.offer); return; }
    if (t.hasAttribute('data-dd')) {
      const r = E.runDD(t.dataset.dd);
      if (!r.ok) U.alertBox('実施できない', r.msg, 'down'); else U.maDraw();
      U.render();
      return;
    }
    if (t.hasAttribute('data-buy')) {
      const r = E.acquire(t.dataset.buy, currentOffer());
      U.closeModal();
      if (!r.ok) U.alertBox('提案できない', r.msg, 'down');
      else if (r.won) U.alertBox('買収成立',
        '「' + U.esc(r.target.name) + '」を ' + E.money(r.price) + ' で取得した。<br>' +
        'のれん ' + E.money(r.goodwill) + ' を計上。<br><br>' +
        (r.surprise > 0 ? '<span class="down">DDを省いたツケで、' + E.money(r.surprise) + ' の簿外債務が発覚した。</span><br><br>' : '') +
        'これから12ヶ月の<b>統合（PMI）</b>に入る。投資タブで統合責任者を指名せよ。', 'up');
      else U.alertBox('競り負け', '「' + U.esc(r.target.name) + '」は他社に取られた。<br>成約確度は ' + Math.round(r.prob * 100) + '% だった。', 'down');
      U.render();
      return;
    }
    if (t.hasAttribute('data-pmi')) {
      const aid = t.dataset.pmi;
      const cands = E.S.people.slice().sort(function (a, b) { return b.lead - a.lead; }).slice(0, 8);
      let h = '<h2>統合責任者の指名</h2><p>統率の高い幹部を送り込むほど統合の成功率が上がる。' +
        '「PMIの鬼」を持つ人材がいれば最優先だ。</p>';
      if (!cands.length) h += '<div class="empty">送り込める幹部がいない。</div>';
      cands.forEach(function (p) { h += U.personCard(p, 'data-setpmi="' + aid + '" data-p="' + p.id + '"'); });
      h += '<div class="mbtns"><button data-close>閉じる</button></div>';
      U.modal(h);
      return;
    }
    if (t.hasAttribute('data-setpmi')) {
      E.setPMILeader(t.dataset.setpmi, t.dataset.p);
      U.closeModal(); U.render();
      return;
    }
    if (t.hasAttribute('data-exit')) {
      const a = E.S.assets.filter(function (x) { return x.id === t.dataset.exit; })[0];
      if (!a) return;
      U.modal('<h2>事業会社の売却</h2><p>「' + U.esc(a.name) + '」を売却する。<br>' +
        '育てた会社を高値で手放すのは、商社の本来の稼ぎ方でもある。<br><br>' +
        '現在価値 ' + E.money(a.value) + '／シナジー ×' + (1 + a.synergy * 0.55).toFixed(2) + '</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-exitok="' + a.id + '">売却する</button></div>');
      return;
    }
    if (t.hasAttribute('data-exitok')) {
      const r = E.exitCompany(t.dataset.exitok);
      U.closeModal();
      if (!r.ok) U.alertBox('売却できない', r.msg, 'down');
      else U.alertBox('EXIT', E.money(r.proceeds) + ' で売却した。', 'up');
      U.render();
      return;
    }
    if (t.hasAttribute('data-def')) {
      const r = E.defendTOB(t.dataset.def);
      if (!r.ok) { U.alertBox('実行できない', r.msg, 'down'); return; }
      U.closeModal();
      if (r.defended) U.alertBox('防衛成功', r.msg, 'up');
      else U.endModal(false);
      U.render();
      return;
    }
    if (t.hasAttribute('data-pdiv')) { E.assignDiv(t.dataset.pdiv, t.dataset.v); U.personModal(t.dataset.pdiv); U.render(); return; }
    if (t.hasAttribute('data-preg')) { E.dispatchTo(t.dataset.preg, t.dataset.v || null); U.personModal(t.dataset.preg); U.render(); return; }
    if (t.hasAttribute('data-phead')) {
      const r = E.appointHead(t.dataset.phead);
      if (!r.ok) U.alertBox('任命できない', r.msg, 'down'); else { U.closeModal(); U.render(); }
      return;
    }

    /* --- タブ --- */
    if (t.closest('#tabs')) { U.setTab(t.dataset.tab); return; }
    if (t.id === 'btn-next') { startTurn(); return; }

    /* --- 一覧操作 --- */
    if (t.hasAttribute('data-deal')) { U.openDeal(t.dataset.deal); return; }
    if (t.hasAttribute('data-sell')) {
      const a = E.S.assets.find(function (x) { return x.id === t.dataset.sell; });
      if (!a) return;
      U.modal('<h2>資産の売却</h2><p>「' + U.esc(a.name) + '」を売却する。<br>' +
        '簿価 ' + E.money(a.value) + ' 前後で現金化できるが、将来の配当収入を失う。</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-act="sell-ok" data-id="' + a.id + '">売却する</button></div>');
      return;
    }
    if (t.hasAttribute('data-up')) {
      const r = E.upgrade(t.dataset.up);
      if (!r.ok) U.alertBox('投資できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }
    if (t.hasAttribute('data-office')) {
      const r = E.openOffice(t.dataset.office);
      if (!r.ok) U.alertBox('開設できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }

    /* --- 本社アクション --- */
    const act = t.dataset.act;
    if (act === 'sell-ok') { E.sellAsset(t.dataset.id); E.save(); U.closeModal(); U.render(); return; }
    if (act === 'autocfg') { U.autoModal(); return; }
    if (act === 'slots') { U.slotsModal(false); return; }
    if (act === 'career') {
      const cs = E.careerCandidates();
      window.__cands = cs;
      let h = '<h2>キャリア採用</h2><p>3名の候補から1名を選ぶ。採用コスト ' + E.money(E.careerCost()) + '。</p>';
      cs.forEach(function (p, i) {
        h += U.personCard(p, 'data-hire="' + i + '"');
      });
      h += '<div class="mbtns"><button data-close>見送る</button></div>';
      U.modal(h);
      return;
    }
    if (t.hasAttribute('data-hire')) {
      const p = (window.__cands || [])[+t.dataset.hire];
      if (!p) return;
      const r = E.hireCareer(p);
      if (!r.ok) U.alertBox('採用できない', r.msg, 'down');
      else { U.closeModal(); U.alertBox('入社', U.esc(p.name) + ' が入社した。<br>「' + E.toneOf(p).join + '」', 'up'); }
      U.render();
      return;
    }
    if (act === 'hunt') {
      const r = E.headhunt();
      if (!r.ok) { U.alertBox('実行できない', r.msg, 'down'); return; }
      if (r.won) U.alertBox('引き抜き成功', r.person.face + ' ' + U.esc(r.person.name) + '（' + r.person.age + '）が移籍を決めた。<br>「' + E.toneOf(r.person).join + '」', 'up');
      else U.alertBox('不調', 'ヘッドハントは実らなかった。<br>業界に話が漏れ、体裁が悪い。（成功率 ' + Math.round(r.prob * 100) + '%）', 'down');
      U.render();
      return;
    }
    if (act === 'hire') {
      const r = E.hire();
      if (!r.ok) U.alertBox('採用できない', r.msg, 'down'); else { E.save(); U.render(); }
      return;
    }
    if (act === 'borrow') {
      U.amountModal('銀行借入', '格付 ' + E.rating().label + ' に基づく借入枠は ' + E.money(E.borrowLimit()) +
        '。年利 ' + E.pct(E.interestRate(), 2) + ' の利息が毎月発生する。',
        E.borrowLimit(), function (v) { E.borrow(v); E.save(); });
      return;
    }
    if (act === 'repay') {
      U.amountModal('繰上返済', '有利子負債 ' + E.money(E.S.debt) + ' を返済し、財務体質と信用力を改善する。',
        Math.min(E.S.debt, E.S.cash), function (v) { E.repay(v); E.save(); });
      return;
    }
    if (act === 'reset') {
      U.modal('<h2>やり直す</h2><p>現在の会社を清算し、最初から始める。<br>この操作は取り消せない。</p>' +
        '<div class="mbtns"><button data-close>やめる</button>' +
        '<button class="pri" data-act="reset-ok">清算する</button></div>');
      return;
    }
    if (act === 'reset-ok') {
      E.wipe();
      U.closeModal();
      $('#app').hidden = true;
      $('#title').classList.remove('hide');
      $('#btn-continue').hidden = true;
      return;
    }
  });

  function currentOffer() {
    const on = document.querySelector('.aggr button.on[data-offer]');
    return on ? +on.dataset.offer : 2;
  }
  function currentStance() {
    const on = document.querySelector('.aggr button.on');
    return on ? +on.dataset.stance : 2;
  }

  /* 背景タップで閉じる（決算・終局は除く） */
  document.addEventListener('click', function (ev) {
    if (ev.target.classList.contains('backdrop')) {
      const box = $('#modal-box');
      if (box.querySelector('[data-fy]') || box.querySelector('[data-act="reset"]') ||
          box.querySelector('[data-def]')) return;
      U.closeModal(); U.render();
    }
  });

  /* ---- 初期表示 ---- */
  if (E.hasSave()) $('#btn-continue').hidden = false;
})();

</script>
</body>
</html>
