<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<title>SOGO SHOSHA 〜総合商社経営〜</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e14; --bg2:#121722; --card:#161c28; --card2:#1d2432;
  --line:#28303f; --line2:#374056;
  --fg:#e8edf6; --dim:#9aa5b8; --dim2:#6b7688;
  --gold:#d9b25f; --gold2:#f0d296;
  --up:#4bd18a; --down:#ff6b6b; --info:#5aa9ff; --warn:#ffb454;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
input{font-family:inherit}

/* ---------- title ---------- */
#title{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,#1b2334 0%,#0b0e14 60%);
  padding:24px;overflow:auto;
}
#title.hide{display:none}
.title-inner{width:100%;max-width:380px;text-align:center}
.title-inner .tag{font-size:9.5px;letter-spacing:.34em;color:var(--gold);margin:0 0 14px}
.title-inner h1{
  font-size:46px;line-height:.98;margin:0;letter-spacing:.06em;font-weight:800;
  background:linear-gradient(180deg,#fff 10%,var(--gold2) 55%,#a5813a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.title-inner .sub{margin:10px 0 0;font-size:14px;letter-spacing:.24em;color:var(--dim)}
.title-inner .lead{margin:22px 0 26px;font-size:12.5px;color:var(--dim);line-height:1.9}
.field{display:block;text-align:left;margin-bottom:16px}
.field span{display:block;font-size:10.5px;color:var(--dim2);letter-spacing:.14em;margin-bottom:6px}
.field input{
  width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line2);
  border-radius:11px;color:var(--fg);font-size:16px;outline:none;
}
.field input:focus{border-color:var(--gold)}
.btn-primary{
  width:100%;padding:15px;border:0;border-radius:11px;font-size:15px;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(180deg,var(--gold2),#b8913f);color:#241a05;
}
.btn-ghost{
  width:100%;padding:12px;margin-top:10px;border:1px solid var(--line2);border-radius:11px;
  background:transparent;color:var(--dim);font-size:13px;
}
.credit{margin-top:26px;font-size:10.5px;color:var(--dim2);line-height:1.9}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
#hud{background:linear-gradient(180deg,#151b28,#10141d);border-bottom:1px solid var(--line);padding:10px 12px 0;flex:0 0 auto}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-id{display:flex;align-items:center;gap:7px;min-width:0}
#hud-company{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-badge{
  flex:0 0 auto;font-size:9.5px;padding:3px 7px;border-radius:5px;letter-spacing:.06em;
  background:rgba(217,178,95,.14);color:var(--gold2);border:1px solid rgba(217,178,95,.35);
}
.hud-date{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 8px}
.hud-stats .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-width:0}
.hud-stats label{display:block;font-size:9px;color:var(--dim2);letter-spacing:.05em}
.hud-stats b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-mkt{display:flex;gap:9px;align-items:baseline;font-size:10px;color:var(--dim2);padding-bottom:7px;
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.hud-mkt b{color:var(--fg);font-size:11px;font-weight:600}
.hud-mkt .sep{color:var(--line2)}

/* 決算ウィザード */
.wiz-step{display:flex;gap:5px;margin-bottom:14px}
.wiz-step i{flex:1;height:3px;border-radius:2px;background:var(--line2);display:block}
.wiz-step i.on{background:var(--gold)}
.seg-t{width:100%;border-collapse:collapse;font-size:12px}
.seg-t th,.seg-t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.seg-t th{font-size:9.5px;color:var(--dim2);letter-spacing:.04em;font-weight:500}
.seg-t th:first-child,.seg-t td:first-child{text-align:left;white-space:nowrap}
.seg-t tr.tot td{border-top:1px solid var(--line2);border-bottom:0;font-weight:700;padding-top:8px}
.seg-t tr.corp td{color:var(--dim)}
.alloc{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.alloc:last-child{border-bottom:0}
.alloc .ic{width:22px;text-align:center;font-size:16px;flex:0 0 auto}
.alloc .nm{flex:1 1 auto;min-width:0}
.alloc .nm b{display:block;font-size:12.5px}
.alloc .nm span{display:block;font-size:9.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc .amt{flex:0 0 auto;width:62px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.alloc .pm{flex:0 0 auto;display:flex;gap:4px}
.alloc .pm button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--card2);font-size:15px;line-height:1;padding:0}
.alloc .pm button[disabled]{opacity:.3}
.pool{display:flex;justify-content:space-between;align-items:baseline;padding:9px 11px;background:var(--card2);
  border:1px solid var(--line2);border-radius:9px;margin-bottom:10px;font-size:12px}
.pool b{font-size:16px;font-variant-numeric:tabular-nums}
.hud-bar{position:relative;height:14px;background:#0a0d13;border-top:1px solid var(--line);margin:0 -12px}
#hud-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#8a6d2c,var(--gold));transition:width .5s}
#hud-bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#e9dcbd;letter-spacing:.06em}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}

#turnbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--bg2);border-top:1px solid var(--line);
}
.slots{flex:0 0 auto}
#slot-label{display:block;font-size:9px;color:var(--dim2);letter-spacing:.06em}
#slot-dots{display:flex;gap:3px;margin-top:3px}
#slot-dots i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:block}
#slot-dots i.on{background:var(--gold);box-shadow:0 0 6px rgba(217,178,95,.6)}
.btn-next{
  flex:1 1 auto;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(180deg,#2f6ee0,#1f4fae);color:#fff;box-shadow:0 2px 0 #16336f;
}
.btn-next:active{transform:translateY(1px);box-shadow:0 1px 0 #16336f}
.btn-next.warn{background:linear-gradient(180deg,#e0803a,#a85a20);box-shadow:0 2px 0 #6f3a13}

#tabs{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);
  background:#0a0d13;border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
#tabs button{background:none;border:0;padding:7px 0 8px;color:var(--dim2);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button i{font-style:normal;font-size:16px;line-height:1}
#tabs button span{font-size:8.5px;letter-spacing:0;white-space:nowrap}
#tabs button.on{color:var(--gold2)}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold)}
#tabs button .badge{
  position:absolute;top:2px;right:calc(50% - 17px);min-width:15px;height:15px;padding:0 4px;
  background:var(--down);color:#fff;border-radius:8px;font-size:9px;line-height:15px;font-weight:700;
}

/* ---------- common blocks ---------- */
.sect{margin:0 0 8px;font-size:10px;letter-spacing:.16em;color:var(--dim2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.tap:active{background:var(--card2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--dim)}
.small{font-size:11px}
.tiny{font-size:10px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold2)} .info{color:var(--info)} .warn{color:var(--warn)}
.empty{text-align:center;color:var(--dim2);font-size:12px;padding:34px 10px;line-height:2}

.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
.kv .k{color:var(--dim)}
.kv .v{font-variant-numeric:tabular-nums;text-align:right}

.pill{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.04em}
.pill.t-trade{color:#7fd7ff;border-color:#2c5a76;background:rgba(90,169,255,.08)}
.pill.t-project{color:#ffc98a;border-color:#7a5628;background:rgba(255,180,84,.08)}
.pill.t-concession{color:#c9a0ff;border-color:#5a3f86;background:rgba(170,120,255,.08)}
.pill.t-investment{color:#8ce8b4;border-color:#2f6b4c;background:rgba(75,209,138,.08)}

.deal{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.deal:active{background:var(--card2)}
.deal-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal-t{font-size:13px;font-weight:600;line-height:1.35}
.deal-m{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
.deal-f{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:11px}

.bar{height:5px;background:#0a0d13;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6ee0,#5aa9ff)}
.bar.g>i{background:linear-gradient(90deg,#8a6d2c,var(--gold))}

.mkt{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.mkt .m{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.mkt .m .n{font-size:10px;color:var(--dim)}
.mkt .m .p{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.mkt .m .p b{font-size:14px}
.mkt .m .p em{font-style:normal;font-size:10.5px}

.divrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.divrow:last-child{border-bottom:0}
.divrow .ic{font-size:19px;width:24px;text-align:center;flex:0 0 auto}
.divrow .nm{flex:1 1 auto;min-width:0}
.divrow .nm b{display:block;font-size:12.5px;font-weight:600}
.divrow .nm .bar{margin-top:5px}
.divrow .lv{flex:0 0 auto;text-align:right}
.divrow .lv b{font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}
.act{flex:0 0 auto;border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:6px 9px;font-size:11px;white-space:nowrap}
.act:active{background:#2a3242}
.act[disabled]{opacity:.35}
.act.gold{border-color:#7d6229;background:rgba(217,178,95,.12);color:var(--gold2)}

.logline{font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.logline:last-child{border-bottom:0}
.logline .t{color:var(--dim2);flex:0 0 58px;font-variant-numeric:tabular-nums}
.logline .b{flex:1 1 auto}

.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:22px;text-align:center;font-size:15px;font-weight:700;color:var(--dim2);flex:0 0 auto}
.rank.me{background:rgba(217,178,95,.07);margin:0 -12px;padding:9px 12px;border-radius:6px}
.rank.me .no{color:var(--gold)}
.rank .nm{flex:1 1 auto;font-size:13px}
.rank .vl{font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- 人材 ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;padding:8px 4px;border-radius:9px;border:1px solid var(--line2);
  background:var(--card);font-size:12px;color:var(--dim)}
.subtabs button.on{border-color:var(--gold);background:rgba(217,178,95,.12);color:var(--gold2);font-weight:600}

.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:9px}
.pcard:active{background:var(--card2)}
.pcard.head{border-color:var(--gold-line,#7d6229);background:rgba(217,178,95,.06)}
.ph{display:flex;gap:10px;align-items:flex-start}
.ph .fc{font-size:27px;line-height:1.1;flex:0 0 auto;width:34px;text-align:center}
.ph .id{flex:1 1 auto;min-width:0}
.ph .id b{font-size:13.5px;display:block}
.ph .id .sub{font-size:10.5px;color:var(--dim2);margin-top:2px}
.ph .rl{flex:0 0 auto;text-align:right}
.ph .rl .r{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.ph .rl .r.h{border-color:var(--gold);color:var(--gold2);background:rgba(217,178,95,.12)}
.abs{display:grid;grid-template-columns:auto 1fr auto;gap:3px 7px;align-items:center;margin-top:9px}
.abs .l{font-size:9.5px;color:var(--dim2)}
.abs .v{font-size:10px;font-variant-numeric:tabular-nums;color:var(--dim);text-align:right;min-width:18px}
.abs .g{height:4px;background:#0a0d13;border-radius:2px;overflow:hidden}
.abs .g i{display:block;height:100%}
.abs .g.s i{background:#5aa9ff} .abs .g.e i{background:#c9a0ff} .abs .g.d i{background:var(--gold)}
.trait{margin-top:8px;font-size:10.5px;color:var(--gold2);display:flex;gap:5px;align-items:baseline}
.trait span{color:var(--dim);font-size:10px}
.pnews{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.5px;align-items:flex-start}
.pnews:last-child{border-bottom:0}
.pnews .f{flex:0 0 auto;font-size:15px;width:20px;text-align:center}
.pnews .t{flex:0 0 46px;color:var(--dim2);font-size:10px;font-variant-numeric:tabular-nums;padding-top:1px}
.quote{border-left:2px solid var(--gold);padding:7px 0 7px 11px;margin:10px 0;font-size:12px;color:var(--dim);line-height:1.75}
.quote b{display:block;color:var(--fg);font-size:11.5px;margin-bottom:3px;font-weight:600}

/* ---------- 事業（企業ユニバース） ---------- */
.sector{margin:14px 0 7px;display:flex;align-items:baseline;gap:7px}
.sector b{font-size:13px}
.sector span{font-size:10px;color:var(--dim2)}
.co{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:10px 11px;margin-bottom:7px}
.co:active{background:var(--card2)}
.co.mine{border-color:var(--gold-line,#7d6229);background:rgba(217,178,95,.07)}
.co.sale{border-color:#2f6b4c}
.co.taken{opacity:.55}
.co-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.co-h .n{font-size:12.5px;font-weight:600;line-height:1.35}
.co-h .v{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.co-m{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.co-b{font-size:9px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.co-b.sale{color:var(--up);border-color:#2f6b4c;background:rgba(75,209,138,.08)}
.co-b.mine{color:var(--gold2);border-color:var(--gold);background:rgba(217,178,95,.12)}
.co-b.taken{color:var(--dim2)}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.posts button{padding:8px 5px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  text-align:center;font-size:10px;line-height:1.5;color:var(--dim)}
.posts button.on{border-color:var(--gold);background:rgba(217,178,95,.12);color:var(--gold2)}
.posts button b{display:block;font-size:15px;margin-bottom:1px}
.posts button .who{display:block;font-size:9.5px;color:var(--fg);margin-top:2px}

/* ---------- セーブスロット ---------- */
.slot{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .ic{width:26px;text-align:center;font-size:16px;flex:0 0 auto}
.slot .m{flex:1 1 auto;min-width:0}
.slot .m b{display:block;font-size:12.5px}
.slot .m span{display:block;font-size:9.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .a{display:flex;gap:5px;flex:0 0 auto}
.slot .a button{padding:6px 8px;font-size:10.5px;border-radius:7px;border:1px solid var(--line2);background:var(--card2)}
.slot .a button.pri{border-color:var(--gold);color:var(--gold2);background:rgba(217,178,95,.12)}
.slot .a button.dan{border-color:#7a3030;color:#ff9a9a}
.sv-txt{width:100%;height:110px;background:#0a0d13;border:1px solid var(--line2);border-radius:9px;
  color:var(--dim);font-family:ui-monospace,monospace;font-size:10px;padding:9px;resize:vertical}

/* ---------- 年次チャート ---------- */
.chart{margin:6px 0 2px}
.chart svg{display:block;width:100%;height:auto}
.chart .ct{font-size:10.5px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between;align-items:baseline}
.chart .ct b{font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.chart .cx{font-size:9px;fill:var(--dim2)}
.chart .cl{font-size:9.5px;fill:var(--fg);font-variant-numeric:tabular-nums}
.chart .cz{stroke:var(--line2);stroke-width:1}

/* ---------- 給与・採用 ---------- */
.band{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 6px}
.band button{padding:8px 1px;border-radius:8px;border:1px solid var(--line2);background:var(--card);
  font-size:9px;line-height:1.45;color:var(--dim)}
.band button.on{border-color:var(--gold);background:rgba(217,178,95,.14);color:var(--gold2);font-weight:600}
.band button b{display:block;font-size:11px}
.paytbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.paytbl th,.paytbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.paytbl th{font-size:9.5px;color:var(--dim2);font-weight:500}
.paytbl th:first-child,.paytbl td:first-child{text-align:left}
.paytbl tr.none td{color:var(--dim2)}
.pol{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.pol button{padding:9px 8px;border-radius:9px;border:1px solid var(--line2);background:var(--card);text-align:left}
.pol button.on{border-color:var(--gold);background:rgba(217,178,95,.12)}
.pol button b{display:block;font-size:12px;margin-bottom:3px}
.pol button .g{display:block;font-size:9.5px;color:var(--up);line-height:1.5}
.pol button .x{display:block;font-size:9.5px;color:var(--down);line-height:1.5;margin-top:2px}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
#modal-root .backdrop{position:absolute;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(3px)}
.modal{
  position:relative;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:16px;line-height:1.35}
.modal h3{margin:16px 0 7px;font-size:10px;letter-spacing:.16em;color:var(--dim2)}
.modal p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.75}
.mbtns{display:flex;gap:8px;margin-top:16px}
.mbtns button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:13.5px;font-weight:600}
.mbtns button.pri{border:0;background:linear-gradient(180deg,var(--gold2),#b8913f);color:#241a05}
.mbtns button.blue{border:0;background:linear-gradient(180deg,#2f6ee0,#1f4fae);color:#fff}
.mbtns button[disabled]{opacity:.4}

.aggr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.aggr button{padding:9px 2px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:10.5px;line-height:1.5}
.aggr button.on{border-color:var(--gold);background:rgba(217,178,95,.14);color:var(--gold2)}
.aggr button b{display:block;font-size:13px}

.gauge{height:8px;background:#0a0d13;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.gauge>i{display:block;height:100%;transition:width .2s}

.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:44px;height:40px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-size:18px}
.stepper .val{flex:1;text-align:center;font-size:19px;font-variant-numeric:tabular-nums;font-weight:700}
.range{width:100%;margin:6px 0 2px;accent-color:var(--gold)}

.evt-ic{font-size:34px;text-align:center;margin-bottom:6px}
.fy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fy-grid .b{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px}
.fy-grid .b label{display:block;font-size:9.5px;color:var(--dim2);margin-bottom:2px}
.fy-grid .b b{font-size:15px;font-variant-numeric:tabular-nums}

@media(min-width:520px){
  #view{padding:14px 16px 22px}
  .hud-stats b{font-size:13.5px}
}

</style>
</head>
<body>

<div id="app" hidden>
  <header id="hud">
    <div class="hud-top">
      <div class="hud-id">
        <span id="hud-stage" class="stage-badge">街の貿易商</span>
        <span id="hud-company">—</span>
      </div>
      <div class="hud-date"><span id="hud-date">2026年4月</span></div>
    </div>
    <div class="hud-stats">
      <div class="stat"><label>現金</label><b id="hud-cash">—</b></div>
      <div class="stat"><label>純資産</label><b id="hud-equity">—</b></div>
      <div class="stat"><label>前月純利益</label><b id="hud-profit">—</b></div>
      <div class="stat"><label>格付</label><b id="hud-rating">—</b></div>
    </div>
    <div class="hud-mkt" id="hud-mkt"></div>
    <div class="hud-bar"><div id="hud-bar-fill"></div><span id="hud-bar-label"></span></div>
  </header>

  <main id="view"></main>

  <div id="turnbar">
    <div class="slots"><span id="slot-label">商談枠</span><div id="slot-dots"></div></div>
    <button id="btn-next" class="btn-next">▶ 翌月へ</button>
  </div>

  <nav id="tabs">
    <button data-tab="dash" class="on"><i>📊</i><span>経営</span></button>
    <button data-tab="market"><i>🤝</i><span>商談</span></button>
    <button data-tab="active"><i>📦</i><span>進行</span></button>
    <button data-tab="assets"><i>💼</i><span>投資</span></button>
    <button data-tab="biz"><i>🏭</i><span>事業</span></button>
    <button data-tab="admin"><i>🏢</i><span>本社</span></button>
    <button data-tab="rank"><i>🏆</i><span>順位</span></button>
  </nav>
</div>

<div id="modal-root" hidden>
  <div class="backdrop"></div>
  <div class="modal" id="modal-box"></div>
</div>

<div id="title">
  <div class="title-inner">
    <p class="tag">TURN-BASED TRADING HOUSE SIM</p>
    <h1>SOGO<br>SHOSHA</h1>
    <p class="sub">〜総合商社経営〜</p>
    <p class="lead">ラーメンから航空機まで。<br>一介の貿易商から、世界最大の総合商社へ。</p>
    <label class="field"><span>商社名</span>
      <input id="input-company" maxlength="12" placeholder="蒼龍商事" value="蒼龍商事">
    </label>
    <button id="btn-start" class="btn-primary">創業する</button>
    <button id="btn-continue" class="btn-ghost" hidden>続きから</button>
    <button id="btn-slots" class="btn-ghost">セーブデータ</button>
    <p class="credit">市況・為替・地政学リスクを読み、<br>トレード / 権益 / 事業投資で稼ぐターン制経営SLG</p>
  </div>
</div>

window.ENGINE = (function () {
  const D = window.GAME;
  const SAVE_KEY = 'sogoshosha.save.v1';

  /* ---------------- utils ---------------- */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function wpick(list, key) {
    let t = 0;
    for (const x of list) t += x[key];
    let r = Math.random() * t;
    for (const x of list) { r -= x[key]; if (r <= 0) return x; }
    return list[list.length - 1];
  }
  let _uid = 1;
  function uid() { return 'd' + (_uid++) + '_' + Math.floor(Math.random() * 1e6); }

  function money(v) {
    const a = Math.abs(v);
    const sg = v < 0 ? '-' : '';
    if (a >= 10000) return sg + (a / 10000).toFixed(a >= 100000 ? 1 : 2) + '兆';
    if (a >= 1000) return sg + Math.round(a).toLocaleString('ja-JP') + '億';
    if (a >= 10) return sg + a.toFixed(0) + '億';
    return sg + a.toFixed(1) + '億';
  }
  function signed(v) { return (v >= 0 ? '+' : '') + money(v); }
  function pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + '%'; }

  /* ---------------- state ---------------- */
  let S = null;

  function ratingScore() {
    const eq = Math.max(1, S.cash + bookAssets() - S.debt);
    const de = S.debt / eq;
    const roeS = clamp((S.roeTTM || 0) * 100 - 6, -12, 16);
    const deS = clamp((1.15 - de) * 13, -20, 10);
    return clamp(S.credit * 0.62 + roeS + deS + corpOf('esg') * 2.2 + 14, 0, 100);
  }
  function rating() {
    const sc = ratingScore();
    for (const r of D.RATINGS) if (sc >= r.min) return r;
    return D.RATINGS[D.RATINGS.length - 1];
  }
  function stage() { return D.STAGES[S.stage]; }
  function scale() { return stage().scale; }
  function fiscalYear() { return S.m >= 4 ? S.y + 1 : S.y; }
  function monthsInFY() { return S.m >= 4 ? S.m - 3 : S.m + 9; }
  function dateLabel(y, m) { return y + '年' + m + '月'; }
  function now() { return dateLabel(S.y, S.m); }

  function log(text, kind) {
    S.log.unshift({ t: S.y + '/' + ('0' + S.m).slice(-2), b: text, k: kind || '' });
    if (S.log.length > 160) S.log.length = 160;
  }

  /* 市況ファクター: 対象商品の指数平均 /100 */
  function mfac(comms) {
    if (!comms || !comms.length) return 1;
    let s = 0;
    for (const c of comms) s += S.mk[c];
    return (s / comms.length) / 100;
  }
  function fxFac() { return 0.72 + 0.28 * (S.fx / 145); }

  function newSeg() {
    const o = {};
    D.DIVISIONS.forEach(function (d) {
      o[d.id] = { gross: 0, dividend: 0, reval: 0, impair: 0, deals: 0, rev: 0, gtv: 0 };
    });
    return o;
  }
  function seg(divId) {
    if (!S.seg) S.seg = newSeg();
    if (!S.seg[divId]) S.seg[divId] = { gross: 0, dividend: 0, reval: 0, impair: 0, deals: 0, rev: 0, gtv: 0 };
    if (S.seg[divId].rev == null) { S.seg[divId].rev = 0; S.seg[divId].gtv = 0; }
    return S.seg[divId];
  }
  function segTotal(x) { return x.gross + x.dividend + x.reval + x.impair; }

  /* ---- 中期経営計画：重点戦略カードの効果 ---- */
  function planCards() { return (S.plan && S.plan.cards) || []; }
  function hasCard(id) { return planCards().indexOf(id) >= 0; }
  function fx(k, base) {
    let v = base;
    planCards().forEach(function (id) {
      const c = D.CARD_BY_ID[id];
      if (c && c.fx && c.fx[k] != null) v *= c.fx[k];
    });
    return v;
  }
  function fxAdd(k) {
    let v = 0;
    planCards().forEach(function (id) {
      const c = D.CARD_BY_ID[id];
      if (c && c.fx && c.fx[k] != null) v += c.fx[k];
    });
    return v;
  }
  function regionWin(regId) {
    let v = 0;
    planCards().forEach(function (id) {
      const c = D.CARD_BY_ID[id];
      if (!c || !c.prefRegions) return;
      v += c.prefRegions.indexOf(regId) >= 0 ? (c.prefWin || 0) : (c.otherWin || 0);
    });
    return v;
  }
  function regionSize(regId) {
    let v = 1;
    planCards().forEach(function (id) {
      const c = D.CARD_BY_ID[id];
      if (c && c.prefRegions && c.prefRegions.indexOf(regId) >= 0) v *= (c.prefSize || 1);
    });
    return v;
  }
  function divCardW(divId) {
    let v = 1;
    planCards().forEach(function (id) {
      const c = D.CARD_BY_ID[id];
      if (c && c.divBoost && c.divBoost[divId]) v *= c.divBoost[divId];
    });
    return v;
  }
  /* 投資額の累計（中計の投資目標に効く） */
  function countInvest(v) {
    if (v <= 0) return;
    if (S.plan) S.plan.cumInvest = (S.plan.cumInvest || 0) + v;
    S.cumInvest = (S.cumInvest || 0) + v;
  }

  /* ---- 組織形態 ---- */
  function org() { return D.ORG_BY_ID[S.org] || D.ORGS[1]; }
  function ofx(k, base) { const v = org().fx[k]; return v == null ? base : base * v; }
  function ofxAdd(k) { return org().fx[k] || 0; }
  function orgSwitchCost() { return Math.max(3, Math.max(0, equity()) * 0.035); }
  function canSwitchOrg(id) {
    const o = D.ORG_BY_ID[id];
    if (!o) return '組織形態が不正';
    if (id === S.org) return '既にその体制だ';
    if (S.stage < o.minStage) return D.STAGES[o.minStage].name + ' 以上でなければ移行できない';
    if (fiscalYear() - S.orgSwitchFY < 3) return '前回の移行から3年は経たないと現場がもたない';
    if (S.cash < orgSwitchCost()) return '移行コストが足りない（必要 ' + money(orgSwitchCost()) + '）';
    return null;
  }
  function switchOrg(id) {
    const err = canSwitchOrg(id);
    if (err) return { ok: false, msg: err };
    const c = orgSwitchCost();
    S.cash -= c; capex(c);
    S.org = id; S.orgSwitchFY = fiscalYear();
    S.morale = clamp(S.morale - 8, 0, 100);
    log('組織を' + D.ORG_BY_ID[id].name + 'へ移行した（移行費用 ' + money(c) + '）。現場は当面混乱する。', 'gold');
    save();
    return { ok: true };
  }
  /* カンパニー制の自律収益 */
  function autonomyIncome() {
    if (!ofxAdd('autonomy')) return 0;
    let v = 0;
    D.DIVISIONS.forEach(function (d) {
      const pt = divSalesPt(d.id);
      if (pt > 0) v += pt / 100 * scale() * 1.5 * (1 + boostOf(d.id) * 0.2);
    });
    return v;
  }

  function boostOf(id) { return ((S.boost && S.boost[id]) || 0) + (S.planBonus || 0) * 0.25; }
  function corpOf(id) { return (S.corp && S.corp[id]) || 0; }

  function divOf(id) { return S.div[id]; }
  function hasOffice(r) { return S.offices.indexOf(r) >= 0; }

  function manualActive() { return S.active.filter(function (a) { return !a.auto; }).length; }
  function capacity() { return Math.min(40, 4 + Math.floor(Math.sqrt(S.staff) * 1.2) + Math.floor(corpOf('hr') * 2.2) + fxAdd('cap')
      + Math.floor(hqPeople().reduce(function (a, p) { return a + p.lead / 100 * roleW(p); }, 0) * 1.1))
      * (org().fx.capMul || 1) | 0; }
  function slotsMax() {
    let ppl = 0;
    hqPeople().forEach(function (p) { ppl += roleW(p); });
    return clamp(2 + Math.floor(Math.sqrt(S.staff) / 6) + Math.floor(S.offices.length / 3)
      + Math.floor(corpOf('dx')) + fxAdd('slots') + ofxAdd('slots') + Math.floor(ppl / 1.9), 3, 14);
  }
  function borrowLimit() { return Math.max(0, equity() * fx('lev', rating().lev) - S.debt); }
  function interestRate() { return Math.max(0.004, S.rateBase + rating().spread - fxAdd('spread') - traitBest('spread')); }

  function bookAssets() {
    let v = 0;
    for (const a of S.assets) v += a.value;
    for (const a of S.active) {
      if (a.type === 'trade') v += a.capital;
      else if (a.type === 'project') v += a.wip - a.adv;
    }
    return v;
  }
  function equity() { return S.cash + bookAssets() - S.debt; }
  function eqAfterRaw() { return Math.max(1, equity()); }

  /* ---------------- new game ---------------- */
  function newGame(name) {
    _uid = 1;
    S = {
      company: (name || '蒼龍商事').slice(0, 12),
      y: 2026, m: 4, turn: 0,
      stage: 0,
      cash: 75, debt: 0,
      staff: 14, wageInfl: 0, payBand: 2, gradPolicy: 1,
      credit: 42,
      offices: ['jp'],
      div: {}, mk: {}, mkPrev: {},
      fx: 148, fxPrev: 148, rateBase: 0.022,
      market: [], active: [], assets: [],
      slots: 3,
      log: [], monthly: [],
      fy: { profit: 0, startEquity: 75, deals: 0, wage: 0, sga: 0, interest: 0, gain: 0,
            revenue: 0, cost: 0, gtv: 0 },
      mRev: 0, mCost: 0, mGTV: 0,
      fyHistory: [],
      rivals: D.RIVALS.map(function (r) { return { name: r.name, eq: r.base, g: r.g }; }),
      mod: { impair: 1, creditRisk: 1, delay: 1 },
      stats: { won: 0, lost: 0, done: 0, impair: 0, defaults: 0, cumProfit: 0 },
      lastProfit: 0, lastCapex: 0, lastLedger: null,
      pend: { capex: 0, gain: 0 },
      seg: {}, segPrev: null,
      budget: {}, boost: {}, corp: { dx: 0, hr: 0, esg: 0 },
      shares: 0.30, pbr: 0.85, trust: 52, roeTTM: 0, pbrPrev: 0.85,
      plan: null, planNo: 0, planHistory: [], cumInvest: 0, planBonus: 0,
      people: [], gradQueue: [], morale: 62, peopleNews: [], hunted: 0,
      ma: [], maStats: { done: 0, pmiOk: 0, pmiNg: 0, exits: 0 }, tobCooldown: 0,
      universe: [], auto: { on: true, limit: 1, stance: 1 }, autoLog: null,
      autoStats: { bid: 0, won: 0, profit: 0 },
      org: 'div', orgSwitchFY: 0, gov: 72, scandals: 0, ceoFY: 2027, ceoTerms: 0,
      over: false, cleared: false, insolvent: 0,
      pendingEvent: null,
    };
    D.DIVISIONS.forEach(function (d, i) { S.div[d.id] = { lv: i < 2 ? 2 : 1, exp: 0 }; S.boost[d.id] = 0; });
    S.seg = newSeg();
    buildUniverse();
    D.COMM_KEYS.forEach(function (k) { S.mk[k] = 100 + randn() * 6; S.mkPrev[k] = S.mk[k]; });
    // 創業メンバー3名
    ['energy', 'metals', 'food'].forEach(function (dv, i) {
      const p = genPerson({ tier: 'founder', div: dv });
      p.role = i === 0 ? 3 : 1;
      S.people.push(p);
    });
    S.slots = slotsMax();
    for (let i = 0; i < 6; i++) S.market.push(genDeal());
    log('創業。東京に本社を構えた。', 'gold');
    return S;
  }

  /* ---------------- 人材 ---------------- */
  function genPerson(o) {
    o = o || {};
    const female = Math.random() < 0.32;
    const name = pick(D.SURNAMES) + ' ' + pick(female ? D.GIVEN_F : D.GIVEN_M);
    const tier = o.tier || 'career';
    let age, lo, hi;
    if (tier === 'grad') { age = ri(27, 31); lo = 18; hi = 42; }
    else if (tier === 'hunt') { age = ri(38, 52); lo = 58; hi = 92; }
    else if (tier === 'founder') { age = ri(33, 44); lo = 34; hi = 58; }
    else { age = ri(31, 46); lo = 34; hi = 70; }
    const q = o.q || 1;
    function ab() { return Math.round(clamp(rnd(lo, hi) * q, 5, 99)); }
    const traitPool = tier === 'grad'
      ? D.TRAITS.map(function (t) { return { t: t, w: t.id === 'none' ? 70 : t.w * 0.5 }; })
      : D.TRAITS.map(function (t) { return { t: t, w: t.id === 'none' ? (tier === 'hunt' ? 6 : 24) : t.w }; });
    return {
      id: uid(), name: name, face: pick(female ? D.FACES_F : D.FACES_M), female: female,
      age: age, tone: pick(D.TONES).id,
      div: o.div || pick(D.DIVISIONS).id, region: null, role: 0,
      sales: ab(), eye: ab(), lead: ab(),
      trait: wpick(traitPool, 'w').t.id,
      joinFY: S ? fiscalYear() : 2026, promoFY: S ? fiscalYear() : 2026,
    };
  }
  function toneOf(p) { return D.TONES.filter(function (t) { return t.id === p.tone; })[0] || D.TONES[0]; }
  function traitOf(p) { return D.TRAIT_BY_ID[p.trait] || D.TRAIT_BY_ID.none; }
  function roleW(p) { return D.ROLE_W[p.role] || 0.45; }
  function personPower(p) { return (p.sales + p.eye + p.lead) / 3; }
  /* ---- 給与体系（万円/年で定義し、億円/月に換算して計上する） ---- */
  function payBand() { return D.PAY_BANDS[S.payBand] || D.PAY_BANDS[2]; }
  function sizeFactor() { return 1 + Math.log10(Math.max(1, scale())) * 0.32; }
  function salaryOf(p) {
    return Math.round(D.ROLE_SALARY[p.role] * payBand().k * sizeFactor()
      * (0.85 + personPower(p) / 330) / 10) * 10;
  }
  function avgStaffSalary() {
    return Math.round(D.BASE_SALARY * payBand().k * sizeFactor() * (1 + (S.wageInfl || 0)) / 10) * 10;
  }
  function setPayBand(i) {
    i = clamp(Math.round(i), 0, D.PAY_BANDS.length - 1);
    if (i === S.payBand) return { ok: false, msg: '同じ水準だ' };
    const up = i > S.payBand;
    S.payBand = i;
    S.morale = clamp(S.morale + (up ? 4 : -6), 0, 100);
    log('給与水準を「' + payBand().n + '」に改定した（一般社員の平均年収 ' + avgStaffSalary().toLocaleString('ja-JP') + '万円）。',
      up ? 'gold' : 'down');
    save();
    return { ok: true };
  }
  function personCost(p) { return salaryOf(p) / 10000 / 12; }
  function staffCost() { return S.staff * avgStaffSalary() / 10000 / 12; }
  function rosterCost() { let c = 0; S.people.forEach(function (p) { c += personCost(p); }); return c; }
  function rosterMax() { return 24; }
  /* 出向中の幹部は本社の戦力から外れる */
  function hqPeople() { return S.people.filter(function (p) { return !p.second; }); }
  function divPeople(divId) {
    return S.people.filter(function (p) { return p.div === divId && !p.second; });
  }
  function seconded() { return S.people.filter(function (p) { return !!p.second; }); }
  function divHead(divId) {
    return S.people.filter(function (p) { return p.div === divId && p.role >= 3; })
      .sort(function (a, b) { return b.lead - a.lead; })[0] || null;
  }
  /* 特性の最大値（同じ特性が複数いても効果は重ねない） */
  function traitBest(key) {
    let v = 0;
    S.people.forEach(function (p) {
      const t = traitOf(p);
      if (t[key] != null && t[key] > v) v = t[key];
    });
    return v;
  }
  function traitMin(key, base) {
    let v = base;
    S.people.forEach(function (p) {
      const t = traitOf(p);
      if (t[key] != null && t[key] < v) v = t[key];
    });
    return v;
  }
  function hasTrait(id) { return S.people.some(function (p) { return p.trait === id; }); }

  /* 本部の営業力（落札力に効く） */
  function divSalesPt(divId) {
    const ps = divPeople(divId);
    if (!ps.length) return -9;           // 人がいない本部はまともに戦えない
    let v = 0;
    ps.forEach(function (p) { v += p.sales / 100 * roleW(p); });
    return Math.min(34, v * 9) + (divHead(divId) ? 0 : -5);
  }
  function divLeadPt(divId) {
    let v = 0;
    divPeople(divId).forEach(function (p) { v += p.lead / 100 * roleW(p); });
    return v;
  }
  function eyePt() {
    let v = 0;
    hqPeople().forEach(function (p) { v += p.eye / 100 * roleW(p); });
    return v;
  }
  /* 案件ごとの人材ボーナス */
  function peopleWin(d) {
    let v = divSalesPt(d.div);
    S.people.forEach(function (p) {
      const t = traitOf(p);
      if (t.region && t.region === d.region && p.div === d.div) v += t.win;
      if (t.bigWin && d.big && p.div === d.div) v += t.bigWin;
      if (p.region && p.region === d.region) v += 6;
    });
    return v;
  }
  function divTraitMargin(divId) {
    let v = 0;
    divPeople(divId).forEach(function (p) {
      const t = traitOf(p);
      if (t.div === divId && t.margin) v = Math.max(v, t.margin);
    });
    return v;
  }
  /* 幹部の厚みは実現利益そのものを動かす（−25%〜+35%） */
  function divExec(divId) {
    return 1 + clamp(divSalesPt(divId) / 100, -0.25, 0.35);
  }
  function divSniff(divId) {
    let v = 1;
    divPeople(divId).forEach(function (p) { if (traitOf(p).sniff) v = Math.max(v, traitOf(p).sniff); });
    return v;
  }

  /* ---- 収益・費用・取扱高 ---- */
  function addRev(amount, gtv, divId) {
    if (amount) { S.fy.revenue += amount; S.mRev += amount; if (divId) seg(divId).rev += amount; }
    if (gtv) { S.fy.gtv += gtv; S.mGTV += gtv; if (divId) seg(divId).gtv += gtv; }
  }
  function addCost(amount) { if (amount > 0) { S.fy.cost += amount; S.mCost += amount; } }
  function signRev(v, divId) { if (v >= 0) addRev(v, 0, divId); else addCost(-v); }

  function pnews(text, kind, face) {
    S.peopleNews.unshift({ t: S.y + '/' + ('0' + S.m).slice(-2), b: text, k: kind || '', f: face || '' });
    if (S.peopleNews.length > 60) S.peopleNews.length = 60;
    log(text, kind);
  }

  /* ---- 配属・任命・駐在・昇進 ---- */
  function findPerson(id) { return S.people.filter(function (p) { return p.id === id; })[0]; }
  function assignDiv(id, divId) {
    const p = findPerson(id); if (!p) return { ok: false, msg: '見つからない' };
    p.div = divId; p.region = null;
    log(p.name + ' を ' + D.DIV_BY_ID[divId].name + ' に配属した。', '');
    save(); return { ok: true };
  }
  function appointHead(id) {
    const p = findPerson(id); if (!p) return { ok: false, msg: '見つからない' };
    if (p.role >= 3) return { ok: false, msg: '既に本部長級' };
    S.people.forEach(function (q) { if (q.div === p.div && q.role === 3) q.role = 2; });
    p.role = 3; p.promoFY = fiscalYear();
    pnews(p.name + ' を ' + D.DIV_BY_ID[p.div].name + ' の本部長に任命した。「' + toneOf(p).promo + '」', 'gold', p.face);
    save(); return { ok: true };
  }
  function dispatchTo(id, regId) {
    const p = findPerson(id); if (!p) return { ok: false, msg: '見つからない' };
    if (regId && !hasOffice(regId)) return { ok: false, msg: 'その地域に拠点がない' };
    p.region = regId || null;
    if (regId) log(p.name + ' を ' + D.REGION_BY_ID[regId].name + ' に駐在させた。', '');
    else log(p.name + ' を本社に呼び戻した。', '');
    save(); return { ok: true };
  }
  function promotePerson(id) {
    const p = findPerson(id); if (!p) return { ok: false, msg: '見つからない' };
    if (p.role >= 4) return { ok: false, msg: 'これ以上の役職はない' };
    p.role++; p.promoFY = fiscalYear();
    S.morale = clamp(S.morale + 1.5, 0, 100);
    pnews(p.name + ' が ' + D.ROLES[p.role] + ' に昇進。「' + toneOf(p).promo + '」', 'gold', p.face);
    save(); return { ok: true };
  }
  function promoteSlots() { return 1 + Math.floor(S.staff / 220); }

  /* ---- 採用 ---- */
  function gradPolicy() { return D.GRAD_POLICIES[S.gradPolicy] || D.GRAD_POLICIES[1]; }
  function setGradPolicy(i) { S.gradPolicy = clamp(Math.round(i), 0, D.GRAD_POLICIES.length - 1); }
  /* 採用計画人数（step 0〜3） */
  function gradPlan(step) { return Math.round(hireBlock() * step * gradPolicy().size); }
  function gradCost(n) { return n * 0.014 * Math.pow(scale(), 0.42) * gradPolicy().cost; }
  /* 内定承諾率: 給与水準・士気・信用で決まる */
  function gradAccept() {
    return clamp(0.70 + payBand().hire * 1.3 + S.morale / 500 + S.credit / 500, 0.42, 1.0);
  }
  function gradYield(n, pol) {
    const per = Math.max(4, hireBlock()) / (pol || gradPolicy()).ratio;
    return Math.min(5, Math.floor(n / per));
  }
  function hireGrads(n) {
    if (n <= 0) { pnews('今年度の新卒採用は見送った。', 'down', '🌱'); save(); return { ok: true, n: 0 }; }
    const c = gradCost(n);
    if (S.cash < c) return { ok: false, msg: '採用費が足りない' };
    const acc = gradAccept();
    const actual = Math.max(1, Math.round(n * acc));
    S.cash -= c; capex(c);
    S.staff += actual;
    S.gradQueue.push({ fy: fiscalYear() + 4, n: actual, pol: S.gradPolicy });
    const pol = gradPolicy();
    pnews('新卒 ' + actual.toLocaleString('ja-JP') + '名を採用（' + pol.name + '・内定承諾率 ' + pct(acc, 0) + '）。'
      + '幹部候補として立つのは4年後、およそ ' + gradYield(actual, pol) + '名。', '', pol.icon);
    save();
    return { ok: true, n: actual, planned: n, cost: c, accept: acc };
  }
  function careerCost() { return 1.2 * Math.pow(scale(), 0.5) + 0.6; }
  function careerCandidates() {
    const bq = 1 + payBand().hire * 0.6;
    return [0, 1, 2].map(function () { return genPerson({ tier: 'career', q: rnd(0.85, 1.12) * bq }); });
  }
  function hireCareer(p) {
    const c = careerCost();
    if (S.people.length >= rosterMax()) return { ok: false, msg: '幹部の枠がいっぱいだ（' + rosterMax() + '名）' };
    if (S.cash < c) return { ok: false, msg: '採用コストが足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c);
    p.joinFY = fiscalYear(); p.promoFY = fiscalYear();
    S.people.push(p);
    pnews(p.name + '（' + p.age + '）がキャリア採用で入社。「' + toneOf(p).join + '」', 'up', p.face);
    save(); return { ok: true };
  }
  function huntCost() { return 5.5 * Math.pow(scale(), 0.5) + 2; }
  function headhunt() {
    const c = huntCost();
    if (S.people.length >= rosterMax()) return { ok: false, msg: '幹部の枠がいっぱいだ（' + rosterMax() + '名）' };
    if (S.cash < c) return { ok: false, msg: '資金が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c);
    const prob = clamp(0.42 + S.credit * 0.004 + S.morale * 0.002 + payBand().hire, 0.15, 0.94);
    if (Math.random() > prob) {
      S.credit = clamp(S.credit - 2, 0, 100);
      pnews('ヘッドハントは不調に終わった。業界に話が漏れ、体裁が悪い。', 'down', '🎯');
      save(); return { ok: true, won: false, prob: prob };
    }
    const p = genPerson({ tier: 'hunt', q: rnd(1.0, 1.15) });
    p.joinFY = fiscalYear(); p.promoFY = fiscalYear(); p.role = 2;
    S.people.push(p);
    pnews(pick(S.rivals).name + ' の ' + p.name + '（' + p.age + '）を引き抜いた。「' + toneOf(p).join + '」', 'gold', p.face);
    save(); return { ok: true, won: true, person: p, prob: prob };
  }

  /* ---- 月次：士気と離職 ---- */
  function stepPeople() {
    const tgt = 45 + clamp((S.roeTTM || 0) * 100, -22, 22) + (S.trust - 50) * 0.2
      + corpOf('hr') * 3 + (hasTrait('charmer') ? 4 : 0) + payBand().morale;
    S.morale = clamp(S.morale + (clamp(tgt, 5, 95) - S.morale) * 0.12, 0, 100);

    const retain = clamp(1 - Math.min(0.5, traitBest('retain')) - payBand().retain, 0.32, 1.85);
    for (let i = S.people.length - 1; i >= 0; i--) {
      const p = S.people[i];
      const stale = Math.max(0, fiscalYear() - p.promoFY);
      let f = 0.004 * (1 + (65 - S.morale) / 45) * (1 + stale * 0.07)
        * (1 + personPower(p) / 260) * retain;
      if (p.role >= 3) f *= 0.7;
      if (Math.random() < clamp(f, 0, 0.06)) {
        if (p.second) { const b = assetById(p.second.assetId); if (b) clearPost(b, p.second.post); }
        S.people.splice(i, 1);
        pnews(p.name + '（' + D.ROLES[p.role] + '）が退職。「' + toneOf(p).leave + '」', 'down', p.face);
        S.morale = clamp(S.morale - 2.5, 0, 100);
      }
    }
  }

  /* ---- 年次：成長・定年・新卒パイプライン ---- */
  function annualPeople() {
    const out = { retired: [], graduated: [], grown: 0 };
    const g = 1 + corpOf('hr') * 0.16 + fxAdd('hrYear');
    for (let i = S.people.length - 1; i >= 0; i--) {
      const p = S.people[i];
      p.age++;
      if (p.age >= 63) {
        if (p.second) { const b = assetById(p.second.assetId); if (b) clearPost(b, p.second.post); }
        S.people.splice(i, 1);
        out.retired.push(p);
        pnews(p.name + '（' + p.age + '・' + D.ROLES[p.role] + '）が退任。長い勤めだった。', 'info', p.face);
        continue;
      }
      const af = p.age < 32 ? 1.7 : p.age < 40 ? 1.2 : p.age < 50 ? 0.7 : 0.28;
      const boost = p.second ? 1.5 : p.region ? 1.35 : 1;
      const inc = function (v) { return Math.round(clamp(v + g * af * rnd(1.2, 3.4) * boost, 1, 99)); };
      p.sales = inc(p.sales); p.eye = inc(p.eye); p.lead = inc(p.lead);
      out.grown++;
    }
    const fy = fiscalYear();
    for (let i = S.gradQueue.length - 1; i >= 0; i--) {
      const q = S.gradQueue[i];
      if (q.fy > fy) continue;
      const pol = D.GRAD_POLICIES[q.pol == null ? 1 : q.pol] || D.GRAD_POLICIES[1];
      const n = gradYield(q.n, pol);
      for (let k = 0; k < n && S.people.length < rosterMax(); k++) {
        const p = genPerson({ tier: 'grad', q: rnd(0.9, 1.15) * pol.q });
        if (pol.global) {
          const ov = S.offices.filter(function (r) { return r !== 'jp'; });
          if (ov.length) {
            p.region = pick(ov);
            const rt = D.TRAITS.filter(function (t) { return t.region === p.region; })[0];
            if (rt && Math.random() < 0.5) p.trait = rt.id;
          }
        }
        p.joinFY = fy; p.promoFY = fy;
        S.people.push(p);
        out.graduated.push(p);
        pnews(p.name + '（' + p.age + '）が幹部候補として頭角を現した。「' + toneOf(p).join + '」', 'up', p.face);
      }
      S.gradQueue.splice(i, 1);
    }
    return out;
  }

  /* ---------------- 企業ユニバース ----------------
     世界の会社は入れ替わらない。ゲーム開始時に生成され、以後は業績が動き、
     売却意向が立ったり消えたり、他社に買われたりする。 */
  function buildUniverse() {
    const used = {};
    S.universe = [];
    D.SECTORS.forEach(function (sec) {
      D.COMPANY_SIZES.forEach(function (base, tier) {
        let name, guard = 0;
        do { name = pick(D.MA_PREFIX) + pick(D.MA_BIZ[sec.id]); } while (used[name] && guard++ < 30);
        used[name] = 1;
        const na = base * rnd(0.6, 1.7);
        S.universe.push({
          id: uid(), name: name, div: sec.id, tier: tier,
          region: Math.random() < 0.42 ? 'jp' : pick(D.REGIONS).id,
          listed: tier >= 3 ? Math.random() < 0.8 : Math.random() < 0.3,
          netAssets: na,
          yieldRate: rnd(0.030, 0.160),
          growth: rnd(-0.0025, 0.0105),
          hidden: Math.random() < 0.34 ? na * rnd(0.05, 0.28) : 0,
          shownMul: rnd(0.75, 1.45),
          owner: null, forSale: false, reason: null, saleLeft: 0,
          dd: false, rivals: 0, cool: 0,
        });
      });
    });
  }
  function universeList() { return S.universe || []; }
  function findTarget(id) { return (S.universe || []).filter(function (t) { return t.id === id; })[0]; }
  function trueProfitOf(t) { return t.netAssets * t.yieldRate; }
  function shownProfitOf(t) { return trueProfitOf(t) * t.shownMul; }

  /* 毎月：業績が動き、売却意向が立ち消えし、他社が買っていく */
  function stepUniverse() {
    const boom = (S.mk.crude + S.mk.iron + S.mk.copper + S.mk.grain) / 400;
    (S.universe || []).forEach(function (t) {
      if (t.cool > 0) t.cool--;
      const sec = D.DIV_BY_ID[t.div];
      const mf = sec ? mfac(sec.comms) : 1;
      t.netAssets = Math.max(5, t.netAssets * (1 + t.growth + randn() * 0.012 + (mf - 1) * 0.004));
      t.yieldRate = clamp(t.yieldRate + randn() * 0.0035 + (0.075 - t.yieldRate) * 0.01, -0.03, 0.24);

      if (t.owner === 'me') return;
      if (t.forSale) {
        t.saleLeft--;
        if (t.owner == null && Math.random() < 0.020 * (0.6 + boom)) {
          t.owner = pick(S.rivals).name;
          t.forSale = false; t.reason = null;
          log('【M&A】' + t.owner + ' が「' + t.name + '」を買収した。', 'down');
          return;
        }
        if (t.saleLeft <= 0) { t.forSale = false; t.reason = null; }
      } else if (t.owner == null && t.cool <= 0) {
        const p = 0.006 + (t.yieldRate < 0.045 ? 0.010 : 0) + (t.growth < 0 ? 0.008 : 0);
        if (Math.random() < p) {
          t.forSale = true; t.reason = pick(D.SALE_REASONS).t; t.saleLeft = ri(4, 14);
          t.rivals = ri(0, 3); t.cool = 24;
        }
      }
    });
  }
  function releaseCompany(id, toRival) {
    const t = findTarget(id);
    if (!t) return;
    t.owner = toRival || null;
    t.forSale = false; t.reason = null; t.cool = 18; t.dd = false;
  }

  function ddCost(t) { return t.netAssets * 0.022 * (1 - Math.min(0.5, eyePt() * 0.07)); }
  /* 売却意向がない会社への打診は割高で、しかも通りにくい */
  function unsolicited(t) { return !t.forSale; }
  function runDD(id) {
    const t = findTarget(id);
    if (!t) return { ok: false, msg: '見つからない' };
    if (t.dd) return { ok: false, msg: '実施済み' };
    const c = ddCost(t);
    if (S.cash < c) return { ok: false, msg: 'DD費用が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c);
    t.dd = true;
    log('「' + t.name + '」のデューデリジェンスを実施（' + money(c) + '）。', '');
    save();
    return { ok: true, cost: c };
  }

  function maPrice(t, oi) { return t.netAssets * D.MA_OFFERS[oi].k * (unsolicited(t) ? 1.25 : 1); }
  function maWin(t, oi) {
    let s = 52 + D.MA_OFFERS[oi].win;
    s -= t.rivals * 9;
    s += rating().win + S.credit * 0.10;
    s += divSalesPt(t.div) * 0.3;
    s += t.listed ? -8 : 0;
    if (unsolicited(t)) s -= 26;
    return clamp(s, 3, 96) / 100;
  }
  function maCheck(t, oi) {
    if (t.owner === 'me') return '既に当社の傘下だ';
    if (t.owner) return t.owner + ' の傘下にある';
    const p = maPrice(t, oi);
    if (p > S.cash) return '手元資金が不足（必要 ' + money(p) + ' / 現金 ' + money(S.cash) + '）';
    if (p > Math.max(1, equity()) * 0.55 + borrowLimit() * 0.35) return '会社の体力に対して大きすぎる買収だ';
    return null;
  }
  function acquire(id, oi) {
    const t = findTarget(id);
    if (!t) return { ok: false, msg: '見つからない' };
    const err = maCheck(t, oi);
    if (err) return { ok: false, msg: err };
    const price = maPrice(t, oi);
    const p = maWin(t, oi);
    if (Math.random() > p) {
      t.cool = ri(6, 14);
      log('「' + t.name + '」の買収提案は実らなかった。', 'down');
      return { ok: true, won: false, prob: p, target: t };
    }
    S.cash -= price; countInvest(price);
    const goodwill = price - t.netAssets;
    // DDを省くと簿外債務をそのまま掴む
    const surprise = t.dd ? 0 : t.hidden;
    const dvm = D.DIV_BY_ID[t.div];
    t.owner = 'me'; t.forSale = false; t.reason = null;
    S.assets.push({
      id: t.id, type: 'company', name: t.name, div: t.div, region: t.region,
      comms: dvm.comms.slice(),
      basis: price, value: price - surprise,
      sales: t.netAssets * rnd(1.4, 3.2),
      goodwill: goodwill, netAssets: t.netAssets,
      profitBase: trueProfitOf(t) / 12, growth: Math.max(0.0015, t.growth + 0.003),
      yieldRate: trueProfitOf(t) / 12 / Math.max(1, price),
      posts: {},
      pmiLeft: 12, pmiLeader: null, pmiDone: false, synergy: 0, ddDone: t.dd,
      age: 0, cum: 0, impaired: 0, life: 0,
    });
    S.maStats.done++;
    S.credit = clamp(S.credit + 1.5, 0, 100);
    log('「' + t.name + '」を ' + money(price) + ' で買収（のれん ' + money(goodwill) + '）。', 'gold');
    if (surprise > 0) {
      S.pend.gain -= surprise;
      log('DDを省いたツケで、' + money(surprise) + ' の簿外債務が発覚した。', 'down');
      S.credit = clamp(S.credit - 4, 0, 100);
    }
    save();
    return { ok: true, won: true, prob: p, target: t, price: price, goodwill: goodwill, surprise: surprise };
  }

  /* ---------------- 出向 ----------------
     傘下企業の社長・CFO・営業責任者に幹部を送り込む。
     送った人材は本社の戦力から抜けるが、事業会社の成長と安全性を直接押し上げる。 */
  function assetById(id) { return S.assets.filter(function (a) { return a.id === id; })[0]; }
  function postHolder(a, post) {
    const id = a.posts && a.posts[post];
    return id ? findPerson(id) : null;
  }
  function postAbility(a, post) {
    const p = postHolder(a, post);
    if (!p) return 0;
    return p[D.POST_BY_ID[post].ab] || 0;
  }
  function clearPost(a, post) {
    if (!a.posts || !a.posts[post]) return;
    const q = findPerson(a.posts[post]);
    if (q) q.second = null;
    delete a.posts[post];
  }
  function secondTo(assetId, post, personId) {
    const a = assetById(assetId);
    const p = findPerson(personId);
    if (!a || a.type !== 'company') return { ok: false, msg: '傘下の事業会社ではない' };
    if (!p) return { ok: false, msg: '見つからない' };
    if (!D.POST_BY_ID[post]) return { ok: false, msg: '役職が不正' };
    a.posts = a.posts || {};
    clearPost(a, post);
    if (p.second) {
      const b = assetById(p.second.assetId);
      if (b) clearPost(b, p.second.post);
    }
    a.posts[post] = p.id;
    p.second = { assetId: assetId, post: post };
    p.region = null;
    pnews(p.name + ' を「' + a.name + '」の' + D.POST_BY_ID[post].name + 'として出向させた。', 'gold', p.face);
    save();
    return { ok: true };
  }
  function recallPerson(personId) {
    const p = findPerson(personId);
    if (!p || !p.second) return { ok: false, msg: '出向していない' };
    const a = assetById(p.second.assetId);
    if (a) clearPost(a, p.second.post);
    p.second = null;
    pnews(p.name + ' を本社に呼び戻した。', '', p.face);
    save();
    return { ok: true };
  }
  function secondBonus(a) {
    return {
      lead: postAbility(a, 'ceo'),
      eye: postAbility(a, 'cfo'),
      sales: postAbility(a, 'sales'),
    };
  }

  function setPMILeader(assetId, personId) {
    const a = S.assets.filter(function (x) { return x.id === assetId; })[0];
    if (!a || a.type !== 'company') return { ok: false, msg: '見つからない' };
    S.assets.forEach(function (x) { if (x.pmiLeader === personId && x.id !== assetId) x.pmiLeader = null; });
    a.pmiLeader = personId || null;
    const p = personId ? findPerson(personId) : null;
    if (p) pnews(p.name + ' を「' + a.name + '」の統合責任者に指名した。', 'gold', p.face);
    save();
    return { ok: true };
  }
  function pmiChance(a) {
    const p = a.pmiLeader ? findPerson(a.pmiLeader) : null;
    let c = 0.30;
    if (p) c += p.lead / 220 + (traitOf(p).pmi || 0);
    c += secondBonus(a).lead / 260;
    if (a.ddDone) c += 0.12;
    c += corpOf('hr') * 0.03 + S.morale * 0.0015;
    c -= Math.min(0.25, a.goodwill / Math.max(1, a.netAssets) * 0.25);
    return clamp(c, 0.05, 0.95);
  }
  function divSynergy(divId) {
    let v = 0;
    S.assets.forEach(function (a) {
      if (a.type === 'company' && a.div === divId) v += a.synergy + postAbility(a, 'sales') / 300;
    });
    return Math.min(0.30, v * 0.09) * (org().fx.synergy || 1);
  }
  function exitCompany(id) {
    const i = S.assets.findIndex(function (a) { return a.id === id; });
    if (i < 0) return { ok: false, msg: '見つからない' };
    const a = S.assets[i];
    if (!a.pmiDone) return { ok: false, msg: '統合が終わっていない会社は売れない' };
    const mult = 1 + a.synergy * 0.22 + a.age * 0.0022;
    const proceeds = a.value * clamp(mult, 0.7, 1.9) * rnd(0.93, 1.08);
    S.cash += proceeds;
    D.POSTS.forEach(function (ps) { clearPost(a, ps.id); });
    S.assets.splice(i, 1);
    releaseCompany(a.id, Math.random() < 0.5 ? pick(S.rivals).name : null);
    S.pend.gain += proceeds - a.value;
    S.maStats.exits++;
    log('「' + a.name + '」を ' + money(proceeds) + ' で売却（取得原価比 ' + signed(proceeds - a.basis) + '）。', proceeds >= a.basis ? 'up' : 'down');
    save();
    return { ok: true, proceeds: proceeds };
  }

  /* ---------------- deal generation ---------------- */
  function typeWeights() {
    const s = S.stage;
    let b;
    if (s === 0) b = [76, 12, 9, 3];
    else if (s === 1) b = [62, 16, 14, 8];
    else if (s === 2) b = [50, 18, 18, 14];
    else b = [40, 18, 22, 20];
    return [
      { t: 'trade', w: b[0] * fx('tradeW', 1) },
      { t: 'project', w: b[1] },
      { t: 'investment', w: b[2] * fx('invW', 1) },
      { t: 'concession', w: b[3] * fx('concW', 1) },
    ];
  }

  function genDeal(big) {
    const sc = scale();
    const type = wpick(typeWeights(), 'w').t;
    const dv = wpick(D.DIVISIONS.map(function (x) {
      return { d: x, w: (1 + boostOf(x.id) * 0.7) * divCardW(x.id) * divSniff(x.id) };
    }), 'w').d;
    // 拠点のある地域が出やすい
    let reg;
    if (Math.random() < 0.45 && S.offices.length) reg = pick(S.offices);
    else reg = pick(D.REGIONS).id;
    const item = pick(D.ITEMS[type][dv.id]);
    const tier = big ? D.TIER_BY_ID.mega : wpick(D.DEAL_TIERS, 'w');
    const sm = tier.kn * (big ? rnd(1.1, 1.6) : rnd(0.8, 1.28)) * (1 + boostOf(dv.id) * 0.20)
      * fx('sizeAll', 1) * regionSize(reg);
    const rg = D.REGION_BY_ID[reg];

    const d = {
      id: uid(), type: type, div: dv.id, region: reg, big: !!big, tier: tier.id,
      name: rg.name + '／' + item,
      comms: dv.comms.slice(),
      ttl: ri(2, 5),
      rivals: ri(1, 5) + fxAdd('rivals'),
      diff: rnd(0.45, 1.45) + (type === 'concession' ? 0.25 : 0) + (big ? 0.35 : 0),
    };

    if (type === 'trade') {
      d.volume = sc * rnd(30, 110) * sm;
      d.marginRate = rnd(0.025, 0.075) * (1 + boostOf(dv.id) * 0.10) * fx('margin', 1) * (1 + divTraitMargin(dv.id) + divSynergy(dv.id));
      d.months = ri(1, 4);
      d.capital = d.volume * rnd(0.16, 0.30);
      d.risk = rnd(0.006, 0.042);
      d.upfront = d.capital;
      d.exposure = d.capital;
    } else if (type === 'project') {
      d.contract = sc * rnd(48, 200) * sm;
      d.marginRate = rnd(0.05, 0.17) * (1 + boostOf(dv.id) * 0.10) * (1 + divTraitMargin(dv.id) + divSynergy(dv.id));
      d.months = ri(6, 20);
      d.adv = d.contract * rnd(0.12, 0.25);
      d.cost = d.contract * (1 - d.marginRate);
      d.upfront = 0;
      d.exposure = d.cost * 0.45;
      d.risk = rnd(0.02, 0.07);
    } else if (type === 'concession') {
      d.invest = sc * rnd(60, 270) * sm;
      d.yieldRate = rnd(0.0095, 0.021) * (1 + boostOf(dv.id) * 0.08) * fx('concYield', 1)
        * (dv.id === 'energy' ? fx('fossilYield', 1) : 1);
      d.life = ri(48, 140);
      d.upfront = d.invest;
      d.exposure = d.invest;
      d.risk = rnd(0.03, 0.09);
    } else {
      d.invest = sc * rnd(38, 200) * sm;
      d.yieldRate = rnd(0.0062, 0.0128) * (1 + boostOf(dv.id) * 0.08);
      d.growth = rnd(0.0022, 0.0068) * fx('margin', 1);
      d.upfront = d.invest;
      d.exposure = d.invest;
      d.risk = rnd(0.005, 0.02);
    }
    return d;
  }

  function refreshMarket() {
    for (let i = S.market.length - 1; i >= 0; i--) {
      S.market[i].ttl--;
      if (S.market[i].ttl <= 0) S.market.splice(i, 1);
    }
    const target = 11 + Math.min(5, S.offices.length - 1) + Math.min(4, S.stage);
    while (S.market.length < target) S.market.push(genDeal());
    if (Math.random() < fxAdd('bigChance')) S.market.push(genDeal(true));
  }

  /* ---------------- bidding ---------------- */
  function winScore(d, stanceIdx) {
    const st = D.STANCES[stanceIdx];
    let s = 46;
    s += divOf(d.div).lv * 4.2;
    s += boostOf(d.div) * 8;
    s += regionWin(d.region);
    s += peopleWin(d);
    s += divSynergy(d.div) * 40;
    s += (S.morale - 60) * 0.16;
    s += rating().win;
    s += S.credit * 0.13;
    s += hasOffice(d.region) ? 10 : 0;
    s -= d.rivals * 4.6;
    s -= d.diff * 12;
    s += st.win < 0 ? st.win * (1 - traitBest('stance')) : st.win;
    // 与信・規模の余裕
    const room = (equity() + borrowLimit());
    const need = d.exposure;
    if (room > 0) s += clamp(6 * (1 - need / room), -14, 6);
    return clamp(s, 4, 93) / 100;
  }

  function bidCheck(d, auto) {
    if (!auto && S.slots <= 0) return '今月の商談枠を使い切っている';
    if (d.type === 'trade' || d.type === 'project') {
      if (auto) {
        if (autoActive() >= autoBook()) return '定型商談課の手が回らない';
      } else if (manualActive() >= capacity()) {
        return '人員が足りず、これ以上の案件は回せない（現行 ' + manualActive() + '/' + capacity() + '）';
      }
    }
    if (d.upfront > S.cash) return '手元資金が不足（必要 ' + money(d.upfront) + ' / 現金 ' + money(S.cash) + '）';
    const eq = equity();
    if (eq > 0 && d.exposure > eq * 0.62 + borrowLimit() * 0.4)
      return '単一案件としてリスクが大きすぎる（与信枠超過）';
    if (d.type === 'project' && d.cost / d.months > S.cash * 0.5 + borrowLimit() * 0.2)
      return '毎月の工事原価を賄えない資金繰りだ';
    return null;
  }

  function bid(dealId, stanceIdx, opt) {
    opt = opt || {};
    const i = S.market.findIndex(function (x) { return x.id === dealId; });
    if (i < 0) return { ok: false, msg: '案件が見つからない' };
    const d = S.market[i];
    const err = bidCheck(d, opt.auto);
    if (err) return { ok: false, msg: err };

    if (!opt.auto) S.slots--;
    const p = winScore(d, stanceIdx);
    const won = Math.random() < p;
    S.market.splice(i, 1);
    const st = D.STANCES[stanceIdx];

    if (!won) {
      S.stats.lost++;
      divOf(d.div).exp += 0.35;
      if (!opt.auto) log('「' + d.name + '」失注。競合が条件で上回った。', 'down');
      return { ok: true, won: false, prob: p, deal: d };
    }

    S.stats.won++;
    S.credit = clamp(S.credit + 0.55, 0, 100);
    const dd = divOf(d.div);
    dd.exp += d.big ? 2.5 : 1;
    checkLevel(d.div);

    if (d.type === 'trade') {
      S.cash -= d.capital;
      S.active.push({
        id: d.id, type: 'trade', name: d.name, div: d.div, region: d.region, comms: d.comms,
        volume: d.volume, marginRate: d.marginRate * st.mult, capital: d.capital,
        months: d.months, prog: 0, risk: d.risk, big: d.big, auto: !!opt.auto, tier: d.tier,
        mkAtBid: mfac(d.comms), fxAtBid: S.fx,
      });
    } else if (d.type === 'project') {
      S.cash += d.adv;
      S.active.push({
        id: d.id, type: 'project', name: d.name, div: d.div, region: d.region, comms: d.comms,
        contract: d.contract * (0.82 + 0.18 * st.mult),
        cost: d.cost, months: d.months, prog: 0, wip: 0, adv: d.adv,
        risk: d.risk, delays: 0, big: d.big, auto: !!opt.auto, tier: d.tier,
      });
    } else {
      S.cash -= d.invest; countInvest(d.invest);
      S.assets.push({
        id: d.id, type: d.type, name: d.name, div: d.div, region: d.region, comms: d.comms,
        basis: d.invest, value: d.invest, yieldRate: d.yieldRate * (0.85 + 0.15 * st.mult),
        growth: d.growth || 0, life: d.life || 0, age: 0, cum: 0, impaired: 0, big: d.big,
      });
    }
    if (!opt.auto) log('「' + d.name + '」を獲得（' + st.n + '条件）。', 'up');
    return { ok: true, won: true, prob: p, deal: d };
  }

  function checkLevel(divId) {
    const dd = S.div[divId];
    while (dd.lv < 25 && dd.exp >= dd.lv * 3) {
      dd.exp -= dd.lv * 3;
      dd.lv++;
      log(D.DIV_BY_ID[divId].name + ' が Lv.' + dd.lv + ' に成長した。', 'gold');
    }
  }

  /* ---------------- management actions ---------------- */
  function hireBlock() { return [10, 25, 100, 400, 1500, 6000][S.stage]; }
  function hireCost() { return hireBlock() * 0.022; }
  function hire() {
    const c = hireCost();
    if (S.cash < c) return { ok: false, msg: '採用費が足りない' };
    S.cash -= c; capex(c);
    S.staff += hireBlock();
    S.slots = Math.min(slotsMax(), S.slots + (slotsMax() > S.slots ? 1 : 0));
    log(hireBlock() + '名を採用した（採用費 ' + money(c) + '）。', '');
    return { ok: true };
  }

  function upgradeCost(divId) {
    const lv = S.div[divId].lv;
    return scale() * (2.5 + lv * lv * 0.55);
  }
  function upgrade(divId) {
    const c = upgradeCost(divId);
    if (S.div[divId].lv >= 25) return { ok: false, msg: '既に最高水準' };
    if (S.cash < c) return { ok: false, msg: '資金が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c); countInvest(c);
    S.div[divId].lv++;
    log(D.DIV_BY_ID[divId].name + ' に ' + money(c) + ' を投資、Lv.' + S.div[divId].lv + ' へ。', 'gold');
    return { ok: true };
  }

  function officeCost() { return fx('officeCost', scale() * 16 + 5); }
  function openOffice(regId) {
    if (hasOffice(regId)) return { ok: false, msg: '既に拠点がある' };
    const c = officeCost();
    if (S.cash < c) return { ok: false, msg: '資金が足りない（必要 ' + money(c) + '）' };
    S.cash -= c; capex(c); countInvest(c);
    S.offices.push(regId);
    S.credit = clamp(S.credit + 1.5, 0, 100);
    log(D.REGION_BY_ID[regId].name + 'に拠点を開設した。', 'gold');
    return { ok: true };
  }

  function borrow(amt) {
    amt = Math.max(0, Math.min(amt, borrowLimit()));
    if (amt <= 0) return { ok: false, msg: '借入枠がない' };
    S.cash += amt; S.debt += amt;
    log('銀行団から ' + money(amt) + ' を調達（金利 ' + pct(interestRate()) + '）。', '');
    return { ok: true };
  }
  function repay(amt) {
    amt = Math.max(0, Math.min(amt, Math.min(S.debt, S.cash)));
    if (amt <= 0) return { ok: false, msg: '返済できる資金・債務がない' };
    S.cash -= amt; S.debt -= amt;
    S.credit = clamp(S.credit + amt / Math.max(1, equity()) * 6, 0, 100);
    log(money(amt) + ' を繰上返済した。', '');
    return { ok: true };
  }

  /* 年次の資源配分 */
  function budgetPool() { return ofx('budget', Math.max(0, S.cash * (0.65 + (S.planBonus || 0) * 0.12))); }
  function budgetUnit() { return Math.max(0.1, Math.round(budgetPool() / 16 * 10) / 10); }
  function allocateBudget(map) {
    let total = 0;
    for (const k in map) total += Math.max(0, map[k] || 0);
    total = Math.min(total, Math.max(0, S.cash));
    D.DIVISIONS.forEach(function (d) {
      S.boost[d.id] = clamp((map[d.id] || 0) / (scale() * 5), 0, 3);
    });
    D.BUDGET_CORP.forEach(function (c) {
      S.corp[c.id] = Math.min(6, S.corp[c.id] * 0.86 + (map[c.id] || 0) / (scale() * 9));
    });
    S.cash -= total; capex(total); countInvest(total);
    S.budget = map;
    if (total > 0) log('年度予算 ' + money(total) + ' を配分した。', 'gold');
    else log('今年度は投資を見送った。各本部の地力が落ちていく。', 'down');
    save();
    return total;
  }

  /* ---------------- 中期経営計画 ---------------- */
  function planTargetOptions() {
    const eq = Math.max(1, equity());
    const last = S.fyHistory.length ? S.fyHistory[S.fyHistory.length - 1].profit : eq * 0.10;
    const base = Math.max(eq * 0.06, last, 1);
    return {
      profit: [base * 4.2, base * 9.0, base * 17.0],
      roe: [0.17, 0.29, 0.44],
      invest: [eq * 1.05, eq * 2.10, eq * 3.60],
    };
  }
  function formulatePlan(tiers, cards) {
    const opt = planTargetOptions();
    S.planNo = (S.planNo || 0) + 1;
    S.plan = {
      no: S.planNo,
      startFY: fiscalYear() + 1, endFY: fiscalYear() + 3,
      tiers: tiers,
      targets: {
        profit: opt.profit[tiers.profit],
        roe: opt.roe[tiers.roe],
        invest: opt.invest[tiers.invest],
      },
      cards: cards.slice(0, 2),
      cumInvest: 0,
    };
    log('第' + S.planNo + '次中期経営計画（' + S.plan.startFY + '〜' + S.plan.endFY + '年3月期）を策定した。', 'gold');
    save();
    return S.plan;
  }
  function evaluatePlan(rec) {
    const p = S.plan;
    if (!p) return null;
    const res = {
      no: p.no, startFY: p.startFY, endFY: p.endFY, cards: p.cards.slice(),
      items: [
        { id: 'profit', target: p.targets.profit, actual: rec.profit, ok: rec.profit >= p.targets.profit },
        { id: 'roe', target: p.targets.roe, actual: rec.roe, ok: rec.roe >= p.targets.roe },
        { id: 'invest', target: p.targets.invest, actual: p.cumInvest || 0, ok: (p.cumInvest || 0) >= p.targets.invest },
      ],
    };
    res.count = res.items.filter(function (x) { return x.ok; }).length;
    const hard = (p.tiers.profit + p.tiers.roe + p.tiers.invest) / 6;
    if (res.count === 3) {
      S.trust = clamp(S.trust + 12 + hard * 10, 0, 100);
      S.credit = clamp(S.credit + 6 + hard * 4, 0, 100);
      S.pbr = clamp(S.pbr * (1.15 + hard * 0.18), 0.22, 4.0);
      res.gain = 0.30 + hard * 0.50;
      res.msg = '全項目を達成。市場は当社の実行力を認め、投資余力と現場の勢いが積み上がった。';
      res.tone = 'up';
    } else if (res.count === 2) {
      S.trust = clamp(S.trust + 5, 0, 100);
      S.credit = clamp(S.credit + 2, 0, 100);
      res.gain = 0.12;
      res.msg = '概ね計画線。ただし積み残しは記憶される。';
      res.tone = '';
    } else if (res.count === 1) {
      S.trust = clamp(S.trust - 5, 0, 100);
      res.gain = -0.20;
      res.msg = '未達が目立つ。説明責任を問う声が出ている。';
      res.tone = 'warn';
    } else {
      S.trust = clamp(S.trust - (14 + hard * 8), 0, 100);
      S.credit = clamp(S.credit - 6, 0, 100);
      S.pbr = clamp(S.pbr * 0.78, 0.22, 4.0);
      res.gain = -0.60;
      res.msg = '全項目未達。株主は経営陣の姿勢そのものを疑い始めた。';
      res.tone = 'down';
    }
    S.planBonus = clamp((S.planBonus || 0) + res.gain, 0, 1.2);
    res.bonus = S.planBonus;
    log('第' + p.no + '次中計 ' + res.count + '/3 達成。' + res.msg, res.tone === 'up' ? 'gold' : res.tone === 'down' ? 'down' : 'info');
    S.planHistory.push(res);
    S.plan = null;
    save();
    return res;
  }
  function planProgress() {
    if (!S.plan) return null;
    const t = S.plan.targets;
    return {
      no: S.plan.no, endFY: S.plan.endFY, cards: S.plan.cards,
      yearsLeft: Math.max(0, S.plan.endFY - fiscalYear() + 1),
      profit: { cur: S.fy.profit, target: t.profit },
      roe: { cur: S.roeTTM, target: t.roe },
      invest: { cur: S.plan.cumInvest || 0, target: t.invest },
    };
  }

  function sellAsset(id) {
    const i = S.assets.findIndex(function (a) { return a.id === id; });
    if (i < 0) return { ok: false, msg: '見つからない' };
    const a = S.assets[i];
    const proceeds = a.value * rnd(0.88, 1.06);
    S.cash += proceeds;
    S.assets.splice(i, 1);
    const g = proceeds - a.value;
    if (!S.pend) S.pend = { capex: 0, gain: 0 };
    S.pend.gain += g;
    log('「' + a.name + '」を ' + money(proceeds) + ' で売却（' + signed(proceeds - a.basis) + ' vs 簿価取得原価）。', g >= 0 ? 'up' : 'down');
    return { ok: true, proceeds: proceeds };
  }

  /* ---------------- monthly step ---------------- */
  function stepMarket() {
    D.COMM_KEYS.forEach(function (k) {
      const c = D.COMMODITIES[k];
      S.mkPrev[k] = S.mk[k];
      const mr = Math.log(100 / S.mk[k]) * 0.035;
      const sh = randn() * c.vol * 0.55 + c.drift;
      S.mk[k] = clamp(S.mk[k] * Math.exp(mr + sh), 32, 340);
    });
    S.fxPrev = S.fx;
    S.fx = clamp(S.fx * Math.exp(Math.log(145 / S.fx) * 0.04 + randn() * 0.018), 90, 260);
    S.rateBase = clamp(S.rateBase + randn() * 0.0012 + (0.022 - S.rateBase) * 0.05, 0.002, 0.075);
  }

  function rollEvent() {
    if (Math.random() > 0.30) return null;
    const e = wpick(D.EVENTS, 'w');
    if (e.shock) for (const k in e.shock) S.mk[k] = clamp(S.mk[k] * (1 + e.shock[k]), 32, 340);
    if (e.fx) S.fx = clamp(S.fx * (1 + e.fx), 90, 260);
    if (e.rate) S.rateBase = clamp(S.rateBase + e.rate, 0.002, 0.09);
    if (e.credit) S.credit = clamp(S.credit + e.credit, 0, 100);
    if (e.impairRisk) S.mod.impair = e.impairRisk;
    if (e.creditRisk) S.mod.creditRisk = e.creditRisk;
    if (e.delayRisk) S.mod.delay = e.delayRisk;
    if (e.wageUp) S.wageInfl = (S.wageInfl || 0) + e.wageUp;
    if (e.bigDeal) { S.market.push(genDeal(true)); }
    log('【' + e.title + '】', 'info');
    return e;
  }

  function newLedger() {
    const g = S.pend ? S.pend.gain : 0;
    if (S.pend) S.pend.gain = 0;
    signRev(g);
    return { trade: 0, project: 0, dividend: 0, reval: 0, impair: 0, gain: g,
             wage: 0, sga: 0, interest: 0, defaults: 0 };
  }
  function sumLedger(L) { let t = 0; for (const k in L) t += L[k]; return t; }
  function capex(v) { if (!S.pend) S.pend = { capex: 0, gain: 0 }; S.pend.capex += v; }

  function processActive(L) {
    for (let i = S.active.length - 1; i >= 0; i--) {
      const a = S.active[i];
      if (a.type === 'trade') {
        a.prog++;
        if (a.prog >= a.months) {
          // 与信リスク
          if (Math.random() < a.risk * S.mod.creditRisk) {
            const loss = a.capital * rnd(0.35, 0.85);
            S.cash += a.capital - loss;
            L.defaults -= loss; seg(a.div).gross -= loss; addCost(loss);
            S.stats.defaults++;
            S.credit = clamp(S.credit - 4, 0, 100);
            log('「' + a.name + '」で相手方がデフォルト。' + money(loss) + ' の貸倒損失。', 'down');
          } else {
            const mkNow = mfac(a.comms);
            const swing = mkNow / a.mkAtBid;
            const fxs = 1 + (S.fx / a.fxAtBid - 1) * (a.region === 'jp' ? 0.2 : 0.7);
            let profit = a.volume * a.marginRate * (0.35 + 0.65 * swing) * fxs;
            profit *= rnd(0.85, 1.15) * divExec(a.div);
            S.cash += a.capital + profit;
            L.trade += profit; seg(a.div).gross += profit; seg(a.div).deals++;
            addRev(profit, a.volume, a.div);
            S.fy.deals++;
            S.stats.done++;
            divOf(a.div).exp += 0.6; checkLevel(a.div);
            log('「' + a.name + '」決済完了。取扱高 ' + money(a.volume) + '、利益 ' + signed(profit) + '。',
              profit >= 0 ? 'up' : 'down');
          }
          S.active.splice(i, 1);
        }
      } else if (a.type === 'project') {
        // 遅延判定
        if (Math.random() < a.risk * S.mod.delay * 0.5) {
          a.months++; a.delays++;
          a.cost *= 1.03;
          log('「' + a.name + '」で工程遅延。原価が膨らんだ。', 'down');
        }
        const c = a.cost / a.months;
        S.cash -= c; a.wip += c;
        a.prog++;
        if (a.prog >= a.months) {
          const remain = a.contract - a.adv;
          S.cash += remain;
          const profit = (a.contract - a.wip) * (a.contract > a.wip ? divExec(a.div) : 1);
          L.project += profit; seg(a.div).gross += profit; seg(a.div).deals++;
          addRev(a.wip + profit, a.contract, a.div); addCost(a.wip);
          S.active.splice(i, 1);
          S.fy.deals++; S.stats.done++;
          divOf(a.div).exp += 1.5; checkLevel(a.div);
          S.credit = clamp(S.credit + 1.5, 0, 100);
          log('「' + a.name + '」竣工・引渡し。請負 ' + money(a.contract) + '、利益 ' + signed(profit) + '。',
            profit >= 0 ? 'up' : 'down');
        }
      }
    }
  }

  /* 買収した事業会社: PMI → 稼働 → のれん減損 */
  function processCompany(a, L) {
    a.age++;
    const mAdj = 1 + (mfac(a.comms) - 1) * 0.30;
    if (!a.pmiDone) {
      a.pmiLeft--;
      const d0 = a.profitBase * 0.30 * clamp(mAdj, 0.3, 1.6);
      S.cash += d0; L.dividend += d0; a.cum += d0; seg(a.div).dividend += d0;
      addRev(d0, (a.sales || 0) / 12 * 0.5, a.div);
      if (a.pmiLeft <= 0) {
        a.pmiDone = true;
        if (Math.random() < pmiChance(a)) {
          a.synergy = rnd(0.70, 1.30);
          S.maStats.pmiOk++;
          S.credit = clamp(S.credit + 3, 0, 100);
          S.trust = clamp(S.trust + 3, 0, 100);
          log('「' + a.name + '」の統合が完了。シナジーが立ち上がった。', 'up');
        } else {
          a.synergy = rnd(0, 0.25);
          const w = a.goodwill * rnd(0.55, 1.0);
          a.value = Math.max(0, a.value - w);
          a.impaired = clamp(a.impaired + 0.30, 0, 0.9);
          L.impair -= w; seg(a.div).impair -= w; addCost(w);
          S.maStats.pmiNg++; S.stats.impair++;
          S.credit = clamp(S.credit - 6, 0, 100);
          S.trust = clamp(S.trust - 8, 0, 100);
          log('「' + a.name + '」の統合に失敗。のれん ' + money(w) + ' を減損した。', 'down');
        }
      }
      return;
    }
    const sb = secondBonus(a);
    const d = a.profitBase * (1 + a.synergy * 0.55 + sb.sales / 260) * clamp(mAdj, 0.25, 2.0) * fxFac();
    S.cash += d; L.dividend += d; a.cum += d; seg(a.div).dividend += d;
    addRev(d, (a.sales || 0) / 12, a.div);
    const target = a.basis * Math.pow(1 + a.growth * (1 + a.synergy * 0.5 + sb.lead / 130), a.age)
      * clamp(mAdj, 0.5, 1.9) * (1 - a.impaired);
    const nv = a.value + (target - a.value) * 0.18;
    L.reval += nv - a.value; seg(a.div).reval += nv - a.value; signRev(nv - a.value, a.div);
    a.value = Math.max(0, nv);
    if (a.goodwill > 0 && a.value < a.basis * 0.70 &&
        Math.random() < 0.05 * S.mod.impair * traitMin('impair', 1) * (1 - Math.min(0.6, sb.eye / 170))) {
      const w = Math.min(a.goodwill, a.value * rnd(0.15, 0.35));
      a.value -= w; a.impaired = clamp(a.impaired + 0.10, 0, 0.9);
      L.impair -= w; seg(a.div).impair -= w; addCost(w);
      S.stats.impair++;
      S.credit = clamp(S.credit - 3, 0, 100);
      log('「' + a.name + '」ののれんを ' + money(w) + ' 減損した。', 'down');
    }
  }

  function processAssets(L) {
    for (let i = S.assets.length - 1; i >= 0; i--) {
      const a = S.assets[i];
      if (a.type === 'company') { processCompany(a, L); continue; }
      a.age++;
      const mf = mfac(a.comms);
      const sens = a.type === 'concession' ? 1.0 : 0.35;
      const mAdj = 1 + (mf - 1) * sens;

      // 配当・持分利益
      const div = a.value * a.yieldRate * clamp(mAdj, 0.15, 2.2) * fxFac() * (a.region === 'jp' ? 1 : 1.05);
      S.cash += div; L.dividend += div; a.cum += div; seg(a.div).dividend += div;
      addRev(div, 0, a.div);

      // 評価
      let target;
      if (a.type === 'concession') {
        const dep = a.life ? Math.max(0, 1 - a.age / a.life) : 1;
        target = a.basis * dep * clamp(mAdj, 0.2, 2.4) * (1 - a.impaired);
      } else {
        target = a.basis * Math.pow(1 + a.growth, a.age) * clamp(mAdj, 0.4, 2.0) * (1 - a.impaired);
      }
      const nv = a.value + (target - a.value) * 0.22;
      L.reval += nv - a.value; seg(a.div).reval += nv - a.value; signRev(nv - a.value, a.div);
      a.value = Math.max(0, nv);

      // 減損
      if (a.value < a.basis * 0.68 &&
          Math.random() < fx('impair', 0.09) * traitMin('impair', 1) * S.mod.impair
            * (1 - Math.min(0.60, corpOf('esg') * 0.16)) * (1 - Math.min(0.40, eyePt() * 0.05))) {
        const w = a.value * rnd(0.18, 0.42);
        a.value -= w; a.impaired = clamp(a.impaired + 0.12, 0, 0.8);
        L.impair -= w; seg(a.div).impair -= w; addCost(w);
        S.stats.impair++;
        S.credit = clamp(S.credit - 3, 0, 100);
        log('「' + a.name + '」で減損損失 ' + money(w) + ' を計上。', 'down');
      }

      if (a.type === 'concession' && a.life && a.age >= a.life) {
        S.cash += a.value; L.gain += 0; // 残存簿価を回収（売却相当、損益ゼロ）
        log('「' + a.name + '」が可採期間を終了。累計配当 ' + money(a.cum) + '。', 'info');
        S.assets.splice(i, 1);
      }
    }
  }

  function financeCosts(L) {
    const wage = fx('wage', staffCost()) + fx('wage', rosterCost());
    const sga = (S.offices.length * 0.5 * Math.sqrt(scale()) + Math.max(0, equity()) * 0.0006 + 0.25)
      * (1 - Math.min(0.35, corpOf('dx') * 0.10));
    const sgaF = ofx('sga', fx('sga', sga));
    const int = S.debt * interestRate() / 12;
    S.cash -= (wage + sgaF + int);
    L.wage -= wage; L.sga -= sgaF; L.interest -= int;
    addCost(wage + sgaF + int);
  }

  function rescue(L) {
    // 現金不足 → 借入 → 資産売却 → 危機
    if (S.cash >= 0) return;
    const need = -S.cash + 5;
    const b = Math.min(need, borrowLimit());
    if (b > 0) { S.cash += b; S.debt += b; log('資金繰り悪化により ' + money(b) + ' を緊急借入。', 'down'); }
    while (S.cash < 0 && S.assets.length) {
      S.assets.sort(function (x, y) { return x.value - y.value; });
      const a = S.assets[0];
      const proceeds = a.value * (rnd(0.62, 0.82) + traitBest('rescue'));
      S.cash += proceeds; L.gain += proceeds - a.value; signRev(proceeds - a.value, a.div);
      S.assets.shift();
      S.credit = clamp(S.credit - 2, 0, 100);
      log('資金確保のため「' + a.name + '」を投売り（' + money(proceeds) + '）。', 'down');
    }
    if (S.cash < 0) {
      S.credit = clamp(S.credit - 4, 0, 100);
      log('債務不履行の瀬戸際。取引銀行が態度を硬化させている。', 'down');
    }
  }

  function stepRivals() {
    const boom = (S.mk.crude + S.mk.iron + S.mk.copper) / 300;
    S.rivals.forEach(function (r) {
      r.eq *= (1 + r.g * (0.6 + 0.8 * boom) + randn() * 0.016);
