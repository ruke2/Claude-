<title>摩天楼の設計図</title>
<style>
/* ============================================================
   摩天楼の設計図 — UI stylesheet（白基調）
   ============================================================ */
:root{
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --glass:rgba(255,255,255,.93);
  --glass-2:rgba(255,255,255,.97);
  --ink:#16202f;
  --ink-dim:#5b6878;
  --ink-mute:#8e9aab;
  --line:rgba(22,32,47,.13);
  --line-soft:rgba(22,32,47,.07);
  --field-bg:#f3f5f9;

  --accent:#1a4f9c;          /* 藍 — 主要操作 */
  --accent-soft:#e8eff9;
  --gold:#b0781a;            /* 琥珀 — 強調 */
  --gold-2:#8c5d10;
  --gold-soft:#fbf2df;
  --cyan:#0d7ea8;
  --cyan-soft:#e3f2f8;
  --green:#0f8a55;
  --green-soft:#e2f5ec;
  --red:#c4344a;
  --red-soft:#fce9ec;
  --amber:#b5760d;
  --amber-soft:#fdf1dd;
  --violet:#6b4bc4;
  --violet-soft:#eeeaf9;

  --shadow-sm:0 1px 2px rgba(22,32,47,.06), 0 2px 8px rgba(22,32,47,.06);
  --shadow-md:0 2px 6px rgba(22,32,47,.08), 0 10px 30px rgba(22,32,47,.10);
  --shadow-lg:0 10px 26px rgba(22,32,47,.14), 0 30px 70px rgba(22,32,47,.18);
  --r:10px;
  --fs:14px;

  --topH:58px;          /* ヘッダー高さ */
  --botH:30px;          /* 画面下部（ティッカー／タブバー）の高さ */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:var(--fs);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.hidden{display:none !important}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(22,32,47,.16);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(22,32,47,.3);background-clip:content-box}

/* ---------- canvas ---------- */
#city{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;z-index:0;touch-action:none}
#city.dragging{cursor:grabbing}

#cityHud{
  position:fixed;left:82px;z-index:6;pointer-events:none;
  bottom:calc(var(--botH) + 16px + env(safe-area-inset-bottom,0px));
  font-size:12px;letter-spacing:.02em;
}
.cityhud-line{
  font-weight:600;display:inline-block;
  background:var(--glass);border:1px solid var(--line);
  padding:4px 11px;border-radius:7px;box-shadow:var(--shadow-sm);
  backdrop-filter:blur(10px);
}
.cityhud-line.dim{color:var(--ink-dim);font-weight:500;margin-top:5px;max-width:520px}

#viewControls{position:fixed;right:18px;z-index:8;display:flex;gap:6px;
  bottom:calc(var(--botH) + 16px + env(safe-area-inset-bottom,0px))}
.vbtn{
  width:36px;height:36px;border-radius:9px;background:var(--glass);
  border:1px solid var(--line);color:var(--ink-dim);font-size:15px;
  backdrop-filter:blur(10px);transition:.15s;display:grid;place-items:center;
  box-shadow:var(--shadow-sm);
}
.vbtn:hover{color:var(--accent);border-color:var(--accent);background:#fff}

/* ---------- topbar ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  height:calc(var(--topH) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 14px 0;
  display:flex;align-items:center;gap:16px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
  box-shadow:0 1px 10px rgba(22,32,47,.06);
}
.brandbox{display:flex;align-items:center;gap:10px;min-width:180px}
.brand-mark{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2a63b8,#153f7d);color:#fff;
  font-family:Oswald,sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(26,79,156,.3);
}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.04em;line-height:1.2}
.brand-sub{font-family:Oswald,sans-serif;font-size:8.5px;letter-spacing:.22em;color:var(--ink-mute)}

.stat-strip{display:flex;gap:0;flex:1;overflow:hidden}
.stat{padding:3px 13px;border-left:1px solid var(--line-soft);min-width:0}
.stat:first-child{border-left:none}
.stat-k{font-size:9.5px;letter-spacing:.12em;color:var(--ink-mute);font-weight:600;white-space:nowrap}
.stat-v{font-family:Oswald,sans-serif;font-size:17px;letter-spacing:.01em;white-space:nowrap;line-height:1.25}
.stat-v small{font-size:10px;color:var(--ink-dim);margin-left:2px;font-family:"Noto Sans JP"}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--ink-mute)}

.turnbox{display:flex;align-items:center;gap:12px}
.turn-date{text-align:right;line-height:1.25}
#hdrDate{font-family:Oswald,sans-serif;font-size:16px;display:block;letter-spacing:.02em}
.turn-season{font-size:10px;color:var(--gold);letter-spacing:.1em}
.turn-btns{display:flex;gap:5px}
.btn-next{
  padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;letter-spacing:.03em;
  background:linear-gradient(145deg,#2a63b8,#17457f);color:#fff;
  box-shadow:0 2px 10px rgba(26,79,156,.28);transition:.16s;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px;
}
.btn-next small{font-size:9px;font-weight:500;opacity:.85;margin-top:1px}
.btn-next.ghosty{
  background:#fff;color:var(--accent);
  border:1px solid rgba(26,79,156,.3);box-shadow:var(--shadow-sm);
}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(26,79,156,.34)}
.btn-next.ghosty:hover{background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.btn-next:disabled{opacity:.45;cursor:wait;transform:none}

/* ---------- side tabs ---------- */
#sidetabs{
  position:fixed;left:0;width:64px;z-index:19;
  top:calc(var(--topH) + env(safe-area-inset-top,0px));
  bottom:calc(var(--botH) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:2px;padding:10px 6px;
  background:rgba(255,255,255,.9);border-right:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.tab{
  height:50px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--ink-mute);
  transition:.15s;border:1px solid transparent;position:relative;
}
.tab i{font-style:normal;font-size:16px;line-height:1}
.tab span{font-size:9.5px;letter-spacing:.04em;font-weight:600}
.tab:hover{color:var(--accent);background:var(--accent-soft)}
.tab.on{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 2px 8px rgba(26,79,156,.3)}
.tab .badge{
  position:absolute;top:4px;right:7px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 0 0 2px #fff;
}

/* ---------- panel ---------- */
#panel{
  position:fixed;left:64px;width:min(580px,54vw);z-index:18;
  top:calc(var(--topH) + env(safe-area-inset-top,0px));
  bottom:calc(var(--botH) + env(safe-area-inset-bottom,0px));
  background:var(--glass-2);backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  animation:slideIn .2s cubic-bezier(.2,.9,.3,1);
  box-shadow:14px 0 40px rgba(22,32,47,.13);
}
@keyframes slideIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;
  background:var(--surface);
}
.panel-head h2{font-size:15px;font-weight:700;letter-spacing:.04em}
#panelClose{color:var(--ink-mute);font-size:15px;padding:4px 9px;border-radius:6px}
#panelClose:hover{color:var(--red);background:var(--red-soft)}
.panel-body{flex:1;overflow-y:auto;padding:16px 18px 40px;background:var(--surface-2)}

/* ---------- week feed ---------- */
#feed{
  position:fixed;right:18px;z-index:7;width:320px;max-width:calc(100vw - 36px);
  bottom:calc(var(--botH) + 64px + env(safe-area-inset-bottom,0px));
  background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow-md);
}
#feed.collapsed .feed-body{display:none}
.feed-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);
  font-size:10.5px;letter-spacing:.1em;color:var(--accent);font-weight:700;
  background:var(--surface);
}
#feedToggle{color:var(--ink-mute);font-size:11px;padding:2px 6px;border-radius:5px}
#feedToggle:hover{color:var(--ink)}
.feed-body{max-height:220px;overflow-y:auto;padding:4px 0;background:var(--surface)}
.feed-item{
  display:flex;gap:8px;padding:5px 12px;font-size:11.5px;line-height:1.55;
  border-bottom:1px solid var(--line-soft);
}
.feed-item:last-child{border-bottom:none}
.feed-item .fi{flex:0 0 15px;text-align:center;font-size:12px}
.feed-item.major{background:var(--gold-soft)}
.feed-item.major .ft{color:var(--gold-2);font-weight:600}
.feed-week{
  padding:5px 12px;font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);
  background:var(--surface-2);font-weight:700;border-bottom:1px solid var(--line-soft);
}
.feed-empty{padding:16px 12px;text-align:center;color:var(--ink-mute);font-size:11px}

/* ---------- ticker ---------- */
#ticker{
  position:fixed;left:0;right:0;bottom:0;z-index:21;
  height:calc(var(--botH) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--line);
  overflow:hidden;display:flex;align-items:center;
}
.ticker-track{display:flex;gap:32px;white-space:nowrap;padding-left:14px;font-size:11.5px;animation:tick 70s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{color:var(--ink-dim)}
.tk b{color:var(--ink);font-weight:700;margin-right:5px}
.tk .up{color:var(--green)} .tk .down{color:var(--red)}

/* ---------- generic blocks ---------- */
.sec{margin-bottom:22px}
.sec-t{
  font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;
  padding-bottom:7px;margin-bottom:11px;border-bottom:1.5px solid var(--accent-soft);
  display:flex;align-items:center;justify-content:space-between;
}
.sec-t .note{color:var(--ink-mute);letter-spacing:.02em;font-weight:500;font-size:10.5px}

.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin-bottom:9px;transition:.15s;
  box-shadow:var(--shadow-sm);
}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.card-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.card-n{font-weight:700;font-size:13.5px}
.card-s{font-size:11.5px;color:var(--ink-dim);line-height:1.7}

.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
.kv .k{color:var(--ink-dim)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.kv.big .v{font-family:Oswald,sans-serif;font-size:15px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.mini{
  background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;text-align:center;box-shadow:var(--shadow-sm);
}
.mini-k{font-size:9.5px;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
.mini-v{font-family:Oswald,sans-serif;font-size:19px;line-height:1.3}
.mini-s{font-size:10px;color:var(--ink-dim)}

.chip{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;
  font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent;
}
.chip.gold{background:var(--gold-soft);color:var(--gold-2);border-color:rgba(176,120,26,.25)}
.chip.cyan{background:var(--cyan-soft);color:var(--cyan);border-color:rgba(13,126,168,.22)}
.chip.green{background:var(--green-soft);color:var(--green);border-color:rgba(15,138,85,.22)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:rgba(196,52,74,.22)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(181,118,13,.22)}
.chip.violet{background:var(--violet-soft);color:var(--violet);border-color:rgba(107,75,196,.22)}
.chip.grey{background:#eef1f5;color:var(--ink-dim);border-color:var(--line)}

.bar{height:7px;border-radius:4px;background:#e7ebf1;overflow:hidden;margin:5px 0}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2a7fd0,#0f8a55);transition:width .4s}
.bar.gold > i{background:linear-gradient(90deg,#d99b2a,#b0781a)}
.bar.red > i{background:linear-gradient(90deg,#e05a6c,#c4344a)}
.bar.violet > i{background:linear-gradient(90deg,#8d6fe0,#6b4bc4)}

table.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border-radius:8px;overflow:hidden}
table.tbl th{
  text-align:right;font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);
  font-weight:700;padding:7px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  background:var(--surface-2);
}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl td{padding:6px 7px;border-bottom:1px solid var(--line-soft);text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--accent-soft)}
table.tbl tr.me td{background:var(--gold-soft);font-weight:700}
table.tbl tr.sum td{border-top:1.5px solid var(--line);font-weight:700;background:var(--surface-2)}

.btn{
  padding:8px 15px;border-radius:8px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);transition:.15s;
  box-shadow:var(--shadow-sm);
}
.btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(145deg,#2a63b8,#17457f);color:#fff;border:none;font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:rgba(196,52,74,.28)}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn.wide{width:100%;text-align:center;display:block}
.btn.huge{padding:14px 44px;font-size:15px;letter-spacing:.08em}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}

.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field select,textarea{
  width:100%;padding:8px 10px;border-radius:7px;background:var(--field-bg);
  border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;
}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:11px;color:var(--ink-mute);line-height:1.7;margin-top:5px}
.empty{text-align:center;color:var(--ink-mute);font-size:12px;padding:32px 12px;line-height:1.9}

/* ---------- modal ---------- */
#modalWrap,#reportWrap{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  background:rgba(22,32,47,.38);backdrop-filter:blur(5px);padding:20px;
}
#modal{
  width:min(700px,95vw);max-height:88vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;letter-spacing:.03em;font-weight:700}
#modalClose{color:var(--ink-mute);padding:4px 9px;border-radius:6px}
#modalClose:hover{color:var(--red);background:var(--red-soft)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;background:var(--surface-2)}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface)}

/* ---------- report ---------- */
#report{
  width:min(880px,96vw);max-height:90vh;display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.9,.3,1);
}
.report-head{padding:20px 26px 14px;border-bottom:2px solid var(--accent-soft)}
.report-kicker{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.28em;color:var(--accent)}
.report-head h2{font-size:22px;font-weight:900;letter-spacing:.02em;margin-top:2px}
.report-body{padding:20px 26px;overflow-y:auto;flex:1;background:var(--surface-2)}
.report-foot{padding:15px 26px;border-top:1px solid var(--line);background:var(--surface)}
.rep-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}
.rep-hero .mini{padding:12px 10px}
.rep-hero .mini-v{font-size:24px}
.newsitem{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.7}
.newsitem .ico{flex:0 0 22px;text-align:center;font-size:14px}

/* ---------- title ---------- */
#titleScreen{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0a1420;overflow:hidden}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%}
#titleScreen.out{animation:fadeOut .7s forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.title-inner{
  position:relative;z-index:2;text-align:center;padding:26px 30px;max-width:660px;
  background:rgba(255,255,255,.95);border-radius:18px;
  box-shadow:0 30px 90px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto;
}
.title-kicker{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.4em;color:var(--accent);margin-bottom:8px}
.title-logo{
  font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:.08em;line-height:1.15;
  color:var(--ink);margin-bottom:14px;
}
.title-lead{font-size:12.5px;line-height:2;color:var(--ink-dim);margin-bottom:22px}
.title-form{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.title-form label{font-size:10px;letter-spacing:.1em;color:var(--ink-dim);text-align:left;font-weight:600}
.title-form input,.title-form select{
  display:block;margin-top:5px;padding:9px 12px;border-radius:8px;min-width:215px;
  background:var(--field-bg);border:1px solid var(--line);color:var(--ink);font-size:13px;
}
.title-form input:focus,.title-form select:focus{outline:none;border-color:var(--accent);background:#fff}
.title-credit{margin-top:18px;font-size:10.5px;color:var(--ink-mute);letter-spacing:.06em}

.title-saves-t{
  font-size:10px;letter-spacing:.16em;color:var(--ink-mute);font-weight:700;
  margin:20px 0 8px;text-align:left;
}
.title-save{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 13px;margin-bottom:6px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);transition:.15s;
}

      }
      return 0;
    }
    // --------------------------------------------------------
    //  空
    // --------------------------------------------------------
    drawSky() {
      const { ctx: ctx2, w, h } = this;
      const T = this.time, W = this.weather;
      const hz0 = this.horizonY();
      const g = ctx2.createLinearGradient(0, Math.min(0, hz0 - h * 1.35), 0, hz0);
      T.sky.forEach((c, i) => g.addColorStop(i / (T.sky.length - 1), c));
      ctx2.fillStyle = g;
      ctx2.fillRect(0, 0, w, Math.max(1, hz0));
      if (T.key === "night") {
        if (!this.stars) {
          this.stars = [];
          for (let i = 0; i < 160; i++) this.stars.push({ x: hash2(i, 1) * w, y: hash2(i, 2) * h * 0.55, r: hash2(i, 3) * 1.3 + 0.2, p: hash2(i, 4) });
        }
        ctx2.save();
        ctx2.beginPath();
        ctx2.rect(0, 0, w, Math.max(1, hz0));
        ctx2.clip();
        ctx2.save();
        for (const s of this.stars) {
          ctx2.globalAlpha = (0.3 + 0.7 * Math.abs(Math.sin(this.t * 0.7 + s.p * 9))) * (1 - W.cloud * 0.8);
          ctx2.fillStyle = "#e8f0ff";
          ctx2.fillRect(s.x, s.y, s.r, s.r);
        }
        ctx2.restore();
        ctx2.restore();
      }
      const sx = T.sun.x * w, sy = hz0 - T.sun.alt * Math.max(180, hz0);
      const sg = ctx2.createRadialGradient(sx, sy, 0, sx, sy, T.sun.r * 5);
      sg.addColorStop(0, T.sun.color);
      sg.addColorStop(0.18, T.sun.color.replace(/[\d.]+\)$/, "0.30)"));
      sg.addColorStop(1, "rgba(0,0,0,0)");
      ctx2.save();
      ctx2.globalAlpha = 1 - W.cloud * 0.65;
      ctx2.beginPath();
      ctx2.rect(0, 0, w, Math.max(1, hz0));
      ctx2.clip();
      ctx2.fillStyle = sg;
      ctx2.fillRect(0, 0, w, h);
      ctx2.beginPath();
      ctx2.arc(sx, sy, T.sun.r * 0.42, 0, Math.PI * 2);
      ctx2.fillStyle = T.key === "night" ? "rgba(232,240,255,0.92)" : T.sun.color;
      ctx2.fill();
      ctx2.restore();
      ctx2.save();
      ctx2.beginPath();
      ctx2.rect(0, 0, w, Math.max(1, hz0));
      ctx2.clip();
      const cn = Math.round(6 + W.cloud * 14);
      for (let i = 0; i < cn; i++) {
        const sp = 6 + hash2(i, 11) * 14;
        const cx = (hash2(i, 12) * w * 1.6 + this.t * sp) % (w * 1.6) - w * 0.3;
        const cy = hash2(i, 13) * Math.max(60, hz0 * 0.72);
        const cw = 60 + hash2(i, 14) * 180, chh = 14 + hash2(i, 15) * 26;
        const a = (0.06 + W.cloud * 0.3) * (0.5 + hash2(i, 16) * 0.5);
        ctx2.globalAlpha = a;
        const cg = ctx2.createLinearGradient(0, cy - chh, 0, cy + chh);
        cg.addColorStop(0, T.key === "evening" ? "#ffcba0" : T.key === "night" ? "#2a3a55" : "#ffffff");
        cg.addColorStop(1, T.key === "night" ? "#18243a" : "#c8d6e8");
        ctx2.fillStyle = cg;
        ctx2.beginPath();
        for (let k = 0; k < 5; k++) {
          const bx = cx + (k / 4 - 0.5) * cw, br = chh * (0.6 + hash2(i, 20 + k) * 0.8);
          ctx2.moveTo(bx + br, cy);
          ctx2.arc(bx, cy, br, 0, Math.PI * 2);
        }
        ctx2.fill();
      }
      ctx2.restore();
      const hz = this.horizonY();
      this.drawSkyline(hz);
      this.drawSea(hz);
      const fg = ctx2.createLinearGradient(0, hz - h * 0.16, 0, hz + h * 0.1);
      fg.addColorStop(0, "rgba(0,0,0,0)");
      fg.addColorStop(0.55, T.fog);
      fg.addColorStop(1, "rgba(0,0,0,0)");
      ctx2.fillStyle = fg;
      ctx2.fillRect(0, Math.max(0, hz - h * 0.16), w, h * 0.26);
    }
    /** 地平線のY座標（カメラに緩やかに追随する） */
    horizonY() {
      return this.h * 0.4 + this.cam.y * 0.22;
    }
    /** 海面 */
    drawSea(hz) {
      const { ctx: ctx2, w, h } = this;
      const T = this.time, W = this.weather;
      const top = Math.max(-h, hz);
      const g = ctx2.createLinearGradient(0, top, 0, h);
      const pal = {
        morning: ["#7d97b8", "#3d5b80", "#1e3550"],
        noon: ["#89b4d8", "#3d76a8", "#1d4a72"],
        evening: ["#c98868", "#6b3f58", "#2c1e36"],
        night: ["#1b3350", "#0d1c30", "#060d18"]
      }[T.key];
      g.addColorStop(0, pal[0]);
      g.addColorStop(0.18, pal[1]);
      g.addColorStop(1, pal[2]);
      ctx2.fillStyle = g;
      ctx2.fillRect(0, top, w, h - top);
      ctx2.save();
      ctx2.beginPath();
      ctx2.rect(0, top, w, h - top);
      ctx2.clip();
      for (let i = 0; i < 70; i++) {
        const r = hash2(i, 31), r2 = hash2(i, 37);
        const depth = r2 * r2;
        const y = top + depth * (h - top) + Math.sin(this.t * 0.9 + r * 20) * 2;
        const len = (8 + r * 90) * (0.3 + depth);
        ctx2.globalAlpha = (0.05 + r * 0.14) * (1 - W.cloud * 0.4);
        ctx2.fillStyle = T.key === "evening" ? "#ffcb9a" : T.key === "night" ? "#6f9ad0" : "#ffffff";
        ctx2.fillRect((r * w * 1.4 + this.t * (6 + depth * 20)) % (w * 1.4) - w * 0.2, y, len, 1 + depth * 2);
      }
      ctx2.restore();
    }
    drawSkyline(hz) {
      const { ctx: ctx2, w, h } = this;
      const T = this.time;
      if (!this.skyline || this.skyline.w !== w) {
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.floor(w));
        cv.height = Math.max(1, Math.floor(h * 0.24));
        const c2 = cv.getContext("2d");
        for (let layer = 0; layer < 2; layer++) {
          let x = -20;
          const base = cv.height;
          while (x < cv.width + 20) {
            const r1 = hash2(Math.floor(x), layer * 7 + 1), r2 = hash2(Math.floor(x), layer * 7 + 2);
            const bw = 14 + r1 * 38, bh = (12 + r2 * 58) * (layer ? 0.66 : 1);
            c2.fillStyle = layer ? T.key === "night" ? "rgba(20,32,55,0.85)" : T.key === "evening" ? "rgba(76,48,66,0.7)" : "rgba(150,175,205,0.45)" : T.key === "night" ? "rgba(10,18,34,0.95)" : T.key === "evening" ? "rgba(48,30,48,0.85)" : "rgba(112,142,180,0.55)";
            c2.fillRect(x, base - bh, bw, bh);
            if (T.key === "night" || T.key === "evening") {
              c2.fillStyle = T.key === "night" ? "rgba(255,225,160,0.55)" : "rgba(255,190,120,0.35)";
              for (let yy = base - bh + 4; yy < base - 4; yy += 6) {
                for (let xx = x + 3; xx < x + bw - 3; xx += 5) {
                  if (hash2(Math.floor(xx), Math.floor(yy)) > 0.62) c2.fillRect(xx, yy, 2, 3);
                }
              }
            }
            x += bw + 2 + r1 * 8;
          }
        }
        this.skyline = { cv, w };
      }
      ctx2.save();
      ctx2.globalAlpha = 0.85 - this.weather.cloud * 0.35;
      ctx2.drawImage(this.skyline.cv, 0, (hz ?? h * 0.4) - this.skyline.cv.height);
      ctx2.restore();
    }
    // --------------------------------------------------------
    //  地面タイル
    // --------------------------------------------------------
    tileColor(c) {
      const T = this.time;
      if (c.terrain === TERRAIN.WATER) return null;
      if (c.terrain === TERRAIN.ROAD) return shade(220, 4, 38, T.faceTop);
      if (c.terrain === TERRAIN.AVENUE) return shade(220, 3, 42, T.faceTop);
      if (c.terrain === TERRAIN.PARK || c.terrain === TERRAIN.GREEN) return shade(118, 26, 40, T.faceTop);
      const d = DISTRICTS[c.d];
      if (this.layer === "owner") {
        if (c.owner === "player") return shade(45, 70, 46, T.faceTop);
        if (c.owner && c.owner !== "other") {
          const r = this.g.rivals.find((x) => x.id === c.owner);
          if (r) {
            const [h2, s2, l2] = hexToHsl(r.color);
            return shade(h2, s2, l2 * 0.6, T.faceTop);
          }
        }
        return shade(0, 0, 26, T.faceTop);
      }
      if (this.layer === "value" && c.baseValue) {
        const v = Math.min(1, c.baseValue / 42e3);
        return shade(240 - v * 240, 62, 20 + v * 26, T.faceTop);
      }
      return shade(d ? d.hue : 210, 6, c.vacant ? 46 : 38, T.faceTop);
    }
    drawTile(c, px, py) {
      const { ctx: ctx2 } = this;
      const z = this.zoom, T = this.time;
      const w = TILE_W * z, h = TILE_H * z;
      const eh = (c.elev || 0) * 6 * Z_UNIT * z;
      if (c.terrain === TERRAIN.WATER) {
        diamond(ctx2, px, py, w + 1, h + 1);
        const g = ctx2.createLinearGradient(px, py - h / 2, px, py + h / 2);
        g.addColorStop(0, T.key === "night" ? "#08182e" : T.key === "evening" ? "#3a2a44" : "#15456e");
        g.addColorStop(1, T.key === "night" ? "#0b2038" : T.key === "evening" ? "#5c3348" : "#1d5c8d");
        ctx2.fillStyle = g;
        ctx2.fill();
        ctx2.save();
        ctx2.clip();
        for (let i = 0; i < 5; i++) {
          const r = hash2(c.gx * 13 + i, c.gy * 7);
          const yy = py - h / 2 + r * h;
          const ph = Math.sin(this.t * 1.4 + r * 12) * 0.5 + 0.5;
          ctx2.globalAlpha = 0.1 + ph * 0.22;
          ctx2.fillStyle = T.key === "evening" ? "#ffb070" : T.key === "night" ? "#7fa8d8" : "#ffffff";
          ctx2.fillRect(px - w * 0.3 + (r - 0.5) * 8, yy, w * (0.16 + ph * 0.3), Math.max(1, z * 1.1));
        }
        ctx2.restore();
        return;
      }
      if (eh > 0.4) {
        ctx2.beginPath();
        ctx2.moveTo(px - w / 2, py);
        ctx2.lineTo(px, py + h / 2);
        ctx2.lineTo(px, py + h / 2 + eh);
        ctx2.lineTo(px - w / 2, py + eh);
        ctx2.closePath();
        ctx2.fillStyle = shade(28, 18, 20, T.faceL);
        ctx2.fill();
        ctx2.beginPath();
        ctx2.moveTo(px, py + h / 2);
        ctx2.lineTo(px + w / 2, py);
        ctx2.lineTo(px + w / 2, py + eh);
        ctx2.lineTo(px, py + h / 2 + eh);
        ctx2.closePath();
        ctx2.fillStyle = shade(28, 18, 16, T.faceR);
        ctx2.fill();
      }
      diamond(ctx2, px, py, w + 0.8, h + 0.8);
      ctx2.fillStyle = this.tileColor(c);
      ctx2.fill();
      if (c.terrain === TERRAIN.ROAD || c.terrain === TERRAIN.AVENUE) {
        this.drawRoad(c, px, py, w, h);
      } else if (c.terrain === TERRAIN.PARK || c.terrain === TERRAIN.GREEN) {
        this.drawPark(c, px, py, w, h);
      } else if (this.layer === "normal") {
        ctx2.save();
        diamond(ctx2, px, py, w + 0.8, h + 0.8);
        ctx2.clip();
        diamond(ctx2, px, py, w + 0.8, h + 0.8);
        ctx2.fillStyle = shade(212, 4, 58, T.faceTop);
        ctx2.fill();
        diamond(ctx2, px, py, w * 0.86, h * 0.86);
        ctx2.fillStyle = this.tileColor(c);
        ctx2.fill();
        ctx2.restore();
        ctx2.strokeStyle = shade(212, 3, 72, T.faceTop, 0.5);
        ctx2.lineWidth = Math.max(0.4, z * 0.55);
        diamond(ctx2, px, py, w * 0.86, h * 0.86);
        ctx2.stroke();
        if (z > 0.5 && c.building) {
          const r = hash2(c.gx, c.gy, 44);
          if (r > 0.6) {
            ctx2.save();
            diamond(ctx2, px, py, w * 0.84, h * 0.84);
            ctx2.clip();
            ctx2.strokeStyle = "rgba(255,255,255,.18)";
            ctx2.lineWidth = Math.max(0.4, z * 0.5);
            for (let i = -2; i <= 2; i++) {
              ctx2.beginPath();
              ctx2.moveTo(px - w * 0.3 + i * w * 0.08, py + h * 0.28);
              ctx2.lineTo(px - w * 0.06 + i * w * 0.08, py + h * 0.4);
              ctx2.stroke();
            }
            ctx2.restore();
          }
          if (r < 0.42 && z > 0.6) {
            this.drawTree(px + (r - 0.2) * w * 0.5, py + h * 0.3, z * 0.7, c.gx * 3, c.gy * 5);
          }
        }
        if (c.vacant && !c.projectId) {
          ctx2.save();
          diamond(ctx2, px, py, w * 0.9, h * 0.9);
          ctx2.clip();
          ctx2.fillStyle = "rgba(190,175,150,0.13)";
          for (let i = 0; i < 16; i++) {
            const rx = hash2(c.gx * 31 + i, c.gy * 17), ry = hash2(c.gx * 13, c.gy * 29 + i);
            ctx2.fillRect(px - w / 2 + rx * w, py - h / 2 + ry * h, z * 1.6, z * 1.1);
          }
          ctx2.restore();
        }
      }
      diamond(ctx2, px, py, w + 0.8, h + 0.8);
      ctx2.fillStyle = T.groundTint;
      ctx2.fill();
    }
    drawRoad(c, px, py, w, h) {
      const { ctx: ctx2 } = this;
      const z = this.zoom, T = this.time;
      const avenue = c.terrain === TERRAIN.AVENUE;
      const g = this.g;
      const at = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H ? g.cells[y * MAP_W + x] : null;
      const isRoad = (cc) => cc && (cc.terrain === TERRAIN.ROAD || cc.terrain === TERRAIN.AVENUE);
      const n = isRoad(at(c.gx, c.gy - 1)), s = isRoad(at(c.gx, c.gy + 1));
      const e = isRoad(at(c.gx + 1, c.gy)), ww = isRoad(at(c.gx - 1, c.gy));
      ctx2.save();
      diamond(ctx2, px, py, w, h);
      ctx2.clip();
      ctx2.fillStyle = "rgba(0,0,0,.05)";
      for (let i = 0; i < 6; i++) {
        const rx = hash2(c.gx * 7 + i, c.gy * 3), ry = hash2(c.gx, c.gy * 11 + i);
        ctx2.fillRect(px - w / 2 + rx * w, py - h / 2 + ry * h, w * 0.1, h * 0.12);
      }
      ctx2.strokeStyle = avenue ? "rgba(235,200,90,0.55)" : "rgba(250,252,255,0.42)";
      ctx2.lineWidth = Math.max(0.6, z * (avenue ? 1.2 : 0.9));
      ctx2.setLineDash(avenue ? [] : [z * 5, z * 5]);
      if (e || ww) {
        ctx2.beginPath();
        ctx2.moveTo(px - w / 2, py);
        ctx2.lineTo(px + w / 2, py);
        ctx2.stroke();
      }
      if (n || s) {
        ctx2.beginPath();
        ctx2.moveTo(px, py - h / 2);
        ctx2.lineTo(px, py + h / 2);
        ctx2.stroke();
      }
      ctx2.setLineDash([]);
      if ((n || s) && (e || ww)) {
        ctx2.fillStyle = "rgba(250,252,255,0.5)";
        for (let i = 0; i < 4; i++) {
          const t0 = 0.18 + i * 0.12;
          ctx2.beginPath();
          ctx2.moveTo(px + w * 0.5 * t0, py - h * 0.5 * t0);
          ctx2.lineTo(px + w * 0.5 * (t0 + 0.06), py - h * 0.5 * (t0 + 0.06));
          ctx2.lineTo(px + w * 0.5 * (t0 + 0.06) + w * 0.1, py - h * 0.5 * (t0 + 0.06) + h * 0.1);
          ctx2.lineTo(px + w * 0.5 * t0 + w * 0.1, py - h * 0.5 * t0 + h * 0.1);
          ctx2.closePath();
          ctx2.fill();
        }
      }
      if (T.street > 0) {
        const lit = `rgba(255,214,150,${0.13 * T.street})`;
        ctx2.fillStyle = lit;
        ctx2.beginPath();
        ctx2.ellipse(px - w * 0.26, py + h * 0.1, w * 0.2, h * 0.4, 0, 0, Math.PI * 2);
        ctx2.fill();
        ctx2.beginPath();
        ctx2.ellipse(px + w * 0.26, py - h * 0.1, w * 0.2, h * 0.4, 0, 0, Math.PI * 2);
        ctx2.fill();
      }
      ctx2.restore();
      if (avenue && z > 0.5) {
        for (const sgn of [-1, 1]) {
          if (hash2(c.gx * 7 + sgn, c.gy * 11) > 0.45) {
            this.drawTree(px + sgn * w * 0.3, py + sgn * h * 0.3, z * 0.85, c.gx + sgn, c.gy);
          }
        }
      }
      if (z > 0.45 && (avenue || hash2(c.gx, c.gy, 5) > 0.5)) {
        const cars = avenue ? 2 : 1;
        for (let i = 0; i < cars; i++) {
          const sd = hash2(c.gx * 3 + i, c.gy * 5);
          const horiz = (e || ww) && (sd > 0.5 || !(n || s));
          const speed = 0.12 + sd * 0.1;
          let p = (this.t * speed + sd) % 1;
          const dir = sd > 0.5 ? 1 : -1;
          if (dir < 0) p = 1 - p;
          const off = (i === 0 ? -1 : 1) * (horiz ? h : w) * 0.11;
          const cxp = horiz ? px - w / 2 + p * w : px + off * 0.6;
          const cyp = horiz ? py + off : py - h / 2 + p * h;
          const cl = ["#d8dde6", "#2f3644", "#b03a3a", "#3a6fb0", "#d8b23a"][Math.floor(sd * 5)];
          ctx2.fillStyle = cl;
          const cwid = Math.max(2, z * 4.2), chei = Math.max(1.4, z * 2.4);
          ctx2.fillRect(cxp - cwid / 2, cyp - chei / 2, cwid, chei);
          if (T.street > 0.3) {
            ctx2.fillStyle = `rgba(255,230,170,${0.5 * T.street})`;
            ctx2.fillRect(cxp + (horiz ? dir * cwid / 2 : 0) - 1, cyp - 0.8, 2.2, 1.6);
          }
        }
      }
    }
    drawPark(c, px, py, w, h) {
      const { ctx: ctx2 } = this;
      const z = this.zoom, T = this.time;
      ctx2.save();
      diamond(ctx2, px, py, w * 0.98, h * 0.98);
      ctx2.clip();
      for (let i = 0; i < 10; i++) {
        const rx = hash2(c.gx * 19 + i, c.gy * 23), ry = hash2(c.gx * 29, c.gy * 31 + i);
        ctx2.fillStyle = `rgba(${90 + rx * 40},${140 + ry * 50},${70 + rx * 30},0.14)`;
        ctx2.beginPath();
        ctx2.ellipse(px - w / 2 + rx * w, py - h / 2 + ry * h, w * 0.14, h * 0.16, 0, 0, Math.PI * 2);
        ctx2.fill();
      }
      ctx2.strokeStyle = "rgba(210,200,180,0.18)";
      ctx2.lineWidth = Math.max(1, z * 2.4);
      ctx2.beginPath();
      ctx2.moveTo(px - w / 2, py);
      ctx2.quadraticCurveTo(px, py - h * 0.2, px + w / 2, py);
      ctx2.stroke();
      ctx2.restore();
      const n = 4 + Math.floor(hash2(c.gx, c.gy, 3) * 3);
      for (let i = 0; i < n; i++) {
        const rx = hash2(c.gx * 37 + i, c.gy * 41), ry = hash2(c.gx * 43, c.gy * 47 + i);
        const ox = (rx - 0.5) * w * 0.62, oy = (ry - 0.5) * h * 0.62;
        this.drawTree(px + ox, py + oy, z * (0.8 + rx * 0.6), c.gx + i, c.gy);
      }
    }
    drawTree(x, y, z, sx, sy) {
      const { ctx: ctx2 } = this;
      const T = this.time;
      const th = (7 + hash2(sx, sy, 9) * 7) * z;
      const tr = (3.4 + hash2(sx, sy, 10) * 2.6) * z;
      ctx2.fillStyle = shade(30, 26, 18, T.faceR);
      ctx2.fillRect(x - z * 0.6, y - th * 0.55, Math.max(1, z * 1.2), th * 0.6);
      const g = ctx2.createRadialGradient(x - tr * 0.3, y - th - tr * 0.3, tr * 0.2, x, y - th, tr * 1.3);
      const dark = T.key === "night";
      g.addColorStop(0, dark ? "#1d3a2a" : shade(108, 38, 40, T.faceTop));
      g.addColorStop(1, dark ? "#0e1f18" : shade(120, 32, 22, T.faceR));
      ctx2.fillStyle = g;
      ctx2.beginPath();
      ctx2.ellipse(x, y - th, tr, tr * 0.92, 0, 0, Math.PI * 2);
      ctx2.fill();
    }
    // --------------------------------------------------------
    //  建物
    // --------------------------------------------------------
    buildingSprite(c) {
      const key = `${c.id}|${this.cam.zoomIdx}|${this.time.key}`;
      const pj = c.projectId ? this.g.projects.find((p) => p.id === c.projectId) : null;
      const fullKey = pj ? `${key}|c${Math.round(pj.progress * 10)}` : key;
      let s = this.cache.get(fullKey);
      if (s) return s;
      if (this.budget <= 0) {
        const old = this.last.get(c.id);
        if (old) return old;
      }
      this.budget--;
      if (pj && pj.status !== "done") {
        const pseudo = { use: pj.use, floors: pj.floors, grade: pj.grade, facade: "grid", height: pj.heightM, seed: pj.seed, lit: 0.4, antenna: false, crown: 0 };
        s = renderBuilding(pseudo, this.time, this.zoom, { construction: pj.progress });
      } else if (c.building) {
        s = renderBuilding(c.building, this.time, this.zoom);
      } else return null;
      this.cache.set(fullKey, s);
      this.last.set(c.id, s);
      return s;
    }
    // --------------------------------------------------------
    //  メイン描画

  // src/sim/hr.js
  function orgPower(g) {
    const out = {};
    for (const d of DEPT_IDS) {
      const list = g.staff.filter((s) => s.dept === d && !s.subsidiary);
      let wsum = 0, asum = 0, cap = 0;
      for (const s of list) {
        const w = 1 + s.rank * 0.42;
        const eff = s.abil[DEPTS[d].key] * (0.72 + s.morale * 0.42);
        wsum += w;
        asum += eff * w;
        cap += w * (0.8 + s.morale * 0.4);
      }
      out[d] = {
        quality: wsum ? clamp(asum / wsum, 0, 120) : 0,
        capacity: cap,
        count: list.length
      };
    }
    for (const sub of g.subsidiaries) {
      if (sub.type === "sales") out.sales.quality *= 1.08;
      if (sub.type === "construction") out.cons.quality *= 1.1;
      if (sub.type === "pm") out.lease.quality *= 1.08;
      if (sub.type === "reit") out.fin.quality *= 1.06;
    }
    for (const a of g.acquisitions) {
      if (a.failed) continue;
      if (a.kind === "broker") out.sales.quality *= 1.06;
      if (a.kind === "builder") out.cons.quality *= 1.07;
      if (a.kind === "pm") out.lease.quality *= 1.06;
    }
    if (g.hrPolicy.programs.dx) for (const d of DEPT_IDS) out[d].capacity *= 1.12;
    const ce = cultureEffects(g);
    for (const d of DEPT_IDS) {
      out[d].capacity *= ce.capacityMul;
      out[d].quality *= 0.97 + (g.culture ? g.culture.team : 0.5) * 0.06;
    }
    out.total = g.staff.filter((s) => !s.subsidiary).length;
    out.avgSalary = g.staff.length ? g.staff.reduce((a, s) => a + s.salary, 0) / g.staff.length : 0;
    return out;
  }
  function projectCapacity(g) {
    const p = orgPower(g);
    const base = (p.cons.capacity + p.plan.capacity) / 6;
    return Math.max(3, Math.floor(base) + 1 + g.subsidiaries.filter((s) => s.type === "construction").length * 2);
  }
  function personnelCost(g) {
    const salary = g.staff.reduce((a, s) => a + s.salary, 0) / WEEKS_PER_YEAR;
    const welfare = salary * 0.16;
    const programs = HR_PROGRAMS.reduce((a, p) => a + (g.hrPolicy.programs[p.field] ? p.cost / WEEKS_PER_YEAR : 0), 0);
    return salary + welfare + programs;
  }
  function personnelCostYear(g) {
    return personnelCost(g) * WEEKS_PER_YEAR;
  }
  function salaryFairness(g, s) {
    const std = baseSalaryFor(s) * g.hrPolicy.salaryMul;
    return s.salary / Math.max(0.1, std);
  }
  function payIndex(g) {
    if (!g.staff.length) return 1;
    let sum = 0;
    for (const s of g.staff) sum += s.salary / Math.max(0.1, baseSalaryFor(s));
    return sum / g.staff.length;
  }
  function stepHR(g, rng, news) {
    const pol = g.hrPolicy;
    const trainMul = pol.programs.training ? 1.35 : 1;
    const welfare = pol.programs.welfare ? 1 : 0;
    const W = WEEKS_PER_QUARTER;
    const ce = cultureEffects(g);
    const leavers = [];
    for (const s of g.staff) {
      const youth = clamp(1.25 - (s.age - 22) * 0.028, 0.15, 1.25);
      for (const k of ABILITY_IDS) {
        const room = s.potential - s.abil[k];
        if (room > 0) {
          const isMain = DEPTS[s.dept].key === k;
          const gain = room / 100 * youth * trainMul * ce.growthMul * (isMain ? 1.5 : 0.5) * rng.range(0.5, 1.5) * 1.05 / W;
          s.abil[k] = clamp(s.abil[k] + gain, 0, 99);
        } else if (s.age > 48 && rng.chance(0.1 / W)) {
          s.abil[k] = clamp(s.abil[k] - rng.range(0, 0.4), 0, 99);
        }
      }
      s.tenure += 1 / WEEKS_PER_YEAR;
      const fair = salaryFairness(g, s);
      let dm = (fair - 1) * 0.1 + welfare * 0.028 - 0.012 + ce.moraleShift;
      if (s.rank >= 3) dm += 0.012;
      if (g.market.sentiment > 0.65) dm += 8e-3;
      if (g.finance.pl && g.finance.pl.op < 0) dm -= 0.035;
      s.morale = clamp01(s.morale + (dm + rng.normal(0, 0.03)) / W);
      let risk = 0.012;
      risk += Math.max(0, 0.72 - s.morale) * 0.1;
      risk += Math.max(0, 1 - fair) * 0.09;
      risk += (1 - s.loyalty) * 0.022;
      if (pol.programs.welfare) risk *= 0.7;
      if (s.age > 60) risk += 0.16;
      if (avgAbility(s) > 76 && s.rank < 3) risk += 0.02;
      const rel = (avgAbility(s) - 55) / 45;
      risk *= clamp(1 - rel * ce.meritLeave * 0.5, 0.45, 1.8);
      risk *= ce.leaveMul;
      if (rng.chance(clamp01(risk) / W)) leavers.push(s);
    }
    for (const s of leavers) {
      g.staff.splice(g.staff.indexOf(s), 1);
      const why = s.age > 60 ? "\u5B9A\u5E74\u9000\u8077" : salaryFairness(g, s) < 0.92 ? "\u5F85\u9047\u3078\u306E\u4E0D\u6E80" : s.morale < 0.45 ? "\u30E2\u30C1\u30D9\u30FC\u30B7\u30E7\u30F3\u4F4E\u4E0B" : "\u4ED6\u793E\u3078\u306E\u8EE2\u8077";
      news.push({ icon: "\u{1F6AA}", type: "hr", major: s.rank >= 4, text: `${DEPTS[s.dept].name}\u306E${RANKS[s.rank].name}\u30FB${s.name}\u304C\u9000\u8077\u3057\u305F\uFF08${why}\uFF09\u3002` });
    }
    if (isYearStart(g) && g.week > 0) {
      let promoted = 0;
      for (const s of g.staff) {
        s.age += 1;
        const std = baseSalaryFor(s) * pol.salaryMul;
        s.salary = Math.round((s.salary * 0.62 + std * 0.38) * 10) / 10;
      }
      for (let r = RANKS.length - 2; r >= 1; r--) {
        const rank = RANKS[r];
        const cur = g.staff.filter((s) => s.rank === r).length;
        const room = rank.slots === Infinity ? 99 : Math.max(0, rank.slots - cur);
        const cands = g.staff.filter((s) => s.rank === r - 1 && avgAbility(s) >= rank.minAbility && s.tenure >= 2).sort((a, b) => avgAbility(b) + b.abil.lead * 0.4 - (avgAbility(a) + a.abil.lead * 0.4));
        const n = Math.min(room, Math.ceil(cands.length * (0.13 + pol.evalStrict * 0.12 + ce.promoteBoost * 0.14)));
        for (let i = 0; i < n; i++) {
          const s = cands[i];
          if (!s) break;
          s.rank = r;
          s.salary = Math.max(s.salary, baseSalaryFor(s) * pol.salaryMul);
          s.morale = clamp01(s.morale + 0.14);
          promoted++;
          if (r >= 5) news.push({ icon: "\u2B06", type: "hr", major: true, text: `${s.name}\u304C${rank.name}\u306B\u6607\u683C\u3057\u305F\u3002` });
        }
      }
      if (promoted) news.push({ icon: "\u{1F4CB}", type: "hr", major: true, text: `${g.year}\u5E74\u306E\u5B9A\u671F\u4EBA\u4E8B\u3067${promoted}\u540D\u304C\u6607\u683C\u3057\u3001\u5168\u793E\u54E1\u306E\u7D66\u4E0E\u3092\u6539\u5B9A\u3057\u305F\u3002` });
    }
    if (!g.staff.some((s) => s.rank === 7) && g.staff.length) {
      const next = g.staff.slice().sort((a, b) => avgAbility(b) + b.abil.lead - (avgAbility(a) + a.abil.lead))[0];
      next.rank = 7;
      next.salary = baseSalaryFor(next);
      news.push({ icon: "\u{1F451}", type: "hr", major: true, text: `${next.name}\u304C\u65B0\u793E\u9577\u306B\u5C31\u4EFB\u3057\u305F\u3002` });
    }
  }

  }

  function createBrand(g, { name: name2, category, grade }) {
    const G2 = BRAND_GRADES[grade];
    const b = {
      id: uid("B"),
      name: name2.slice(0, 16),
      category,
      grade,
      awareness: 6 + (grade === "premium" ? 4 : 0),
      reputation: 55,

      area: 0,
      units: 0,
      foundedWeek: g.week,
      lastUsedWeek: g.week,
      adSpend: 0

    g.cash -= G2.cost;
    g.finance.quarterAcc.sga += G2.cost;
    g.brands.push(b);

  function brandsFor(g, useId) {
    return g.brands.filter((b) => (BRAND_CATEGORIES[b.category]?.uses || []).includes(useId));

  function getBrand(g, id) {
    return id ? g.brands.find((b) => b.id === id) : null;
  }
  function brandEffect(g, brandId) {
    const b = getBrand(g, brandId);
    if (!b) return { price: 1, speed: 1, rent: 1, awareness: 0 };
    const G2 = BRAND_GRADES[b.grade];
    const a = b.awareness / 100;
    const rep = 0.85 + b.reputation / 340;
    return {
      price: (1 + a * 0.14) * G2.priceMul * rep,
      speed: (1 + a * 0.3) * rep,
      rent: (1 + a * 0.1) * G2.priceMul * rep,
      awareness: b.awareness,
      brand: b
    };
  }
  function growBrand(g, brandId, opt = {}) {
    const b = getBrand(g, brandId);
    if (!b) return;
    const G2 = BRAND_GRADES[b.grade];
    const scale = clamp((opt.area || 0) / 6e3, 0.25, 2.4);
    const gain = (opt.base ?? 3.5) * scale * G2.growth * (1 - b.awareness / (G2.cap + 12));
    b.awareness = clamp(b.awareness + gain, 0, G2.cap);
    b.lastUsedWeek = g.week;
    if (opt.supplied) {
      b.supplied++;
      b.area += opt.area || 0;
      b.units += opt.units || 0;
    }
    if (opt.reputation) b.reputation = clamp(b.reputation + opt.reputation, 0, 100);
  }
  function damageBrand(g, brandId, amount, repHit = 0) {
    const b = getBrand(g, brandId);
    if (!b) return;

      const idle = g.week - b.lastUsedWeek;
      const floor = 3 + b.supplied * 1.5;
      if (idle > 104 && b.awareness > floor) b.awareness = clamp(b.awareness - 0.02, floor, 100);
      if (b.adSpend > 0) {
        const w = b.adSpend / 52;
        g.cash -= w;
        g.finance.quarterAcc.sga += w;
        b.awareness = clamp(b.awareness + b.adSpend / 900 * G2.growth * (1 - b.awareness / (G2.cap + 8)) / 52 * 12, 0, G2.cap);
      }
      b.reputation = clamp(b.reputation + (55 - b.reputation) * 2e-3, 0, 100);
    }
  }

  function weeklyCosts(g, news) {
    const acc = g.finance.quarterAcc;
    const W = WEEKS_PER_QUARTER;
    const personnel = personnelCost(g);
    const fixedQ = 88 + g.assets.length * 12 + g.inventory.length * 8 + g.projects.length * 16 + g.subsidiaries.reduce((a, x) => a + x.upkeep / 4, 0);
    const fixed = fixedQ / W;
    const ad = (g.inventory.length * 22 + g.projects.filter((p) => p.saleArea > 0).length * 14) / W;
    const dxCut = g.hrPolicy.programs.dx ? 0.94 : 1;
    const sga = (personnel + fixed + ad) * dxCut;
    acc.personnel += personnel * dxCut;
    acc.sga += sga;
    g.cash -= sga;
    let hold = 0;
    for (const c of g.cells) {
      if (c.owner === "player" && !c.assetId && !c.invId && !c.isHQ) hold += holdingCost(g, c);
    }
    acc.cogsOther += hold;
    g.cash -= hold;
    const rate = effectiveRate(g);
    const interestAll = g.debt * rate / WEEKS_PER_YEAR;
    g.cash -= interestAll;
    const bsNow = buildBS(g);
    const cipRatio = bsNow.total > 0 ? Math.min(0.45, bsNow.cip / bsNow.total) : 0;
    const capitalized = interestAll * cipRatio;
    if (capitalized > 0 && g.projects.length) {
      const totalCip = g.projects.reduce((a, p) => a + p.spent + p.landCost, 0) || 1;
      for (const p of g.projects) p.spent += capitalized * (p.spent + p.landCost) / totalCip;
    }
    acc.interest += interestAll - capitalized;
    acc.capitalizedInterest = (acc.capitalizedInterest || 0) + capitalized;
    if (g.cash < 0) {
      const burn = Math.max(200, (sga + interestAll) * 8);
      const need = Math.ceil((-g.cash + burn) / 100) * 100;
      const room = Math.max(0, debtCapacity(g) - g.debt);
      const normal = Math.min(need, room);
      if (normal > 0) {
        g.debt += normal;
        g.cash += normal;
      }
      const short = need - normal;
      if (short > 0) {
        g.debt += short;
        g.cash += short;
        g.overdraftWeeks = (g.overdraftWeeks || 0) + 1;
        if (g.overdraftWeeks % 4 === 1) {
          news.push({
            icon: "\u{1F6A8}",
            type: "fin",
            major: true,
            text: `\u501F\u5165\u67A0\u3092${Math.round(short / 100).toLocaleString()}\u5104\u5186\u8D85\u904E\u3057\u3066\u5F53\u5EA7\u501F\u8D8A\u3092\u5B9F\u884C\u3057\u305F\u3002\u30DA\u30CA\u30EB\u30C6\u30A3\u91D1\u5229\u304C\u304B\u304B\u3063\u3066\u3044\u308B\u3002`
          });
        }

  function closeQuarter(g, rng, news) {

    const cogs = acc.cogsSale + acc.cogsLease + acc.cogsOther;
    const gross = revenue - cogs;
    const op = gross - acc.sga;
    const interest = acc.interest;
    const nonop = -interest;
    const ordinary = op + nonop;
    const extra = acc.gainSale - acc.impairment + acc.extraordinary;
    const pretax = ordinary + extra;
    const tax = pretax > 0 ? Math.round(pretax * 0.305) : 0;
    acc.tax = tax;
    g.cash -= tax;
    const net = pretax - tax;
    const R2 = (v) => Math.round(v);
    const pl = {
      revenue: R2(revenue),
      revSale: R2(acc.revSale),
      revLease: R2(acc.revLease),
      revFee: R2(acc.revFee),
      cogs: R2(cogs),
      cogsSale: R2(acc.cogsSale),

      buildSpend: R2(acc.buildSpend),
      capitalizedInterest: R2(acc.capitalizedInterest || 0)
    };
    const bs = buildBS(g);
    g.equity = bs.equity;
    g.finance.pl = pl;
    g.finance.bs = bs;
    g.finance.history.push({
      year: g.year,
      q: g.quarter,
      week: g.week,
      pl,
      bs,
      rating: ratingOf(g).id,
      price: g.company.listed ? sharePrice(g) : 0
    });
    if (g.finance.history.length > 200) g.finance.history.shift();
    g.kpi.cumRevenue += pl.revenue;
    g.kpi.cumProfit += pl.net;
    g.kpi.bestQuarter = Math.max(g.kpi.bestQuarter, pl.net);

    const raw = {};

    for (const d of DEPT_IDS) {

      quota[d] = Math.round(raw[d]);
      assigned += quota[d];
    }
    let diff = n - assigned;
    const order = DEPT_IDS.filter((d) => (plan[d] || 0) > 0).sort((a, b) => raw[b] - quota[b] - (raw[a] - quota[a]));

        diff--;

  function stepRivalsQuarter(g, rng, news) {

      rv.assets = Math.round(rv.assets * (1 + growth * 0.85));

      rv.cash = Math.round(rv.cash + rv.np * 0.5 - rv.rev * 0.02);

      rv.stock = Math.round(rv.stock * (1 + growth * 1.6 + cyc * 0.03 + rng.normal(0, 0.03)) * 100) / 100;

        </div>

      <div class="sec">

      ].map(([k, n]) => `<div class="kv"><span class="k">${n}</span><span class="v">${((ap.parts[k] || 0) * 100).toFixed(0)}</span></div>

        <div class="hint">\u58F2\u4E0A\u9AD8\u304C\u4F38\u3073\u3066\u4F1A\u793E\u304C\u77E5\u3089\u308C\u308B\u3088\u3046\u306B\u306A\u308B\u3068\u3001\u5B66\u751F\u306E\u5FDC\u52DF\u306F\u81EA\u7136\u306B\u5897\u3048\u308B\u3002\u4E0A\u4F4D\u6821\u306E\u5B66\u751F\u304C\u96C6\u307E\u308B\u304B\u3069\u3046\u304B\u3082\u3053\u3053\u3067\u6C7A\u307E\u308B\u3002</div>

      }
      if (r.phase === "attract") {
        const top = r.pool.slice().sort((a, b) => b.interest - a.interest).slice(0, 6);
        const byTier = Object.values(TIERS).map((t) => `${t.label} ${r.pool.filter((c) => c.tier === t.id).length}\u540D`).join("\u3000");
        const topUni = Object.entries(r.pool.reduce((a, c) => {
          a[c.uniName] = (a[c.uniName] || 0) + 1;

        }, {})).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([n, v]) => `${n} ${v}`).join("\u3000");
        return `
        <div class="grid3" style="margin-bottom:12px">
          ${mini("\u30A8\u30F3\u30C8\u30EA\u30FC", r.pool.length + "\u540D")}
          ${mini("\u8A08\u753B", r.plan + "\u540D")}
          ${mini("\u500D\u7387", (r.pool.length / Math.max(1, r.plan)).toFixed(1) + "\u500D")}
        </div>
        <div class="hint">${byTier}</div>
        <div class="hint">${topUni}</div>
        <div class="hint">6\u6708\u7B2C1\u9031\u76EE\u304B\u3089\u9078\u8003\u304C\u59CB\u307E\u308B\u3002\u305D\u308C\u307E\u3067\u306F\u5B66\u751F\u306E\u5FD7\u671B\u5EA6\u304C\u52D5\u304F\u3060\u3051\u3067\u3042\u308B\u3002</div>
        <div class="sec"><div class="sec-t"><span>\u5FD7\u671B\u5EA6\u306E\u9AD8\u3044\u5B66\u751F</span></div>

      if (r.phase === "screening") {
        const list = r.pool.filter((c) => c.status === "interview").sort((a, b) => (b.seen || 0) - (a.seen || 0));

          ${mini("\u9762\u63A5\u4E2D", list.length + "\u540D")}
          ${mini("\u8A08\u753B", r.plan + "\u540D")}
          ${mini("\u898B\u6975\u3081\u7CBE\u5EA6", (55 + orgPower(g).hr.quality / 2.4).toFixed(0) + "%")}

        <div class="hint">7\u6708\u7B2C1\u9031\u76EE\u304B\u3089\u5185\u5B9A\u3092\u51FA\u305B\u308B\u3002\u9762\u63A5\u3092\u91CD\u306D\u308B\u307B\u3069\u63A8\u5B9A\u306E\u5E45\u304C\u72ED\u307E\u308B\u3002</div>
        ${list.slice(0, 20).map((c) => candCard(c, "view")).join("")}

      }
      if (r.phase === "offer") {
        const list = r.pool.filter((c) => c.status === "interview").sort((a, b) => (b.seen || 0) - (a.seen || 0));
        const lost = r.pool.filter((c) => c.status === "lost").length;
        return `
        <div class="grid4" style="margin-bottom:12px">
          ${mini("\u5185\u5B9A\u6E08\u307F", r.offers.length + "\u540D")}
          ${mini("\u5019\u88DC", list.length + "\u540D")}
          ${mini("\u8A08\u753B", r.plan + "\u540D")}

        <div class="hint">\u5185\u5B9A\u306F\u591A\u3081\u306B\u51FA\u3059\u306E\u304C\u5B9A\u77F3\u3067\u3042\u308B\u300210\u6708\u306E\u5185\u5B9A\u5F0F\u3067\u5FD7\u671B\u5EA6\u306E\u4F4E\u3044\u5B66\u751F\u306F\u8F9E\u9000\u3059\u308B\u3002\u30D5\u30A9\u30ED\u30FC\u9762\u8AC7\u306F\u627F\u8AFE\u7387\u3092\u5927\u304D\u304F\u5F15\u304D\u4E0A\u3052\u308B\u3002</div>
        ${r.offers.length ? `<div class="sec"><div class="sec-t"><span>\u5185\u5B9A\u3092\u51FA\u3057\u305F\u5B66\u751F</span></div>

        <div class="sec"><div class="sec-t"><span>\u9762\u63A5\u901A\u904E\u8005</span></div>
          ${list.length ? list.slice(0, 24).map((c) => candCard(c, "offer")).join("") : empty("\u5019\u88DC\u8005\u304C\u3044\u306A\u3044")}</div>
        ${planUI}`;
      }
      const acc = r.offers.filter((c) => c.status === "accepted");
      return `
      <div class="grid3" style="margin-bottom:12px">
        ${mini("\u5185\u5B9A\u627F\u8AFE", acc.length + "\u540D")}
        ${mini("\u8F9E\u9000", r.declined + "\u540D")}
        ${mini("\u8A08\u753B", r.plan + "\u540D", `\u5145\u8DB3\u7387 ${Math.round(acc.length / Math.max(1, r.plan) * 100)}%`)}
      </div>
      <div class="hint">4\u6708\u7B2C1\u9031\u76EE\u306B\u5165\u793E\u3059\u308B\u3002\u914D\u5C5E\u4E88\u5B9A\uFF1A${DEPT_IDS.filter((d) => allocateQuota(r.deptPlan, acc.length)[d] > 0).map((d) => `${DEPTS[d].short} ${allocateQuota(r.deptPlan, acc.length)[d]}\u540D`).join("\u30FB") || "\u2014"}</div>
      ${acc.map((c) => candCard(c, "view")).join("")}
      ${planUI}`;
    }
    function refresh2() {
      document.getElementById("modalBody").innerHTML = build();
      bind();
      ctx2.refresh();
    }
    function bind() {
      const body = document.getElementById("modalBody");
      body.querySelectorAll("[data-dp]").forEach((el) => el.onclick = () => {
        const d = el.dataset.d;
        r.deptPlan = r.deptPlan || {};
        const v = r.deptPlan[d] || 0;
        r.deptPlan[d] = el.dataset.dp === "plus" ? Math.min(40, v + 1) : Math.max(0, v - 1);
        refresh2();
      });
      body.querySelectorAll(".invRange").forEach((el) => el.oninput = (e) => {
        r.invest[e.target.dataset.inv] = +e.target.value;
        const lab = e.target.previousElementSibling.querySelector("b");
        if (lab) lab.textContent = money(+e.target.value);
      });
      const save2 = body.querySelector("[data-save]");
      if (save2) save2.onclick = () => {
        r.plan = Math.max(0, Math.round(+body.querySelector("#inpPlan").value));
        const sal = body.querySelector("#inpSal");
        if (sal && !sal.disabled) {
          const nv = Math.max(3.8, +sal.value / 100);
          if (nv > r.salary && r.offers.length) {
            for (const c of r.offers) c.interest = Math.min(1, c.interest + (nv - r.salary) * 0.12);
          }
          r.salary = nv;
        }
        toast("\u63A1\u7528\u8A08\u753B\u3092\u66F4\u65B0\u3057\u305F");
        refresh2();
      };
      const addInv = body.querySelector("[data-addinv]");
      if (addInv) addInv.onclick = () => {
        const now = RECRUIT_INVEST.reduce((a, x) => a + r.invest[x.id], 0);
        const extra = Math.max(0, now - (r.spent || 0));
        if (extra <= 0) return toast("\u8FFD\u52A0\u5206\u304C\u306A\u3044\u3002\u30B9\u30E9\u30A4\u30C0\u30FC\u3092\u52D5\u304B\u3057\u3066\u304B\u3089\u5B9F\u884C\u3059\u308B\u3053\u3068", "bad");
        if (g.cash < extra) return toast("\u8CC7\u91D1\u304C\u4E0D\u8DB3\u3057\u3066\u3044\u308B", "bad");
        g.cash -= extra;
        g.finance.quarterAcc.sga += extra;
        r.spent = (r.spent || 0) + extra;
        const boost = Math.min(0.14, extra / 2400);
        for (const c of r.pool) c.interest = Math.min(1, c.interest + boost);
        toast(`${money(extra)}\u3092\u8FFD\u52A0\u6295\u8CC7\u3057\u305F`, "good");
        ctx2.refresh();
        refresh2();
      };
      body.querySelectorAll("[data-offer]").forEach((b) => b.onclick = () => {
        const c = r.pool.find((x) => x.id === b.dataset.offer);
        if (c && makeOffer(g, c)) {
          toast(`${c.name}\u306B\u5185\u5B9A\u3092\u51FA\u3057\u305F`, "good");
          refresh2();
        }
      });
      body.querySelectorAll("[data-withdraw]").forEach((b) => b.onclick = () => {
        const c = r.offers.find((x) => x.id === b.dataset.withdraw);
        if (c) {
          withdrawOffer(g, c);
          toast("\u5185\u5B9A\u3092\u53D6\u308A\u6D88\u3057\u305F");
          refresh2();
        }
      });
      body.querySelectorAll("[data-follow]").forEach((b) => b.onclick = () => {
        const c = r.offers.find((x) => x.id === b.dataset.follow);
        if (c && followUp(g, c)) {
          toast(`${c.name}\u3068\u30D5\u30A9\u30ED\u30FC\u9762\u8AC7\u3092\u884C\u3063\u305F`, "good");
          refresh2();
        } else toast("\u8CC7\u91D1\u304C\u4E0D\u8DB3\u3057\u3066\u3044\u308B", "bad");
      });
    }
  }

    <button class="title-save" data-slot="${s.id}">
      <span class="ts-l">${s.label}</span>
      <span class="ts-m"><b>${s.meta.company}</b>\u3000${s.meta.year}\u5E74 ${s.meta.month}\u6708 \u7B2C${s.meta.weekOfMonth}\u9031\u76EE</span>
      <span class="ts-r">\u7D9A\u304D\u304B\u3089 \u25B6</span>
    </button>`).join("");
    box.querySelectorAll("[data-slot]").forEach((b) => b.onclick = () => {
      const g = loadFrom(b.dataset.slot);
      if (g) startGame(g);
    });
  })();
  document.getElementById("btnStart").onclick = () => startGame(null);
})();

</script>
