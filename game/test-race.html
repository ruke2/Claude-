<!doctype html>
<html><head><meta charset="utf-8"><title>race test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#c{position:fixed;inset:0}</style></head>
<body><div id="c"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="js/data.js"></script><script src="js/realhorses.js"></script><script src="js/realjockeys.js"></script>
<script src="js/courses_jp.js"></script><script src="js/race.js"></script><script src="js/world.js"></script>
<script src="js/zekken.js"></script><script src="js/horse3d.js"></script><script src="js/horseglb.js"></script><script src="js/post.js"></script><script src="js/render3d.js"></script>
<script>
const q = new URLSearchParams(location.search);
const W = World.newGame({ name: 'test' });
const venue = q.get('v') || 'tokyo';
const race = W.card[10]; race.venue = venue; race.surf = q.get('surf') || 'T'; race.dist = +(q.get('d') || 2000);
if (q.get('g1')) { race.graded = +q.get('g1'); race.name = q.get('rn') || '有馬記念'; } if (q.get('sp')) { race.name = '若葉特別'; race.graded = 0; }
race.weather = q.get('w') || '晴'; race.ground = q.get('g') || '良';
const hid = race.field[2].hid;
const eng = World.setupRace(W, race, hid, 'auto');
const R3 = new Render3D(document.getElementById('c'));
HorseGLB.load().then(() => { window.glbInfo = HorseGLB.info; R3.setupRace(eng, { label: race.name, cloth: { kind: Zekken.kindOf(race), race: race.name, no: race.no, venue: VENUES[race.venue].name, intl: /ジャパンC/.test(race.name) } }); R3.setCamMode(['gate','goal','air1','air2','air3','top','stand','stand2','close','close2','close3','close4','close5','closeL','closeR','crowd','gside'].includes(q.get('cam')) ? 'chase' : (q.get('cam') || 'jockey')); go(); });
const tEnd = +(q.get('t') || 0);
function go() {
  if (Render3D.loaded < Render3D.toLoad) return setTimeout(go, 100);
  while (eng.t < tEnd) eng.step(1 / 30);
  if (q.get('intro')) { R3.startIntro({ perHorse: +(q.get('per') || 0), loadMin: +(q.get('lm') || 0), flyLen: q.get('per') ? 6 : 4.6 }); while (R3.intro.t < +q.get('intro')) R3.render(eng, 0.4); } else
  for (let i = 0; i < 4; i++) { eng.step(1 / 60); R3.render(eng, 1 / 60); }
  setTimeout(() => { const cm = q.get('cam'), co0 = eng.course, XY = RaceEngine.courseXY;
  if (cm === 'sky') { const bb = co0.bbox || { minX: -co0.H / 2 - co0.R, maxX: co0.H / 2 + co0.R, minZ: -2 * co0.R, maxZ: 2 * co0.R }; const cx = (bb.minX + bb.maxX) / 2, cz = (bb.minZ + bb.maxZ) / 2; R3.camera.far = 9000; R3.camera.fov = 40; R3.camera.updateProjectionMatrix(); R3.camera.position.set(cx, 1300, cz + 650); R3.camera.lookAt(cx, 0, cz); }
  if (cm === 'air1') { const a = XY(co0, co0.H - 190, -130), b = XY(co0, co0.H - 60, co0.width + 60); R3.camera.position.set(a.x, 22, a.z); R3.camera.lookAt(b.x, 18, b.z); }
  else if (cm === 'air2') { const a = XY(co0, co0.H - 120, co0.width + 330), b = XY(co0, co0.H - 250, -100); R3.camera.position.set(a.x, 170, a.z); R3.camera.lookAt(b.x, 0, b.z); }
  else if (cm === 'air3') { const a = XY(co0, co0.H + co0.T + co0.H * 0.5 - 60, 6), b = XY(co0, co0.H + co0.T + co0.H * 0.5 + 60, co0.width + 30); R3.camera.position.set(a.x, RaceEngine.elevAt(co0, co0.H + co0.T + co0.H * 0.5) + 2.6, a.z); R3.camera.lookAt(b.x, 4, b.z); }
  if (cm === 'top') { const L = eng.runners.reduce((b, r) => r.s > b.s ? r : b); const pl = eng.pAt(L.s) - 14; const a = XY(co0, pl - 22, co0.width + 14), b = XY(co0, pl, 4); const e0 = RaceEngine.elevAt(co0, pl); R3.camera.position.set(a.x, e0 + 26, a.z); R3.camera.lookAt(b.x, e0, b.z); }
    if (cm === 'stand') { const a = XY(co0, co0.H - 330, co0.width + 14), b = XY(co0, co0.H - 120, co0.width + 60); R3.camera.position.set(a.x, RaceEngine.elevAt(co0, co0.H - 330) + 1.7, a.z); R3.camera.lookAt(b.x, 16, b.z); }
  if (cm === 'stand2') { const a = XY(co0, co0.H - 60, -40), b = XY(co0, co0.H - 200, co0.width + 60); R3.camera.position.set(a.x, RaceEngine.elevAt(co0, co0.H) + 6, a.z); R3.camera.lookAt(b.x, 14, b.z); }
    if (/^close/.test(cm || '')) { const pl = eng.player, a = XY(co0, eng.pAt(pl.s), pl.X), e0 = RaceEngine.elevAt(co0, eng.pAt(pl.s)); const out = co0.dir === 'L' ? 1 : 1;
    const k = cm === 'close' ? [0.3, 4.6, 1.5, 1.3] : cm === 'close2' ? [-3.2, 2.4, 2.2, 1.6] : cm === 'close3' ? [3.4, 2.6, 1.7, 1.5] : cm === 'close5' ? [0.3, 2.6, 2.1, 1.95] : cm === 'closeL' ? [0.1, -3.4, 1.8, 1.45] : cm === 'closeR' ? [0.1, 3.4, 1.8, 1.45] : [0.4, 2.3, 2.0, 1.9];
    R3.camera.fov = cm === 'close4' ? 30 : 34; R3.camera.updateProjectionMatrix();
    R3.playerModel.setPlayerView(false); R3.playerModel.update({ phase: pl.phase, speed: pl.v, effort: +(q.get('eff') || pl.effort), whipT: +(q.get('whip') || 0), whipSide: 1, kakari: 0, lean: 0 }, 0.016, 1);
    R3.camera.position.set(a.x + a.hx * k[0] + a.nx * k[1], e0 + k[2], a.z + a.hz * k[0] + a.nz * k[1]); R3.camera.lookAt(a.x + a.hx * 0.2, e0 + k[3], a.z + a.hz * 0.2); }
  if (cm === 'crowd') { const a = XY(co0, co0.H - 150, co0.width + 6), b = XY(co0, co0.H - 140, co0.width + 20); R3.camera.position.set(a.x, RaceEngine.elevAt(co0, co0.H - 150) + 1.7, a.z); R3.camera.lookAt(b.x, 1.6, b.z); R3.camera.fov = 45; R3.camera.updateProjectionMatrix(); }
    if (cm === 'gside') { const p0 = eng.pAt(0); const a = XY(co0, p0 + 4, -6), b = XY(co0, p0, 6); const e0 = RaceEngine.elevAt(co0, p0); R3.camera.position.set(a.x, e0 + 1.2, a.z); R3.camera.lookAt(b.x, e0 + 0.8, b.z); R3.camera.fov = 50; R3.camera.updateProjectionMatrix(); const g = R3.gate.grp, rc = new THREE.Raycaster(), hits = []; [0, 4, 8, 12].forEach(X => { const q = XY(co0, p0, X); rc.set(new THREE.Vector3(q.x, e0 + 20, q.z), new THREE.Vector3(0, -1, 0)); const hs = rc.intersectObjects(R3.raceGroup.children, true).filter(h => { let o = h.object; while (o) { if (o === g) return false; o = o.parent; } return h.object.isMesh && !h.object.isInstancedMesh; }); hits.push(hs.length ? +hs[0].point.y.toFixed(3) : null); });
  const q0 = XY(co0, p0, 6), near = []; R3.raceGroup.children.forEach((o, oi) => { if (!o.isMesh || o.isInstancedMesh || !o.geometry.attributes.position || o.geometry.attributes.position.count < 500) return; const P = o.geometry.attributes.position; let best = 1e9, by = null; for (let i = 0; i < P.count; i++) { const dx = P.getX(i) + o.position.x - q0.x, dz = P.getZ(i) + o.position.z - q0.z, d = dx * dx + dz * dz; if (d < best) { best = d; by = P.getY(i) + o.position.y; } } if (best < 9) near.push([oi, +by.toFixed(2), +Math.sqrt(best).toFixed(1), o.material.side]); });
  window.gateInfo = { near, gy: +g.position.y.toFixed(3), e0, meanE: R3.meanE, p0, H: co0.H, lap: co0.lap, hits, width: co0.width, gx: [g.position.x.toFixed(1), g.position.z.toFixed(1)] }; }
    if (cm === 'goal') { const c = R3.camera; const co = eng.course; const a = RaceEngine.courseXY(co, co.H + 6, 7); const b = RaceEngine.courseXY(co, co.H, -1.6); const e = RaceEngine.elevAt(co, co.H); c.position.set(a.x, e + 3, a.z); c.lookAt(b.x, e + 2.8, b.z); } else if (q.get('cam') === 'gate') { const c = R3.camera; const pl = eng.player; const a = RaceEngine.courseXY(eng.course, eng.pAt(pl.s), pl.X); c.position.set(a.x + a.hx * 9 + a.nx * 4, 3.2, a.z + a.hz * 9 + a.nz * 4); c.lookAt(a.x, 1.4, a.z); } if (R3.grass) R3.grass.t = 0; R3.updateGrass(0.016); R3.draw(); window.done = true; }, 600);
}
</script></body></html>
