<!doctype html>
<html><head><meta charset="utf-8"><title>marks</title><style>html,body{margin:0;background:#9fc2e0}canvas{display:block}</style></head><body>
<!-- 毛色と模様の見え方を確かめるページ（ゲームでは使わない） -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="js/data.js"></script><script src="js/zekken.js"></script><script src="js/horse3d.js"></script><script src="js/horseglb.js"></script>
<script>
const q = new URLSearchParams(location.search), Wd = innerWidth, Hd = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(Wd, Hd); document.body.appendChild(r.domElement);
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#bcd6ea');
sc.add(new THREE.HemisphereLight('#ffffff', '#6a7a4a', 0.7)); const sun = new THREE.DirectionalLight('#fff3e0', 1.6); sun.position.set(2, 5, 6); sc.add(sun);
const view = q.get('view') || 'side';
HorseGLB.load().then(() => {
  const list = [['bay', 1], ['chestnut', 7], ['darkbay', 12], ['grey', 3], ['darkgrey', 21], ['black', 9], ['flaxen', 15], ['liver', 4], ['white', 5], ['white', 31]];
  list.forEach(([k, id], i) => {
    const h = { id, coatKey: k, born: k === 'grey' ? 2020 : 2024 }; if (id === 31) h.marks = { pinto: 0.6, pintoC: '#4a2e1c' };
    const m = Horse3D.create({ coat: Horse3D.coatFor(h), coatKey: k, number: i + 1, raceLabel: '', cloth: { kind: 'normal', num: i + 1, horse: '' }, silks: { base: '#1565c0', accent: '#ffeb3b', pattern: 'plain', cap: '#ffeb3b' }, marks: Horse3D.marksFor(h, 2027), isPlayer: false });
    m.root.position.set((i % 5) * 3.2 - 6.4, 0, Math.floor(i / 5) * -3.4); if (view === 'front') m.root.rotation.y = Math.PI / 2 - 0.5; if (view === 'heads') m.root.rotation.y = 0;
    sc.add(m.root); m.update({ phase: 0.1, speed: 0, effort: 0.2, walk: 1, whipT: 0, whipSide: 1, kakari: 0 }, 0.016, 1);
  });
  const cam = new THREE.PerspectiveCamera(30, Wd / Hd, 0.1, 200);
  if (view === 'heads') { r.setScissorTest(true); } if (view === 'front') { cam.position.set(4, 3.2, 14); cam.lookAt(0, 1.0, -1.7); } else { cam.position.set(0, 3, 17); cam.lookAt(0, 0.9, -1.7); }
  const heads = () => { // 10頭の顔を並べて撮る
    const cw = Wd / 5, ch = Hd / 2;
    list.forEach((_, i) => { const x = (i % 5) * 3.2 - 6.4, z = Math.floor(i / 5) * -3.4; const c2 = new THREE.PerspectiveCamera(26, cw / ch, 0.05, 50); c2.position.set(x + 2.6, 1.75, z + 1.3); c2.lookAt(x + 1.0, 1.35, z);
      r.setViewport((i % 5) * cw, (1 - Math.floor(i / 5)) * ch, cw, ch); r.setScissor((i % 5) * cw, (1 - Math.floor(i / 5)) * ch, cw, ch); r.render(sc, c2); }); };
  let n = 0; const tick = () => { if (view === 'heads') heads(); else r.render(sc, cam); if (++n < 40) setTimeout(tick, 100); else window.done = true; }; tick();
});
</script></body></html>
